name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Two build jobs rather than one matrix, so E2E waits only for the build it
  # restores. `needs` cannot name one leg of a matrix, and with [22.x, 24.x]
  # every E2E run sat behind a 24.x build whose output nothing used (#629).
  #
  # The versions are the ones that ship: the agent runtime image is
  # `node:22-slim`, and both client deployments run the app on `node:20`.
  #
  # Node 24 is no longer built. `engines` in package.json still says
  # `>=20.3`, which covers 24, but nothing in CI now proves the app builds
  # on it. Before any deployment moves to 24 (or a newer major), add a
  # `build-node-24` job shaped like `build-node-20` below. It costs runner
  # minutes, not wall-clock time, because nothing waits on it.
  build:
    name: Build with 22.x
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: 22.x

      - name: Restore or cache Next.js build
        uses: actions/cache@v5
        with:
          path: |
            packages/core/.next/cache
          # Generate a new cache whenever packages or source files change.
          # The root lockfile only, not '**/package-lock.json': there is one
          # lockfile, and the glob walked the restored node_modules first,
          # which cost this step about 15–20s before it started (#631). One
          # matching file either way, so the key doesn't change.
          # next.config.ts is in the key because webpack throws its cache away
          # when the config changes, and a change to the config alone used to
          # hit this exact key, so the fresh cache was never saved (#631).
          key: nextjs-22.x-${{ hashFiles('package-lock.json') }}-${{ hashFiles('packages/core/src/**', 'packages/core/next.config.ts') }}
          # A change under src/ misses the exact key. Start from the newest
          # cache with the same lockfile rather than an empty one: webpack's
          # compile measured 59–74s warm against 81s cold on CI (#631).
          restore-keys: |
            nextjs-22.x-${{ hashFiles('package-lock.json') }}-

      - name: Build Next.js
        # build-local lives in the @vocion/core workspace, not the repo root.
        # In CI it skips Next's own type-check (next.config.ts): `static`
        # already type-checks core once and fails the pull request there.
        run: npm run build-local --workspace @vocion/core
        env:
          NEXT_PUBLIC_SENTRY_DISABLED: 'true' # Only upload Sentry source maps in deployment
          NEXT_PUBLIC_APP_URL: http://localhost:3008
          # next.config.ts imports src/libs/Env.ts, which refuses to load without
          # these. Locally they come from .env.local, which is gitignored and so
          # never reaches the runner. `build-local` boots a throwaway in-memory
          # PGlite on 5432 and migrates against it, which is what this URL points at.
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/vocion_build
          AUTH_SECRET: ci-only-secret-not-used-by-the-build

      # The E2E shards restore this, keyed by the same node version and
      # commit. scripts/wait-for-build-output.sh watches for this step by its
      # name, so rename both together.
      - name: Cache Next.js build output
        uses: actions/cache/save@v5
        with:
          path: |
            packages/core/.next
          key: nextjs-build-22.x-${{ github.sha }}

  build-node-20:
    name: Build with 20.x
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: 20.x

      - name: Restore or cache Next.js build
        uses: actions/cache@v5
        with:
          path: |
            packages/core/.next/cache
          key: nextjs-20.x-${{ hashFiles('package-lock.json') }}-${{ hashFiles('packages/core/src/**', 'packages/core/next.config.ts') }}
          # Same fallback as the 22.x build.
          restore-keys: |
            nextjs-20.x-${{ hashFiles('package-lock.json') }}-

      # Proves the app builds on the oldest Node a deployment runs. Its output
      # is thrown away; E2E runs against the 22.x build. Same env as above.
      - name: Build Next.js
        run: npm run build-local --workspace @vocion/core
        env:
          NEXT_PUBLIC_SENTRY_DISABLED: 'true'
          NEXT_PUBLIC_APP_URL: http://localhost:3008
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/vocion_build
          AUTH_SECRET: ci-only-secret-not-used-by-the-build

  static:
    strategy:
      matrix:
        node-version: [22.x]

    name: Run static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Retrieve Git history, needed to verify commits

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: ${{ matrix.node-version }}

      - if: github.event_name == 'pull_request'
        name: Validate all commits from PR
        run: npx commitlint --from $BASE_SHA --to $HEAD_SHA --verbose
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      # Runs before the build-dependent checks: a payload hidden in a build config
      # would otherwise execute during lint/type-check on the runner.
      - name: Config integrity (malware guard)
        run: npm run check:integrity

      # Refuses a symlink committed with a target outside the checkout. Three
      # `node_modules` symlinks pointing at one laptop reached main in #221,
      # because `.gitignore` said `node_modules/` and the trailing slash does
      # not match a symlink. Same placement reasoning as the step below.
      - name: Committed symlinks
        run: npm run check:symlinks

      # Refuses a migration that would take a write lock on a populated table.
      # See packages/core/migrations/CONVENTIONS.md.
      #
      # Ahead of the linter deliberately. Not because the linter is expected to
      # fail — it is green on `main` as of #367 — but because a step placed
      # after a failing one never runs, and the whole point of this check is to
      # be reached on the branch that is breaking something else. It is also
      # the cheapest step here: no build, no database, ~1s.
      - name: Migration conventions
        run: npm run check:migrations

      - name: Linter
        run: npm run lint

      - name: Type checking
        run: npm run check:types

      - name: Check dependencies
        run: npm run check:deps

      - name: I18n check
        run: npm run check:i18n

  agent-runtime:
    strategy:
      matrix:
        node-version: [22.x]

    name: Check the agent runtime artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: ${{ matrix.node-version }}

      # The artifact deployed to AgentCore Runtime is its own workspace, and
      # until now nothing in CI touched it: the root `check:types` and `test`
      # scripts both named `@vocion/core` alone, and the only place its
      # typecheck ran was a deploy workflow that has been removed. Its suite
      # needs no database and no credentials, so it stands alone rather than
      # joining the unit job's coverage run.
      # No type-check step here: the root `check:types` in `static` runs every
      # workspace's, this one's included.
      - name: Unit tests
        run: npm run test --workspace @vocion/agent-runtime

  unit:
    strategy:
      # Same reason as the E2E shards: each shard reports its own failures.
      fail-fast: false
      matrix:
        node-version: [22.x]
        # One runner took about 430s for the whole suite, which made this the
        # slowest job once E2E stopped waiting on setup (#631). Vitest splits
        # the test files between the shards. The `--shard` argument below has
        # to match this list.
        shard: [1, 2, 3]

    name: Run unit tests (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run unit tests
        uses: docker://mcr.microsoft.com/playwright:v1.58.2
        with:
          # The workspace script, as in the E2E job: through the root script,
          # npm kept anything after `--` as its own config flag, so vitest never
          # saw `--coverage` and Codecov logged "No coverage reports found" on
          # every run until #631. Each shard covers its own third of the files;
          # Codecov merges the three uploads for the commit (codecov.yml waits
          # for all three). Coverage costs about 12% on a shard, measured
          # locally.
          args: sh -c "npm run test --workspace @vocion/core -- --shard=${{ matrix.shard }}/3 --coverage"
        env:
          # T3 env validation needs these present; unit tests mock the DB +
          # LLM clients (vitest stubs the API keys), values are never dialed.
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/vocion_test
          AUTH_SECRET: ci-only-secret-not-used-by-unit-tests

      # A shard that wrote no report fails here, loudly. Before #631 the
      # report was silently missing on every run for months.
      - name: Check the coverage report exists
        run: test -s packages/core/coverage/coverage-final.json

      # One upload per shard. An outage at Codecov doesn't fail the build
      # (the action's default); the check above covers the case that matters.
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: packages/core/coverage/coverage-final.json
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  storybook:
    strategy:
      matrix:
        node-version: [22.x]

    name: Run Storybook
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run storybook tests
        uses: docker://mcr.microsoft.com/playwright:v1.58.2
        with:
          args: npm run storybook:test
        env:
          # Same reason as the build job: Env.ts validates on import, and the
          # stories never dial the database.
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/vocion_storybook
          AUTH_SECRET: ci-only-secret-not-used-by-storybook

  e2e:
    strategy:
      # One shard failing must not cancel the others: each reports its own
      # first failure, and a cancelled shard uploads nothing to read.
      fail-fast: false
      matrix:
        node-version: [22.x]
        # The shards share nothing at runtime. Each has its own Postgres
        # service container, boots its own `next start` from `webServer`,
        # runs the `setup`/`teardown`
        # projects its tests depend on, and the self-seeding projects make
        # their own admin. Each also repeats checkout, install, the build
        # restore and the server boot, most of it now while the build runs,
        # but each shard is still a runner, so more shards
        # stop paying for themselves quickly. Three is the count measured on
        # #629; the `--shard` argument below has to match this list.
        shard: [1, 2, 3]

    name: Run E2E tests (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    # Playwright caps itself at 8 minutes (globalTimeout in
    # packages/core/playwright.config.ts) and stops at the first failure, both
    # per shard, so the limit has to cover those 8, setup and the upload. It used
    # to be 10 with no Playwright cap, and a red run hit this limit before
    # Playwright could print its summary.
    # No `needs: [build]`. A shard starts with the build, pulls the
    # Playwright image, starts Postgres and restores node_modules (about 70s)
    # while the build runs, and waits only for the build output, in the
    # "Wait for the build output" step below (#631). So this limit now also
    # covers the wait: up to the build's own 10 minutes, then Playwright's 8,
    # plus setup and the upload. 20 leaves room for all three; a normal run
    # waits 3–4 minutes.
    timeout-minutes: 20
    # The wait step reads this run's jobs and the cache list.
    permissions:
      contents: read
      actions: read

    # A real Postgres, not the in-memory PGlite the suite boots locally.
    # PGlite accepts one connection, which made every seed script a spec
    # spawned wait about 10s for the app's pool to let go of it, and caused
    # the `Connection terminated unexpectedly` flake in e2e/credentials
    # (#631). pgvector because a migration creates the `vector` extension.
    # The test step runs in a container action, which joins this job's
    # network, so it reaches the database by the service name, `postgres`.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vocion_e2e
        options: >-
          --health-cmd "pg_isready -U postgres -d vocion_e2e"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: ${{ matrix.node-version }}

      - name: Wait for the build output
        run: scripts/wait-for-build-output.sh
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_OUTPUT_CACHE_KEY: nextjs-build-${{ matrix.node-version }}-${{ github.sha }}
          # Longer than the build job's 10-minute limit, so a slow build that
          # succeeds is never abandoned; a build that fails or times out ends
          # the wait on its own, as soon as its job reports.
          WAIT_TIMEOUT_SECONDS: 660

      - name: Restore the build output
        uses: actions/cache/restore@v5
        with:
          path: |
            packages/core/.next
          key: nextjs-build-${{ matrix.node-version }}-${{ github.sha }}
          fail-on-cache-miss: true

      - name: Run E2E tests
        uses: docker://mcr.microsoft.com/playwright:v1.58.2
        with:
          # Set HOME to /root to avoid Playwright error with Firebox. The
          # workspace script, not the root one: the root `test:e2e` re-runs
          # `npm run` itself and drops anything after `--`, so every shard ran
          # the whole suite.
          args: sh -c "HOME=/root npm run test:e2e --workspace @vocion/core -- --shard=${{ matrix.shard }}/3"
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          # Playwright migrates the `postgres` service's database and then
          # boots `next start` against it. The seed scripts the specs spawn
          # read this same variable, so they reach the same database.
          DATABASE_URL: postgresql://postgres:postgres@postgres:5432/vocion_e2e
          AUTH_SECRET: ci-only-secret-not-used-outside-ci

      # Playwright's outputDir is relative to its config, so the traces land in
      # packages/core/test-results, not at the repo root. Runs on failure too:
      # that is when the traces matter.
      - name: Fix test results permission # Give permissions to test results needed by the upload and Chromatic
        if: always()
        run: |
          if [ -d packages/core/test-results ]; then sudo chmod -R 777 packages/core/test-results; fi

      # Same path note as the chmod step. `error` rather than the default
      # `warn`: with traces on for every test, an empty directory means the run
      # never reached Playwright, which is worth a red step, and a silent
      # "No files were found" hid the wrong path for a long time. One name per
      # shard: upload-artifact@v6 refuses a second artifact with the same name.
      - name: Upload test results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-results-${{ matrix.shard }}
          path: packages/core/test-results/
          if-no-files-found: error
          retention-days: 7

  # Chromatic runs once, over every shard's results merged back into the one
  # directory it used to read, instead of once per shard. Only after every
  # shard passes, as when it was a step at the end of the single E2E job.
  visual-regression:
    name: Run visual regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [e2e]

    env:
      # Every step below is skipped while the repository has no Chromatic
      # token. Without one the action exits non-zero on `Missing project
      # token`, which buried a passing suite: the tests report `52 passed` and
      # the check still reads red, so nobody can tell a real break from this.
      # It travels through the job env because `secrets` is not one of the
      # contexts available to a step-level `if` (GitHub context availability
      # reference), while `env` is. Setting the secret brings the job back
      # with no further change.
      CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}

    steps:
      - if: env.CHROMATIC_PROJECT_TOKEN != ''
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # For chromatic

      - if: env.CHROMATIC_PROJECT_TOKEN != ''
        name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: 22.x

      - if: env.CHROMATIC_PROJECT_TOKEN != ''
        name: Download every shard's test results
        uses: actions/download-artifact@v8
        with:
          pattern: test-results-*
          path: packages/core/test-results/
          merge-multiple: true

      - if: env.CHROMATIC_PROJECT_TOKEN != ''
        name: Run visual regression tests
        uses: chromaui/action@v15
        with:
          playwright: true
          exitOnceUploaded: true # Speed up by skipping the build results
          outputDir: storybook-static
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}

  synchronize-with-crowdin:
    name: GitHub PR synchronize with Crowdin
    runs-on: ubuntu-latest
    timeout-minutes: 10

    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }} # Crowdin Actions needs to push commits to the PR branch, checkout HEAD commit instead of merge commit
          fetch-depth: 0

      # Skip gracefully when Crowdin secrets aren't configured (forks / installs
      # that don't localize) instead of failing every pull request red. The
      # standalone crowdin.yml workflow already does this; this copy did not.
      - name: Check Crowdin secrets
        id: creds
        run: |
          if [ -n "${{ secrets.CROWDIN_PROJECT_ID }}" ] && [ -n "${{ secrets.CROWDIN_PERSONAL_TOKEN }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Crowdin secrets not configured — skipping sync."
          fi

      - name: Crowdin action
        if: steps.creds.outputs.present == 'true'
        uses: crowdin/github-action@v2
        with:
          upload_sources: true
          upload_translations: true
          download_translations: true
          create_pull_request: false
          localization_branch_name: ${{ github.head_ref || github.ref_name }} # explanation here: https://stackoverflow.com/a/71158878
          commit_message: 'chore: new Crowdin translations by GitHub Action'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
