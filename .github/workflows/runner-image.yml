# The runner image (packages/runner), built and published from vocion-core, tagged by the commit
# it was built from, the way a deploy names what it runs (backlog 052). An installation's targets
# pull it: the on-box backup, the Fargate fleet, a laptop. Nothing here deploys: core holds no
# account, and an installation moves to a new runner when its core pin moves.
#
#   pull_request   build for linux/amd64 and prove the image starts, says it has nothing to do,
#                  and carries the browser QA needs. Nothing is pushed.
#   push to a release line (main, next, N.x)
#                  build linux/amd64 and linux/arm64 and push ghcr.io/<owner>/vocion-runner with
#                  sha-<commit> (what a target pins) and the line's own tag: `next`, `N.x`, or
#                  MAIN_LINE_TAG for main (the current major, 5.x).
#                  `main` is a 4.x alias and never moves to a newer major, because an install we
#                  cannot see may still pull it: only the branch named in MAIN_ALIAS_BRANCH (4.x)
#                  moves it. See docs/deployment/release-lines.md.
#   a release       the Release workflow tags vX.Y.Z onto the newest published image with the
#                  release's runner source (scripts/tag-runner-image.sh), so a deployment pins
#                  the runner by release name, and builds the release's runner itself when no
#                  published image is it. It never dispatches this workflow on a tag.
#   workflow_dispatch on a release tag (vX.Y.Z), by hand
#                  builds that commit and pushes sha-<commit>, plus vX.Y.Z only if that tag does
#                  not exist yet: a release's runner tag never moves. This runs the TAG's copy of
#                  this file, so on a release from before 5.1 it can push `main` or replace
#                  vX.Y.Z. Run the Release workflow by hand with the release instead.
name: Runner image
on:
  pull_request:
    branches: [main, next, '[0-9]+.x']
    paths:
      - packages/runner/**
      - .github/workflows/runner-image.yml
  push:
    branches: [main, next, '[0-9]+.x']
    paths:
      - packages/runner/**
      - .github/workflows/runner-image.yml
  workflow_dispatch:
concurrency:
  group: runner-image-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  packages: write
defaults:
  run:
    shell: bash
env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/vocion-runner
  # The one branch allowed to move the `main` tag: the 4.x line, since main became 5.x.
  MAIN_ALIAS_BRANCH: 4.x
  # The line tag main's builds carry. Change it with the major.
  MAIN_LINE_TAG: 5.x
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v3
        if: github.event_name != 'pull_request'

      - uses: docker/setup-buildx-action@v3

      - name: Build for this runner (amd64) and load it
        uses: docker/build-push-action@v6
        with:
          context: packages/runner
          file: packages/runner/Dockerfile
          platforms: linux/amd64
          load: true
          tags: vocion-runner:ci
          build-args: WORKER_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=runner
          cache-to: type=gha,mode=max,scope=runner

      - name: The image starts, has nothing to do, and exits 0
        run: |
          out=$(docker run --rm -e RUNNER_TARGET=ci vocion-runner:ci)
          echo "$out"
          echo "$out" | head -1 | jq -e --arg v "${GITHUB_SHA}" '.phase == "boot" and .worker_version == $v and (.worker | startswith("ci-"))'
          echo "$out" | jq -e -s 'map(select(.phase == "exit")) | length == 1'

      - name: The image carries every module, the hooks, the schema and a browser
        run: |
          docker run --rm --entrypoint sh vocion-runner:ci -c '
            set -e
            ls /opt/vocion-runner/src/runner.mjs /opt/vocion-runner/contract/schema.json /opt/vocion-runner/claude-settings.json
            for h in guard-bash guard-write log-tool path-allowed; do test -x /opt/vocion-runner/hooks/$h.sh; done
            test ! -e /opt/vocion-runner/src/runner.test.mjs
            node /opt/vocion-runner/src/contract.mjs check-flows /dev/null || true
            cd /opt/vocion-runner && node -e "import(\"playwright\").then(async (p) => { const b = await p.chromium.launch({ args: [\"--no-sandbox\"] }); await b.close(); console.log(\"chromium ok\"); })"
            claude --version'

      - name: Log in to the registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Name the tags for this release line
        if: github.event_name != 'pull_request'
        id: tags
        run: |
          # A release, built by hand: its own name, unless it has one already, which never moves.
          release_tag=""
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            if docker buildx imagetools inspect "${IMAGE}:${GITHUB_REF_NAME}" > /dev/null 2>&1; then
              echo "::warning::${IMAGE}:${GITHUB_REF_NAME} already exists and a release's runner tag never moves; this build is only sha-${GITHUB_SHA}"
            else
              release_tag="${IMAGE}:${GITHUB_REF_NAME}"
            fi
          fi
          {
            echo "list<<EOF"
            echo "${IMAGE}:sha-${GITHUB_SHA}"
            case "${GITHUB_REF}" in
              refs/tags/v*) if [ -n "${release_tag}" ]; then echo "${release_tag}"; fi ;;
              refs/heads/main) echo "${IMAGE}:${MAIN_LINE_TAG}" ;;
              *)
                if [ "${GITHUB_REF_NAME}" = "${MAIN_ALIAS_BRANCH}" ]; then echo "${IMAGE}:main"; fi
                echo "${IMAGE}:${GITHUB_REF_NAME}"
                ;;
            esac
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build for amd64 and arm64 and push, tagged by the commit and the line
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: packages/runner
          file: packages/runner/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: WORKER_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=runner

      - name: Say what was published
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.tags.outputs.list }}
        run: |
          {
            echo "### Runner image"
            while read -r tag; do echo "- ${tag}"; done <<< "$TAGS"
            echo "linux/amd64 and linux/arm64"
          } >> "$GITHUB_STEP_SUMMARY"
