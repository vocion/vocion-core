# TEMPORARY (#1598): measures a cold image build's memory. Lives only on the
# throwaway branch qa/1598-build-memory, which is deleted after the runs.
#
# Run 1 (45851517871): #670's merge and v8.47.2 on 4 and 2 CPUs. Run 2
# (45855819227): main across the weeks since #670. This run takes main with
# Next 16.4.6 (#1597) apart: noise, the V8 heap cap, the React Compiler, and
# pages or API routes left out, and counts which packages fill the server
# chunks. Run 4 splits the API routes: api/v1's route files gone (its
# helpers stay for other importers), or its 114 routes behind one entry. Every build uses CI's settings (CI=1 in the builder stage: no
# Turbopack build cache write, no type check) with server source maps off.
# A bigger swap file lets an over-memory build finish; swap in use counts as
# memory the build needed.
name: QA 1598 build memory (temporary)

on:
  push:
    branches: [qa/1598-build-memory]

defaults:
  run:
    shell: bash

jobs:
  image:
    name: ${{ matrix.target.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target:
          - {label: G 16.4.6 no api/v1, patch: no-api-v1}
          - {label: H 16.4.6 api/v1 as one entry, patch: api-v1-one-entry}
    steps:
      - uses: actions/checkout@v6
        with:
          path: qa
      - uses: actions/checkout@v6
        with:
          ref: 62db5c20ef86b848a09efe8bc53cf97555b5133d
          path: src

      - name: Same build settings for every commit
        env:
          PATCH: ${{ matrix.target.patch }}
        run: |
          set -euo pipefail
          sed -i '/ AS builder$/a ENV CI=1' src/packages/core/Dockerfile
          sed -i '0,/^  experimental: {$/s//  experimental: {\n    turbopackSourceMaps: false,/' src/packages/core/next.config.ts
          core=src/packages/core
          case "${PATCH}" in
            heap-3072) sed -i 's/--max-old-space-size=6144/--max-old-space-size=3072/' "${core}/Dockerfile"
                       grep -q "max-old-space-size=3072" "${core}/Dockerfile" ;;
            no-react-compiler) sed -i "s/reactCompiler: process.env.NODE_ENV === 'production'/reactCompiler: false/" "${core}/next.config.ts"
                       grep -q "reactCompiler: false" "${core}/next.config.ts" ;;
            no-api) rm -rf "${core}/src/app/api" ;;
            no-pages) rm -rf "${core}/src/app/[locale]" ;;
            no-api-v1) find "${core}/src/app/api/v1" -name 'route.ts' -delete
                       echo "v1 route files left: $(find "${core}/src/app/api/v1" -name 'route.ts' | wc -l)" ;;
            api-v1-one-entry) python3 qa/.github/qa-1598/v1-catch-all.py "${core}/src/app"
                       grep -rl "@/app/api/v1/" "${core}/src" | xargs sed -i 's#@/app/api/v1/#@/app/_v1routes/v1/#g'
                       echo "old alias left: $(grep -rl '@/app/api/v1/' "${core}/src" | wc -l)"
                       head -3 "${core}/src/app/api/v1/[...path]/route.ts" ;;
          esac
          grep -n -A1 " AS builder" src/packages/core/Dockerfile
          grep -n -E "turbopackSourceMaps: false|reactCompiler:" src/packages/core/next.config.ts

      - name: Room to swap
        run: |
          sudo swapoff -a
          sudo rm -f /mnt/swapfile
          sudo fallocate -l 24G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile > /dev/null
          sudo swapon /mnt/swapfile
          echo "nproc $(nproc)"; free -m; df -h / /mnt | tail -2

      - name: Cold image build
        env:
          LABEL: ${{ matrix.target.label }}
        run: |
          set +e
          python3 qa/.github/qa-1598/sample.py baseline.txt 6
          python3 qa/.github/qa-1598/sample.py samples.txt &
          sampler=$!
          docker build --progress=plain --target builder -t vocion-builder:qa -f src/packages/core/Dockerfile src 2>&1 \
            | perl -MTime::HiRes=time -ne 'BEGIN { $| = 1 } printf "%.1f %s", time, $_' > build.log
          status=${PIPESTATUS[0]}
          kill "${sampler}"
          grep -E "Next.js 16|Compiled|filesystem cache|TypeScript|Collecting page data|Generating static|Killed|ERROR|exit code" build.log | cut -c1-200 | tail -12
          python3 qa/.github/qa-1598/summarize.py "${LABEL}" baseline.txt samples.txt build.log | tee summary.json
          echo "build exit ${status}"
          if [ "${status}" = 0 ]; then
            docker run --rm --entrypoint tar vocion-builder:qa c -C /app/packages/core/.next server | tar x
            python3 qa/.github/qa-1598/analyze-chunks.py server | tee chunks.txt
          fi
          exit "${status}"

      - name: Keep the samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-1598-run3-${{ strategy.job-index }}
          path: |
            baseline.txt
            samples.txt
            build.log
            summary.json
            chunks.txt
          retention-days: 7
