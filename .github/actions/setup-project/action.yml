name: Setup Node.js and dependencies
description: Setup Node.js environment with npm dependencies

inputs:
  node-version:
    description: Node.js version
    required: true

runs:
  using: composite
  steps:
    # No `cache: npm` here. It restored the ~510 MB npm download cache in
    # every job, about 5s each, even though the node_modules cache below hits
    # on almost every run and `npm ci` never runs then. The download cache is
    # restored further down, only when node_modules misses (#631).
    - name: Use Node.js ${{ inputs.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}

    - name: Restore or cache node_modules
      id: cache-node-modules
      uses: actions/cache@v5
      with:
        path: node_modules
        key: node-modules-${{ inputs.node-version }}-${{ hashFiles('package-lock.json') }}

    - name: Restore or cache the npm download cache
      if: steps.cache-node-modules.outputs.cache-hit != 'true'
      uses: actions/cache@v5
      with:
        path: ~/.npm
        key: npm-download-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          npm-download-${{ runner.os }}-

    - name: Install dependencies
      if: steps.cache-node-modules.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci
