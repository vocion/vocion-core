# Validate commit messages
commit-msg:
  commands:
    commitlint:
      run: npx --no -- commitlint --edit {1}

# Validate content before committing
pre-commit:
  commands:
    # Blocks the PolinRider-style config payload injection (see scripts/check-config-integrity.mjs)
    integrity:
      glob: '*'
      run: npm run check:integrity
      priority: 0
    lint:
      glob: '*'
      run: npx --no -- eslint --fix --no-warn-ignored {staged_files}
      stage_fixed: true
      priority: 1
    check-types:
      glob: '*.{ts,tsx}'
      run: npm run check:types
      priority: 2
    knip:
      glob: '*'
      run: npm run check:deps
      priority: 3

# The repo is public: a real customer, prospect or contact name must never
# reach GitHub. CI's realDataGuard test caught three today, but only after the
# push, when the commit was already public by its SHA. Run it before the push.
pre-push:
  commands:
    real-data:
      run: npm run --workspace @vocion/core check:real-data
