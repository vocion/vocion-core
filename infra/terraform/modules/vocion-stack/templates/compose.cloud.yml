# vocion-stack overlay, applied last over core's compose files by
# vocion-deploy:
#
#   docker-compose.yml + infra/docker-compose.platform.yml
#     + infra/aws/docker-compose.prod.yml + infra/docker-compose.langfuse.prod.yml
#     + /etc/vocion/compose.cloud.yml
#
# It adds only what this module's install needs on top of core's:
#   - the RDS CA bundle, read-only, where DATABASE_URL's sslrootcert points;
#   - a host directory for VOCION_ARTIFACTS_DIR, so artifacts outlive the container;
#   - Caddy's config for this mode (behind the ALB, or terminating TLS);
#   - the local postgres and the platform stack (self-hosted Langfuse, its
#     stores, the OTel collector) switched off.
# Compose merges volumes by their path in the container, so the Caddyfile
# entry replaces core's rather than adding a second one.
#
# What runs is app and caddy, nothing else (`compose config --services`).

services:
  app:
    # The database is RDS. Core's prod overlay waits for the local postgres to
    # be healthy; with that postgres off, the wait goes too.
    depends_on: !reset {}
    volumes:
      - /opt/vocion-certs:/etc/vocion/certs:ro
      - /opt/vocion-data/artifacts:/var/lib/vocion/artifacts

  worker:
    depends_on: !reset {}
    volumes:
      - /opt/vocion-certs:/etc/vocion/certs:ro
      - /opt/vocion-data/artifacts:/var/lib/vocion/artifacts

  caddy:
    volumes:
      - /etc/vocion/Caddyfile:/etc/caddy/Caddyfile:ro

  # Off: behind a profile nothing activates, compose neither pulls nor starts
  # these services.
  #
  # The local postgres: the database is RDS, so a second, empty postgres on
  # the box is only something to mistake for it.
  postgres:
    profiles: [platform-off]

  # The platform stack. This module never self-hosts Langfuse
  # (LANGFUSE_SELF_HOSTED_REPLICAS=0) and the app sends nothing to the OTel
  # collector. Zero replicas is not enough: compose still pulls the image of a
  # service scaled to 0, and docker.io/minio/minio no longer exists, so a
  # fresh box failed its first deploy. (The collector would also fail to
  # start here: its config mount resolves against the checkout root.)
  langfuse-web:
    profiles: [platform-off]
  langfuse-worker:
    profiles: [platform-off]
  langfuse-postgres:
    profiles: [platform-off]
  langfuse-clickhouse:
    profiles: [platform-off]
  langfuse-minio:
    profiles: [platform-off]
  langfuse-redis:
    profiles: [platform-off]
  otel-collector:
    profiles: [platform-off]
