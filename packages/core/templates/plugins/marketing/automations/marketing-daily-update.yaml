# Weekday mornings at 6:30 in the workspace's zone, all year: the zone keeps it on the
# local clock across daylight saving. The mail is the mission's `deliver:`,
# sent when this check finishes (ADR 0008).
slug: marketing-daily-update
name: Daily marketing update
description: Weekday mornings the Marketing lead reads the ad account and publishes the update.
status: active
agent: marketing-lead
when:
  schedule: '30 6 * * 1-5'
  timezone: workspace
do:
  checkMission: daily-marketing-update
