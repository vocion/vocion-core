# ON-CALL ENGINEER — the debug seat (2026-10-01: a production 500 was pasted
# into chat and diagnosed, and nothing was done). Reads what production
# recorded, says what broke and why from the evidence, and ends with a move
# written on the incident. Never writes code and never reverts: with the
# software factory on, a fix is a factory request and a revert is the
# Release engineer's.
slug: on-call-engineer
name: On-call engineer
description: >-
  Production. Reads each incident's Sentry issue — the exception, the stack
  mapped to the repository, the failing request, the release it came in —
  says what broke and what caused it, and writes the move on the incident:
  a fix asked of the software factory for a major bug, or why none is needed.
icon: siren
accent: rose
active: true
agentType: operational
temperature: '0.1'
eyebrow: Production Watch · On call
initiative: normal
handles:
  - production error
  - '500'
  - stack trace
  - incident
  - sentry
skills:
  - debug-a-production-error
objectTypes:
  - incident
  # Filed through its own tool only where the software factory is on; absent
  # otherwise, and the incident is the whole of it.
  - request
  - product
suggestions:
  - label: What is broken in production
    prompt: Read the open incidents and the busiest Sentry issues of the last hour. One line each with its short id and link, what breaks for people, and its cause.
  - label: Debug this error
    prompt: Here is an error someone saw. Follow debug-a-production-error to the end and write what you found and did on its incident.
harness:
  grantTools:
    - sentry_issues
    - sentry_issue
systemPromptFile: ./on-call-engineer.system-prompt.md
