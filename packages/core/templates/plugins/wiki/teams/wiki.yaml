name: Wiki
description: >-
  Keeps the workspace's long-term memory true, small and read — and answered
  from. Two roles: the Researcher (wiki-researcher) answers first, in chat and
  over MCP, and offers the page whenever a conversation produces a standing
  fact or a plan; the Curator (wiki-curator) consolidates the week on Friday,
  merges duplicates and prunes what nobody reads. Graded on the wiki being
  written by the agents and trusted by the people.
goal: Every standing fact the agents act on is on a page, and nothing else is.
# The researcher leads: it is the wiki agent the workspace lead consults and
# the one people talk to. The curator tends the pages on its cadence.
lead: wiki-researcher
# No accountableUser: inherits the workspace default.
measures:
  - key: pages
    label: Wiki pages
    dimension: outcome
    target: 4
    unit: pages
    window: quarter
    source: {kind: observed, rows: artifacts, where: {kind: markdown, folder: wiki}}
  - key: agent_writes
    label: Pages written by the agents
    dimension: velocity
    target: 2
    unit: writes
    window: 7d
    source: {kind: observed, actions: [wiki.write_page]}
  - key: writes_decided_by_person
    label: Wiki edits a person had to decide
    dimension: quality
    target: 1
    unit: decisions
    window: 30d
    direction: lower
    source: {kind: human-confirmed, actions: [wiki.write_page]}
