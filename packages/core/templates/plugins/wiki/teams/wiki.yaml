name: Wiki
description: >-
  Keeps the workspace's long-term memory true, small and read. Graded on the
  wiki being written by the agents and trusted by the people.
goal: Every standing fact the agents act on is on a page, and nothing else is.
lead: wiki-curator
# No accountableUser: inherits the workspace default.
measures:
  - key: pages
    label: Wiki pages
    dimension: outcome
    target: 4
    unit: pages
    window: quarter
    source: { kind: observed, rows: artifacts, where: { kind: markdown, folder: wiki } }
  - key: curator_writes
    label: Pages written by the curator
    dimension: velocity
    target: 2
    unit: writes
    window: 7d
    source: { kind: observed, actions: [wiki.write_page] }
  - key: writes_decided_by_person
    label: Wiki edits a person had to decide
    dimension: quality
    target: 1
    unit: decisions
    window: 30d
    direction: lower
    source: { kind: human-confirmed, actions: [wiki.write_page] }
