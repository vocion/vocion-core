# The wiki plugin — the workspace's slow-changing, long-term context, kept by
# the agents and read by every agent before it acts.
#
# Learned from nine weeks of a hand-run founder wiki: the pages that carried
# weight were the handful an agent read before writing (the voice, the
# standing rules, who is who); the hand-appended ledgers and the "copy from the
# app, paste into the wiki" steps died within a week. So here the WRITER is
# always the agent — done for you above a confidence bar, reviewed below it —
# and a person edits, undoes, or asks. A page is a markdown artifact in the
# `wiki` folder: versions, restore, preview, share and citation come free.
#
# Core ships the MECHANISM (the artifact noun, the `wiki.write_page` action,
# the tools, the mount into every agent's context, `artifact.saved` +
# `index-artifact`); this plugin ships the MEANING: what belongs in a wiki, the
# curator, its cadence, the bar, and the pages.
slug: wiki
name: Wiki
# 1.2.0 — the debrief: finished work (a worker run, a mission run, a quiet
# conversation, a merged pull request) is read once by the researcher for
# what it settled, and the standing part is proposed to its page
# (`automations/wiki-debrief.yaml`, on core's completion events). The two
# agents declare what they `handle` (the router sends wiki questions to the
# researcher when nobody names an agent) and their `initiative` — researcher
# high, curator low. 1.1.0 seeded pages from the repo and added the
# researcher; 1.0.0 was the curator alone.
#
# 1.3.0 — the index reads as pages rather than as a grid: the title leads
# with its first paragraph under it, and the version and last author drop
# first when the screen is narrow.
# 2.0.0 (vocion-core v0.6.0) — BREAKING: no automations. The debrief, the
# conversation sweep, the index pass and the weekly curation were paused
# everywhere they ran; they and the debrief mission are deleted.
version: 2.0.0
description: The workspace's long-term memory, kept by the agents. Voice, standing rules, who is who and decisions that hold are seeded from the repo, written by the agents (done for you, with undo), mounted into every agent's context, searchable, answered from by a researcher.
recommend:
  when:
    - a person repeats a standing fact, a preference or a rule they have said before
    - a person asks where something is written down, or says "remember this" about something that is not one small rule
    - an agent needs the voice, the house style, a glossary or who owns what and has to ask instead of reading
    - the same correction has been made in more than one conversation
    - a person asks the same research question twice, or wants a plan written down as options and a decision
    - the repo already has markdown pages describing how the workspace works, and nobody reads them
  connectors: []

# First asks offered by the composer once this plugin is on (`libs/chat/openingHints.ts`),
# each only when what it needs is connected.
starters:
  - label: What does our wiki say about how we work?
  - label: Add what we decided today to the wiki
