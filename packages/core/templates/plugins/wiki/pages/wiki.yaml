# The Wiki page — every page of the workspace wiki, newest change first. Each
# row opens the artifact (read, edit in place, history, share). Rendered by
# the core `list` archetype over the artifact log; no new table, no new route.
slug: wiki
title: Wiki
description: The workspace's long-term memory — voice, standing rules, who is who, decisions — written by the agents and read before they act.
icon: book-open
nav: {section: Workspace, order: 5}
# READ AS A WIKI, not as a table of the artifacts behind it (2026-09-24):
# core's `wiki` archetype draws a rail of pages in reading order, a home, one
# page open at a time at /dashboard/p/wiki/<slug>, links between pages that
# open pages, and on each page who last wrote it, its version, Edit, History
# and Ask. The folder is all this manifest declares; the archetype owns the
# rest. Pages seeded from the repo carry `order` and `tags` in their
# frontmatter; a page tagged `always` rides into every agent turn, every other
# page is read on demand.
archetype: wiki
source: {kind: artifacts, folder: wiki, artifactKind: markdown, limit: 500}
