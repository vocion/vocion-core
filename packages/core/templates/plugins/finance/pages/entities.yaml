icon: landmark
nav: {section: Finance, order: 2}
archetype: list
pluginPanel: false
source: {kind: objects, objectType: finance_entity}
filters: [{field: status, op: neq, value: rejected}]
sort: {field: meta.name, dir: asc}
layout: block
primary:
