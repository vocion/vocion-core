# WHAT THE FACTORY SAYS BACK REACHES THE THREAD THAT ASKED, WHEN IT HAPPENS.
# The factory pings this workspace the moment a ticket has something to say
# (it needs a person, a run stopped, the work merged, the release is live),
# and the source's updates are read then (`/api/webhooks/mcp/…`, core's
# `mcp-updates` job). Nothing is polled. This hourly run is only the sweep
# under that: it renews the address the factory pings (the source's
# `updatesWatchTool`) and says anything a lost ping left behind. A job, not an
# agent: a sweep with nothing to say costs one read and no model.
slug: factory-updates
name: Sweep for anything the factory said that a ping missed
label: Swept the factory
doing: Checking the factory
description: >-
  The factory tells this workspace the moment a request made here needs a
  person, stopped or shipped, and the thread that asked hears it then. Once
  an hour this renews that link and says anything a lost ping left behind.
status: active
when:
  schedule: '7 * * * *'
  timezone: UTC
do:
  job: mcp-updates
