# WHAT THE FACTORY SAYS BACK REACHES THE THREAD THAT ASKED. Every two minutes
# the `mcp-updates` job reads each connected source that reports updates and
# says each one once in the conversation it names: the factory needs a person,
# a run stopped, the work merged, the release is live with its page. A job, not
# an agent: a tick with nothing to say costs one read and no model. An update
# that asks goes to the desk first, which answers it from the thread when the
# thread settled it and asks the people in it when it did not.
slug: factory-updates
name: Tell the thread what the factory needs and what shipped
label: Told the thread
doing: Checking the factory
description: >-
  Every two minutes, anything the factory has to say about a request made
  here (it needs a person, it stopped, it shipped) is said once in the
  conversation that asked, in the app's chat and in its Slack thread.
status: active
when:
  schedule: '*/2 * * * *'
  timezone: UTC
do:
  job: mcp-updates
