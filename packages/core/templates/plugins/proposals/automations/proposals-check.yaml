slug: proposals-check
name: Weekday proposals check
description: >-
  Wakes the Proposal Writer every weekday to check the standing mission: what
  needs a proposal, what has one, whether it verified. The open items it
  files are what the Proposals board and Review show as recommendations.
status: active
agent: proposal-writer
when:
  schedule: '0 15 * * 1-5'
do:
  checkMission: proposals-current
  prompt: >-
    Three passes, each ending in open items a person can act on — never a
    document sent.
    (1) Rooms at a proposal stage (list_data_rooms): read each; find its latest
    document (a deliverable or an artifact on the room). If none, add one open
    item "Draft the proposal" naming what the room already has and what is
    missing. If one exists, run verify_document when the receipt is not clean
    or the document predates the newest starred source; fix what the receipt
    names sheet by sheet and re-verify. When you render or revise a document,
    pass room_id so it lands on the room.
    (2) Discovery calls a person confirmed (the discovery ledger, the last 30
    days) with no room at a proposal stage: add an open item on the matching
    room, or ask to open one, recommending the proposal and citing the call.
    (3) Deals at a proposal stage in the CRM with no room: the collector opens
    those after a sync — say so, do not open them yourself.
    Report one line per room or call: verified, fixed, drafted-recommended, or
    missing and why.
