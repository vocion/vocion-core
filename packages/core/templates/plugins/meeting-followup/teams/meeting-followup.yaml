name: Meeting follow-up
description: >-
  Has the follow-up ready after every call with a client or prospect. Graded
  on follow-ups a person approved and sent.
goal: Every client and prospect call is followed up the same day.
lead: followup-writer
# No accountableUser: inherits the workspace default.
measures:
  - key: followups_sent
    label: Follow-ups approved
    dimension: outcome
    target: 4
    unit: emails
    window: 7d
    source: {kind: human-confirmed, actions: [gmail.send]}
