# A Project. The slug keeps its old name (projects were "data rooms" until
# 2026-10-27); every label a person or a model reads says Project.
slug: data_room
label: Project
description: >-
  The collection around one client or engagement — a deal, a retainer, a
  piece of delivery: everything ingested about it (transcripts, threads, attachments, by weight)
  and everything written from it (decision logs, documents, working files),
  plus the project's own knowledge — rules, notes, a dated timeline, highlights —
  that keeps the collection growing on its own. A sales project persists into
  delivery; the anchor and the stage move, the collection stays.
icon: folder-open
schema:
  type: object
  properties:
    client:
      type: string
      description: The client's name as used in prose ("the Northwind team").
    codename:
      type: string
      description: Codename for an NDA'd deal; used in filenames so a PDF cannot leak an identity.
    status:
      type: string
      description: The status blockquote — one paragraph, dated.
    statusAt:
      type: string
      format: date
    stage:
      type: string
      description: Engagement stage in the CRM's own words (Discovery, Proposal sent, Signed, In delivery).
    anchor:
      type: object
      description: The entity the project is the collection around, and where it lives.
      properties:
        type: {type: string, description: 'deal, company, project, engagement, ticket…'}
        system: {type: string, description: 'hubspot, jira, github…'}
        id: {type: string}
        url: {type: string}
        label: {type: string}
        amount: {type: number}
    deal:
      type: object
      description: Older shape of an anchor of type deal; read as one.
      properties:
        system: {type: string}
        id: {type: string}
        url: {type: string}
        amount: {type: number}
    rules:
      type: array
      description: >-
        The project's Instructions, one line each — how things are called,
        the voice to write in, what files here, what never leaves it. The
        agent reads them before anything else in the project.
      items: {type: string}
    notes:
      type: string
      description: The project's Wiki (the client wiki), markdown — where things are, who owns what, conventions.
    cast:
      type: array
      description: Every person on the engagement, with role and email.
      items:
        type: object
        properties:
          name: {type: string}
          role: {type: string}
          email: {type: string}
          side: {type: string, enum: [client, seller, partner]}
    deliverables:
      type: array
      description: Documents promised or delivered, newest first.
      items:
        type: object
        properties:
          date: {type: string}
          title: {type: string}
          artifactId: {type: integer}
          status: {type: string, enum: [planned, drafted, sent, signed]}
    milestones:
      type: array
      description: The dated timeline — what was planned and what was delivered, and when.
      items:
        type: object
        properties:
          date: {type: string, format: date}
          title: {type: string}
          status: {type: string, enum: [planned, done]}
          artifactId: {type: integer}
          note: {type: string}
    highlights:
      type: array
      description: >-
        Kept as they appear in material — a client's own words, a measured
        result, a win, a challenge met — with who and when, so the case study
        writes itself instead of being reconstructed at the end.
      items:
        type: object
        properties:
          kind: {type: string, enum: [quote, metric, win, challenge, testimonial, risk]}
          text: {type: string}
          who: {type: string}
          date: {type: string}
          source: {type: string}
          addedAt: {type: string}
    sources:
      type: array
      description: >-
        What is filed to the project, by weight (⭐⭐⭐ = read before writing
        anything), with provenance — channel, date, who filed it and, for an
        automatic filing, the score and evidence.
      items:
        type: object
        properties:
          documentId: {type: integer}
          artifactId: {type: integer}
          title: {type: string}
          kind: {type: string, enum: [transcript, email, attachment, note, decision-log]}
          rating: {type: integer, minimum: 1, maximum: 3}
          channel: {type: string}
          date: {type: string}
          retrievedAt: {type: string}
          note: {type: string}
          filedBy: {type: string, enum: [auto, agent, human]}
          score: {type: number}
          evidence: {type: array, items: {type: string}}
    domains:
      type: array
      description: Email domains that identify this client's people — how a transcript or thread is matched to the project.
      items: {type: string}
    aliases:
      type: array
      description: Other names the engagement goes by in calendar titles and subjects.
      items: {type: string}
    publishTargets:
      type: array
      description: >-
        Where this project's pages ship, under "Publishing" on the project
        page. Set by a person there; an agent's write to it is refused. `config` is the kind's own (a GitHub repo, base
        branch, path and format; a Squarespace site URL and blog path);
        WordPress is named here and not yet wired.
      items:
        type: object
        required: [id, kind]
        properties:
          id: {type: string}
          kind: {type: string, enum: [github, squarespace, wordpress]}
          label: {type: string}
          config: {type: object}
    autoFile:
      type: boolean
      description: false keeps the collector from filing into this project on its own.
    unfiled:
      type: array
      description: Knowledge documents a person took back out; never auto-filed again.
      items: {type: integer}
    seoGate:
      type: object
      description: >-
        How the SEO app releases this project's pages for writing: a sample a
        person signs off on first (at least one page of each type), then a
        tranche, then the rest. Whole numbers from 1 to 100; anything else
        reads as the default (3, then 10). Set by a person on the project
        page; an agent's write to it is refused.
      properties:
        sample: {type: integer, minimum: 1, maximum: 100}
        tranche: {type: integer, minimum: 1, maximum: 100}
sourceRelevance:
  zoom: 2.0
  granola: 2.0
  gmail: 1.5
  drive: 1.0
  hubspot: 1.0
classificationPrompt: >-
  Given a call transcript, email thread or shared document, decide which data
  project it belongs to. Match on attendee or sender email domains first, then
  on the client's name, codename or aliases in the title or subject, then on
  people from the project's cast in the text. Apply the project's own rules when it
  has any. Report a confidence from 0 to 1 and the evidence you matched on;
  below a clear match, ask rather than file.
