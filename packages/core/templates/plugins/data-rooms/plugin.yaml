# The data-rooms plugin — Projects kept current for you. A project is one
# client, deal or engagement: everything ingested about it, everything written
# from it, and its own instructions and wiki that keep the collection growing.
# (The slug keeps its old name; projects were "data rooms" until 2026-10-27.)
#
# Core ships the NOUN in every workspace (the Projects page and sidebar row in
# every app, matching, filing, the tools — `services/DataRoomService.ts`);
# this plugin ships the MEANING: the project's full schema, the skill that
# says how to work one, the keeper that keeps projects current, the collector
# that files after every sync, and the team that is graded on it. A workspace
# turns it on with `plugins: [data-rooms]` and overrides any file by slug.
slug: data-rooms
name: Projects
version: 1.0.0
description: Keeps every project current for you. Sources are filed after every sync, a keeper refreshes status and timeline each weekday, and open items land on the review queue. The Projects page itself is in every workspace.
recommend:
  when:
    - a person asks where a transcript, thread or document about a client or deal was filed
    - a document (proposal, scope, update) needs to be written from what is known about one engagement
    - the same client or deal comes up across several conversations and nothing collects it
    - a deal reaches a proposal or negotiation stage in the CRM
  connectors: [hubspot, zoom, gmail, drive, granola]

# First asks offered by the composer once this plugin is on (`libs/chat/openingHints.ts`),
# each only when what it needs is connected.
starters:
  - label: What changed in our projects this week?
