# Where the SEO app's actions start on the autonomy ladder, and why.
#
# The volume gate is NOT here: it is code (`services/seo/gate.ts`), because
# "nothing past the sample until a person signed off" is a requirement, not a
# bar that can be earned. These rules are the bars around it.
rules:
  # THE PAGE RECORD, written directly. The SEO tools (`seo_save_*`,
  # `seo_record_feedback`) are the path a page moves on, and they read the
  # gate first. An agent writing a page's fields any other way
  # (`update_object`) is going around that path, so a person sees it first.
  # Medium, not high: correcting a typo in a keyword is real work, and the
  # ledger can show it is safe.
  - action: objects.update_meta.seo_page
    autoApproveAbove: 0.95
    enabled: false
    rung: execute-with-approval
    risk: medium

  # The batch record: its topic, keywords and destination. Its gate is
  # rewritten by core on every page write, so a wrong field here is a
  # correction, never a release.
  - action: objects.update_meta.seo_batch
    autoApproveAbove: 0.9
    enabled: true
    rung: execute-within-bounds
    risk: low

  # THE SIGN-OFF, RECORDED. The person approved the page on its workflow
  # run's sign-off step; this writes that approval onto the page in code,
  # bound to the words they were shown (`seo.record_signoff`). It refuses a
  # draft that changed since, and Undo puts the page back to its sign-off.
  - action: seo.record_signoff
    autoApproveAbove: 0.5
    enabled: true
    rung: execute-within-bounds
    risk: low

  # PUBLISHING AS A DRAFT. A person approves a page ONCE, on its run's
  # sign-off step; publishing it then opens an unmerged pull request on the
  # client's repository or saves a Squarespace draft that is not live. Both
  # stay in the client's hands, and Undo closes the pull request, so it runs
  # on the sign-off without a second card. The action itself refuses any page
  # without a person's sign-off on its current words (`signedOff`).
  - action: site.publish_page
    autoApproveAbove: 0.95
    enabled: true
    rung: execute-within-bounds
    risk: medium
  # Going live: drafted Squarespace posts made public. Not reversible from
  # here (a live post is the site's), so it is asked every time and never
  # earns its way out.
  - action: site.publish_live
    autoApproveAbove: 1
    enabled: false
    rung: execute-with-approval
    risk: high
