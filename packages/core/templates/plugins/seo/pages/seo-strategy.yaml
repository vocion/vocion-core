# Each client's SEO strategy: the goal a person owns for it, where it stands,
# its milestones and the strategy document. An ordinary `list` over the
# `seo_strategy` noun; code writes the rows (`services/seo/strategy.ts`) and
# reads the goal again whenever the SEO work moves.
slug: seo-strategy
title: Strategy
description: Each client's priorities, execution roadmap, blockers, and measured outcomes.
icon: target
nav: {section: SEO, order: 0}
archetype: list
source: {kind: objects, objectType: seo_strategy}
sort: {field: meta.projectName, dir: asc}
primary: {field: goal, subtitle: [progress]}
stats:
  - {label: Clients, kind: count}
  - {label: Active, kind: countWhere, where: {field: meta.goalStatus, op: eq, value: active}}
  - {label: Awaiting approval, kind: countWhere, where: {field: meta.goalStatus, op: eq, value: drafted}}
fields:
  - {key: goal, label: Goal, from: meta.goalTitle}
  - {key: progress, label: Progress, from: meta.progressLine}
  - {key: project, label: Client, from: meta.projectName}
  - {key: horizon, label: Due, from: meta.horizon}
  - {key: status, label: Status, from: meta.goalStatus, format: badge, tones: {drafted: warn, active: info, paused: muted, done: ok, dropped: muted}}
  - {key: updated, label: Updated, from: meta.updatedAt, format: date}
rowLink: '/dashboard/projects/{meta.projectId}/roadmap?app=seo'
rowActions:
  - {label: Goal, href: '/dashboard/goals/{meta.goalId}'}
  - {label: Strategy document, href: '/dashboard/artifacts/{meta.documentArtifactId}'}
  - {label: Project, href: '/dashboard/projects/{meta.projectId}'}
empty:
  text: No strategies yet. Confirm a client's business priorities and planning horizon, then draft a strategy. Once approved, organize its roadmap into Now, Next, and Later; connect delivery work and measure client outcomes separately.
prompts:
  - {label: Draft a client's strategy, prompt: Draft an SEO strategy for a client as a goal with milestones. First ask me which client and the horizon (a quarter or a date)., agent: seo-strategist}
