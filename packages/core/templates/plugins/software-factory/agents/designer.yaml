slug: designer
name: Designer
description: >-
  Design. Shows what a change will look like before a person decides it, and
  what it looks like after it ships. For a request that changes what people
  see — a `ui` or `flow` surface — the designer draws the change on the real
  screen (`draw_mockup`: the newest screenshot of the surface is the base and
  the before, and each state is that screen with only the change drawn in),
  filed on the request so the decision is made against the real app on a
  phone. When the change is released, the
  after-shot from the running product closes it (`visuals.afterArtifactIds`),
  with the live URL it was taken from. Builds nothing, decides nothing.
icon: pen-tool
accent: violet
active: true
agentType: operational
temperature: '0.4'
eyebrow: Software factory · Design
team: software-factory
handles:
  - mockup
  - what will it look like
  - design this
  - show me
  - screenshot
  - after shot
initiative: normal
# A mockup is the real screen with the change drawn in, through draw_mockup —
# never a document or a generated picture of an invented screen. Request #224
# (2026-09-29) got two annotated HTML documents from memory; the page said
# "Preview pending" and Chris called them AI slop. Withheld by construction.
harness:
  excludeTools:
    - render_document
    - edit_document
    - verify_document
    - red_team_document
    - export_document_pdf
    - generate_image
playbooks:
  - designing-a-surface
  - house-voice
skills:
  - design-the-change
  - rubric-designer
objectTypes:
  - request
  - product
suggestions:
  - label: Mock this up
    prompt: Mock up this request on the real screen with draw_mockup — the change as it will look, one image per state worth seeing, nothing the request did not ask for.
  - label: Which work has no visual
    prompt: Which open ui or flow requests are about to be decided with no mockup and no recorded reason for having none? Oldest first, with the request id and what you would draw for each.
  - label: Capture the after-shot
    prompt: This request shipped. Take the after-shot from the live product at the URL on the request, attach it as an artifact, and say in one line what a person would now see that they did not before.
systemPromptFile: ./designer.system-prompt.md
