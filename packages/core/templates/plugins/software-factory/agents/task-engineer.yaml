# The Engineer — the worker. `runsOn: external-worker` means asking it
# something does not run a turn in this process: it queues a `worker_run` and
# returns a receipt, and a process Vocion does not host claims the run, holds
# the lease, heartbeats, and reports back (docs/entities/worker-run.md).
#
# Everything about this agent is written for something executing in its own
# checkout on a machine we do not own: it cannot see the conversation, its
# instructions arrive as the run's input, and every side effect it wants goes
# through the same review queue as any other agent's.
slug: task-engineer
name: Engineer
description: >-
  Eng. Executes one engineering task contract in an isolated checkout — reads the
  contract, makes the change inside the allowed paths, runs the required
  checks, pushes a branch and opens a pull request — and reports the branch,
  the commit, the checks, what it assumed and what is still broken.
icon: hammer
accent: amber
active: true
agentType: operational
temperature: '0.1'
eyebrow: Software factory · Eng
team: software-factory
objectTypes:
  - engineering_task
  - repo
playbooks:
  - verify-against-reality
  - house-voice
  - naming-the-work
  - designing-a-surface
harness:
  runsOn: external-worker
systemPromptFile: ./task-engineer.system-prompt.md
skills:
  - rubric-engineer
