name: Software factory
description: >-
  Turns named requests into merged changes, with a person on every merge.
  Graded on what was accepted and on what people are still waiting for — never
  on how many workers ran.
goal: Every named request is a shipped change or an honest written answer, within a week.
lead: task-planner
# No accountableUser: inherits the workspace default. A plugin cannot know who
# owns a merge in someone else's deployment — the workspace names the person
# (`accountableUser:` in workspace.yaml, or on this file with `extends: core`),
# and Vocion refuses to let the merge be unowned either way.
measures:
  # The outcome. A task counts as accepted when a PERSON decided its merge ask
  # with anything but a reject — human-confirmed, because "accepted" is a
  # judgement and no count of runs can stand in for it.
  - key: tasks_accepted
    label: Tasks accepted
    dimension: outcome
    target: 4
    baseline: 0
    unit: tasks
    window: 7d
    source: {kind: human-confirmed, askKinds: [merge]}
  # The seven-day promise the close-the-gap mission carries, as a flow count
  # rather than a level: requests that were shipped or honestly answered inside
  # a week. Agent-reported, and the report says so — the planner is counting
  # its own work.
  - key: answered_within_seven_days
    label: Requests answered within seven days
    dimension: quality
    target: 4
    baseline: 1
    unit: requests
    window: 7d
    source: {kind: agent-reported, counts: answeredWithinSevenDays}
  # What the workers did, from their own `counts` (docs/entities/worker-run.md).
  # Deliberately beside `tasks_accepted` rather than instead of it: pull
  # requests opened that nobody accepts is exactly the failure this pair makes
  # visible, and it is the weakest provenance the report shows.
  - key: prs_opened
    label: Pull requests opened
    dimension: velocity
    target: 5
    baseline: 0
    unit: PRs
    window: 7d
    source: {kind: agent-reported, counts: prsOpened}
  # Total worker spend in the window. Cost PER accepted task is derived by the
  # report from this and `tasks_accepted` — a ratio is not authored, because a
  # measure that sums per-task costs would be arithmetic nobody can check.
  - key: worker_cents
    label: Worker spend
    dimension: economics
    target: 2000
    baseline: 6000
    unit: cents
    window: 7d
    direction: lower
    source: {kind: agent-reported, counts: centsSpent}
