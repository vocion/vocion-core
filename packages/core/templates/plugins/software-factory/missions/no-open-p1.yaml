slug: no-open-p1
name: Nothing P1 stays open overnight
description: >-
  The standing responsibility for the highest severity — separate from
  close-the-gap because a week is the wrong unit for something that is broken
  now.
goal: >-
  No P1 is open at the end of a working day without either a merged fix or a
  named person holding it with the next step written down. A P1 whose fix is
  waiting on a merge is a person's decision that somebody has been asked to
  make, not a task sitting in a queue.
agent: task-planner
autonomyPolicy:
  level: 2
successCriteria:
  - Every open P1 has a task contract dispatched, or a named person holding it with the next step written down
  - No P1 fix waits on a merge decision nobody has been asked to make
  - Every P1 closed today names the change that closed it and the check that proves it
desiredArtifacts:
  - 'The open-P1 line per check: what is broken, who holds it, what it is waiting on'
schedule: '0 23 * * 1-5'
