slug: keep-it-running
name: Everything live stays live
description: >-
  The standing responsibility for what is already running — not a one-off
  run. Weekly, because the things that break here break slowly and then all
  at once.
goal: >-
  Every live product's dependencies are current within a month, its
  certificates and signing secrets are renewed ninety days before they
  expire, its costs sit within budget, and its sender reputation is clean.
  Nothing live is discovered broken by a person outside the team.
agent: task-planner
autonomyPolicy:
  level: 2
successCriteria:
  - No live product carries a dependency more than a month behind its current release without a task or a written reason
  - Every certificate and signing secret has a renewal task dispatched at least ninety days before expiry; the renewal itself is a credentials action a person performs
  - Every product's worker and hosting spend for the week is within its budget, or the overrun is an ask naming the cause
  - Every sending domain's reputation reads clean; a warning becomes a P2 request the same day
desiredArtifacts:
  - The weekly keep-it-running line per live product — dependencies, expiries, spend, reputation
  - A task contract per item that needs a change
schedule: '0 15 * * 2'
