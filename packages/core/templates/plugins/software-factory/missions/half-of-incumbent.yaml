slug: half-of-incumbent
name: Half the incumbent's price, always
description: >-
  The standing responsibility for the price promise — not a one-off run.
  Monthly read, daily reaction: the figure is checked against the incumbent's
  own page, and a move becomes a person's decision within a day.
goal: >-
  Every product's price is half its incumbent's CURRENT list price for the
  like-for-like plan, read from the incumbent's own pricing page — never from
  coverage, a review or memory — with the date and the source on the product
  record. When the incumbent's figure moves, ours is an ask for a person
  within a day, because a price is a promise and only a person changes one.
agent: task-planner
autonomyPolicy:
  level: 2
successCriteria:
  - Every product's `incumbent.listPrice` was read from `incumbent.sourceUrl` within the last month and carries its `checkedOn` date
  - Every product's `ourPrice` is half the recorded incumbent price, or the difference is an open ask naming both figures
  - A moved incumbent figure becomes an ask within one day of being read; the ask carries the old figure, the new one and the source
  - No task changes a price; the change is a person's, made through the permanent gate
desiredArtifacts:
  - The monthly price line per product — incumbent price, source, date, ours
  - An ask per moved figure, with both numbers and the page it was read from
schedule: '0 14 1 * *'
