slug: keep-the-board-honest
name: The portfolio reads true this morning
description: >-
  The standing responsibility for the numbers on the AppCurious board — not a
  one-off run. Every morning the lead recomputes each product's counters from
  the records and dates them, so an outcome view never shows yesterday's
  figure as today's.
goal: >-
  Every product's agent-maintained counters — open requests, P1s open,
  being worked on, what last shipped and when, median days from request to
  release, health and what is watching it, are recomputed from the request
  and release records each morning, each one traceable to the rows it was
  computed from, and stamped with when. A number that cannot be computed is
  left empty and said so. A product nothing watches has NO health and no
  `healthSource`: the board then says "monitoring not connected", which is
  about us and can be fixed, rather than `unknown`, which sounds like doubt
  about the product.
agent: task-planner
autonomyPolicy:
  level: 2
successCriteria:
  - Every product in dogfood or live has countersUpdatedAt within the last twenty-four hours
  - openRequests and p1Open equal the count of that product's request records in an open state, and the check can name them
  - inFlight equals the count of that product's requests in state building, so open work reads as a shape rather than a bare number
  - lastShipped is the newest release's announcement line and lastReleaseAt its releasedAt; a merged task with no release does not count as shipped
  - shippedThisMonth and lastReleaseAt are read from that product's release records; a merged task with no release does not count as shipped
  - medianDaysToShip is computed from askedAt to the closing release's releasedAt over the last ninety days, and is LEFT EMPTY with the reason unless at least three requests closed in that window each naming the release that closed them AND the median is at least half a day. A median over a corpus days old is an artifact of when the factory started, and a confident 0 is worse than no figure
  - The reason a counter was left empty names the rows it could not use, so "two of seven shipped requests carry no askedAt or no releaseId" is the finding and not a silence
  - health is read from last night's black-box e2e and the newest release's healthAfter, with healthSource naming which and healthCheckedAt saying when; both health and healthSource are left empty when neither exists, never `unknown` and never assumed ok
  - Revenue is not written by this mission until a verified revenue source exists
desiredArtifacts:
  - 'The morning board line per product: each counter, what it was computed from, and the name of any counter left empty and why'
schedule: '0 11 * * *'
