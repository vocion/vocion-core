slug: green-every-night
name: Green against production, every night
description: >-
  The standing responsibility for verifying against reality — not a one-off
  run. Nightly, against the deployed environment, with the artifacts kept.
goal: >-
  Every product's black-box e2e passes against its DEPLOYED environment every
  night, with the trace and the screenshots kept as artifacts. A red night is
  a task contract before the morning report, not a line in it.
agent: task-planner
autonomyPolicy:
  level: 2
successCriteria:
  - Every product in dogfood or live has a nightly e2e result against its deployed URL, with artifacts attached, dated last night
  - A red result is a `bug` request with severity and a dispatched task contract before the morning report goes out
  - A night with no result at all is treated as red — silence is not green
  - The morning report names each product in one word, green or red, with the artifact one tap away
desiredArtifacts:
  - The nightly trace and screenshots per product, as artifacts
  - The one-line-per-product morning report
schedule: '0 10 * * *'
