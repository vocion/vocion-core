# THE PIPELINE HAS AN OWNER (backlog 049). The Release engineer's standing
# responsibility: nothing verified waits on CI, a deploy or a worker without
# a next step somebody can read. Checked by `deploy-run-failed` on every
# failed run on a deploy branch; the red CI on a factory pull request is
# answered in code first (services/factory/ciFailed.ts).
slug: keep-the-pipeline-answered
name: Nothing waits on the pipeline unanswered
description: >-
  Every red CI, failed deploy and stuck worker has a cause read from GitHub's
  own evidence and one next move — taken, or asked of the person who can take
  it — written where the work is read.
goal: >-
  No verified change waits on CI, a deploy or a worker without a written next
  step. Each failure names its cause from the log or annotation that settles
  it, takes one move (back to the engineer, a re-run once, one fix on the
  default branch, an ask to whoever can fix the pipeline), and says what
  happens next on the request. A rollback is always a person's press.
agent: release-engineer
autonomyPolicy:
  level: 2
successCriteria:
  - Every failed deploy-branch run has one incident request naming the run, its conclusion, the merge before it and the request that merge served, or new evidence added to the incident already filed for that run and attempt
  - Every cause is quoted from GitHub's evidence (an annotation, a log line, the base branch's checks), never inferred from a check's name
  - A flaky failure is re-run at most once per head; a second failure on the same head is sent back to the engineer
  - A red default branch has one fix request listing every pull request it blocks, not one per pull request
  - A fix that lives in the pipeline (a workflow, a job's setup, a check's config) is written by this seat as a pull request of its own with github.open_pull, quoting the failing line, and merges on green; only what a person holds (a secret, a permission, billing) is asked of a person
  - A rollback is proposed as an ask naming the merge's Undo and a recommendation, never taken by the seat
  - The request's Activity carries one line per pipeline failure saying what failed, why, and who moves next
desiredArtifacts:
  - >-
    'The incident request, or the evidence added to the existing one: run, conclusion, the merge before it, the request it served, and the ask with roll back, re-run and fix forward'
