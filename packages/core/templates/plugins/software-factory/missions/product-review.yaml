slug: product-review
name: The right ten things, in front of the right person
description: >-
  The standing responsibility of the Product manager — not a one-off run.
  Every request tagged and traceable, every product's backlog ranked with its
  reasons on the record, at most ten recommendations in front of the
  accountable person at a time, a weekly pass for what nobody has asked for
  yet — and nothing authorized by an agent. The four `product-*` automations
  are how, when and why this mission is checked.
goal: >-
  Every request carries its product, kind, theme, ICP and, for a bug, its
  severity, and every one that ended carries the task or release that ended
  it. Every product's open requests carry a priority with its reasons and the
  date it was scored, against the product's written promises, the
  twenty-percent rule, how many real people asked, and analytics evidence
  when a source exists. The accountable person has at most ten
  recommendations waiting on them at any time — each naming the request, the
  proposed outcome, the decision cost and the evidence — and a second batch is
  never assembled while one of the first is undecided. Once a week, what the
  evidence says nobody has asked for yet is filed as an idea request, never
  as a task. No feature is authorized by an agent: a person's answer to the
  ask is the authorization, and the trust rules say which low-risk classes
  may one day earn their way past it.
agent: product-manager
autonomyPolicy:
  level: 2
successCriteria:
  - Every request in an open or ended state carries product, kind, theme and ICP, and a bug or incident carries severity; a request that fits no product is an open question for a person, not a guessed tag
  - Every request in `shipped` carries the release that shipped it and the tasks that built it; every request in `answered` carries its answer; the tag audit names the ones that do not
  - Every open request for a product in dogfood or live carries priority, priorityReason and a rankedAt no older than the last weekly review
  - Priority is scored against the product's promises, the twenty-percent test, the count of real askers including duplicates, and an analytics figure with its source and date when a PostHog or Sentry source exists — and against nothing else
  - At most ten recommendation asks filed by the product manager are open at once; no batch is assembled while any ask of the previous batch is undecided; the daily check names who an undecided batch is waiting on and for how many days
  - Every recommendation names the request or requests, the proposed outcome (build, answer, decline or merge), the decision cost in minutes and the evidence it rests on
  - Every decision is written on the request within the fire that heard it, and routed — build to the planner, answer or decline to tell-the-requester, merge to the duplicate link, a rejection to decisionReason — and a rejected request is left out of the next batch
  - Ideas are filed as requests of kind idea with source product-manager, at most five a week, each deduped against open requests and written to name the job it serves and the evidence it rests on; no idea becomes a task without a person's decision
  - Nothing is authorized by the agent; the product.authorize trust rules stand at the rung trust.yaml states, and a class is promoted only by a person on the ledger's evidence
desiredArtifacts:
  - The daily tag-audit line — requests fixed, requests needing a person
  - The weekly ranking per product — the top ten with score and reason, and what could not be ranked
  - The recommendation batch — up to ten asks on one decision sheet, and the line saying who it waits on
  - The weekly ideas pass — ideas filed with ids, candidates dropped and why
schedule: '0 14 * * 1'
