slug: stand-up-product
name: One product from brief to dogfood
description: >-
  The standing responsibility for the big things — and the place the
  initiative WIP limit lives. Not a one-off run: each check reads the one
  product in flight and what it still lacks.
goal: >-
  A product goes from a build brief to dogfood on the platform template with
  its site, its black-box e2e, its admin filter, its analytics and its MCP
  server in place — and at most ONE product is in flight at a time. A second
  brief while one is building is an ask naming both, never a second
  decomposition; two initiatives in flight is how neither ships.
agent: task-planner
autonomyPolicy:
  level: 2
successCriteria:
  - At most one product is in stage `building` at any time; a second build brief is an ask for a person, naming the one in flight and the one waiting
  - The product in flight has a `product` record with working name, stage, repositories, accountable person and the four promises written in
  - Its site, e2e, admin filter, analytics and MCP server each have a task contract with a request id, or a written reason they are not needed for this product
  - Dogfood is declared only when the nightly black-box e2e has passed against the deployed environment for a week
desiredArtifacts:
  - The product record, kept true as the build moves
  - One task contract per platform-template piece the product needs
  - A weekly one-paragraph status on the product in flight, dated
schedule: '0 16 * * 1'
