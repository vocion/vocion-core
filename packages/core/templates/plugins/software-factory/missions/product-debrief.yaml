slug: product-debrief
name: What shipped is on the record
description: >-
  The standing responsibility of the Product manager after the factory acts —
  not a one-off run. Every finished piece of factory work is read once and
  written back where a person will look for it: the request's state and what
  answered it, the cost beside the estimate, the release notes. The
  `product-debrief` automation is how, when and why this mission is checked.
goal: >-
  No request is answered by work its record does not know about. Within the
  hour of a worker run ending or a pull request merging, the request it
  served carries its state (building, shipped, or back to triaged when the
  run failed), the task or release that answered it and the actual cost
  beside the estimate; the recommendation that put it in front of a person
  is refreshed with what came of it; and a release that exists for it carries
  draft notes in the house voice, marked as the agent's, for a person to own.
  Nothing is authorized here and nothing is announced: `tell-the-requester`
  tells the asker, a person releases the notes.
agent: product-manager
autonomyPolicy:
  level: 2
successCriteria:
  - Every debrief names the run or pull request it read and the request it served — or says in one line that it served none
  - A completed run moves its request to `shipped` when a release carries it and `building` otherwise; a failed run leaves the request open with the failure written as `decisionReason` and the recommendation, if any, refreshed to say so
  - The request's `actualCents` and `varianceCents` are read after the rollup, and a variance above the estimate by half is named on the request in one sentence
  - A recommendation that led to this work is refreshed with its outcome — built, failed, or still building — never re-filed
  - 'A release that exists for the work gets draft notes written from the pull request and the request in the house voice, notesSource agent, appended, never overwriting notes a person owns'
  - Nothing is authorized, announced or told to an asker from this mission
desiredArtifacts:
  - The one-line debrief per finished run or merge — read, request, state written, cost, notes drafted or not
  - Draft release notes per release that carried the work and had none
