# The software-factory plugin — a request becomes work, work becomes a
# release, and a person can run the whole loop from a phone.
#
# Learned from running it by hand: the part that made it safe was never the
# model, it was the contract — an objective, the paths the worker may touch,
# the checks that have to pass, and the id of the request that asked for it.
# Everything that went wrong went wrong where the contract was vague. So the
# contract is the object here, and the worker is the cheap, replaceable part.
#
# 2.0.0 — pulled back, a lot. Chris (2026-09-24): "I only want to see 3 pages.
# Products, Work, Releases. The work object should encompass the full loop:
# request, plan, feedback/approve, build, qa, release. I should be able to run
# a whole software company from my phone." Every page and every element was
# kept only if a product exec can make a decision or get value from it.
#
#   PAGES     Products, Work, Releases. The work item (`feature`, hidden from
#             nav) is the loop for one request. Factory, Factory log,
#             Performance and Guide are gone: they explained the machine, and
#             the machine can be complicated, the product cannot be. Reporting
#             comes back when use demands it (principle 12), not before.
#   TEAM      Four seats, one team: PM, Design, Eng, QA. The Task planner's
#             work — triage, the plan, the contract — is the PM's: whoever owns
#             what to build owns turning it into something buildable. Design
#             is a seat with an agent now, not a comment saying the seat is
#             empty: a ui or flow request gets a mockup before a person
#             decides it and an after-shot before it closes.
#   MISSIONS  Three: no request waits more than a week (PM), every asker hears
#             back (PM), every criterion is proven or named unproven (QA).
#             Eight reporting and hygiene missions — the nightly e2e, the
#             incumbent's price, dependency currency, board counters, P1 EOD,
#             tag audits, weekly review, stand-up-product — are gone with their
#             automations. What they watched is either a request when it
#             breaks or a report for later.
#   TRUST     The eight actions core actually registers. The per-risk-class
#             merge ladder and product.authorize.* were rules for actions that
#             did not exist.
#
# Core ships the MECHANISM (the `engineering_task` object noun's storage, the
# `worker_run` control plane — claim, lease, heartbeat, checkpoint, budget,
# `counts` — the `external-worker` harness target, the review queue, the trust
# ladder, the list archetype, the work queue derivation); this plugin ships the
# MEANING: what a task contract holds, who writes one, who reviews it against
# the diff, and what a person is asked to decide. The workspace ships the
# CONCRETION: its repositories, its products, its budgets and the person
# accountable for the merge.
slug: software-factory
name: Software factory
version: 2.0.0
description: A request — bug, review, email, incident, an ask in chat — becomes work a person approves from a card, a mockup when it changes what people see, a task contract a headless worker executes in isolation, evidence QA checks against the contract, and a release the asker hears about. Three pages — Products, Work, Releases — and four seats — PM, Design, Eng, QA.
depends: []
surfaces: []
recommend:
  when:
    - a deployment has repositories and wants changes proposed, verified and merged by a person
    - bug reports or feature requests arrive faster than anyone is working them
    - the same small change is made by hand in several repositories
    - a person asks what is in flight, what is stuck, and what nobody has answered for a week
    - bug reports, store reviews and support emails about the same product are tracked in different places, or nowhere
  connectors: []
