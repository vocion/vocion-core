# The software-factory plugin — a named request becomes a task contract, a
# headless worker in its own checkout executes it, deterministic checks decide
# whether it worked, and a person merges.
#
# Learned from running it by hand: the part that made it safe was never the
# model, it was the contract — an objective, the paths the worker may touch,
# the checks that have to pass, and the id of the request that asked for it.
# Everything that went wrong went wrong where the contract was vague. So the
# contract is the object here, and the worker is the cheap, replaceable part.
#
# 1.3.0 seats a Product manager beside the planner, the engineer and the
# reviewer — five disciplines, one team, the Design seat declared empty — and
# makes HOW, WHEN and WHY it acts four automations a person can read and pause
# on /dashboard/automation, never a habit in a prompt.
#
# Core ships the MECHANISM (the `engineering_task` object noun's storage, the
# `worker_run` control plane — claim, lease, heartbeat, checkpoint, budget,
# `counts` — the `external-worker` harness target, the review queue, the trust
# ladder, the list archetype); this plugin ships the MEANING: what a task
# contract holds, who writes one, who reviews it against the diff, the bar for
# a push versus a merge, and the floor a person watches it from. The workspace
# ships the CONCRETION: its repositories, its products, its budgets and the
# person accountable for the merge.
slug: software-factory
name: Software factory
# 1.5.0 — the debrief: a finished worker run or a merged pull request is
# written back on the request by the Product manager (state, what answered
# it, actual cost beside the estimate, the recommendation refreshed, draft
# release notes) through `automations/product-debrief.yaml`, on core's
# completion events. The product manager and the planner declare what they
# `handle` for the router and their `initiative` — high and normal.
#
# 1.5.1 — the log, in chat: "what have you built" and "what shipped" are
# answered from the worker runs themselves through core's `list_recent_runs`,
# whether or not a task record exists; the product manager handles them.
#
# 1.6.0 — the pages made readable. Every list here leads with a wide
# primary column and a muted subtitle line instead of fourteen narrow
# columns: a fact that is the same on every visible row (one repository,
# one product) is said once above the table, figures sit against a right
# edge, a column carries a `priority` so a phone drops the least important
# first, and `Asked by` resolves the request id to the request's own
# title. The object types now annotate their fields (`x-display`), so a
# record at /dashboard/objects/<id> renders from its own type — the
# contract, the checks, the evidence, the pull request and the cost —
# through the same formatting layer the lists use.
#
# 1.7.0 — the feature report: `pages/feature.yaml` puts one request's whole
# story on one page (`/dashboard/p/feature/<requestId>`) — the ask in the
# asker's words, triage, the contract, every approval, every run with its
# checks and its cost, the pull request, QA evidence, the release, and
# estimate against actual — as a timeline with the newest entry last. A stage
# that did not happen says so; a run that says failed whose pull request
# merged shows both facts and is flagged. Reached by the "Report" action on
# the Backlog and the Factory floor.
#
# 1.8.0 - naming the work: one playbook, `playbooks/naming-the-work`, that
# separates the five names a piece of work carries and gives each one its
# job. The request title is the ask in the asker's words and is never
# rewritten. The task title is the change, literally, in the imperative,
# naming the user-visible outcome and where it happens, and it fails review
# when it describes the situation instead ("Ship the email wordmark the
# invite email already points at"). The commit subject is Conventional
# Commits; the pull request title is the task title with the prefix; the
# release note is what a customer can now do. `write-task-contract` requires
# the form and lists what fails review, the planner names the task before it
# writes the contract, and the engineer builds the commit subject and the
# pull request title from the title rather than truncating the objective.
#
# 1.9.0 - the Factory page: `pages/factory.yaml` is the landing page and the
# 60-second control plane, on core's new `overview` archetype. Seven panels,
# in the order the six questions are asked: products with what is owed and what
# is building, what changed since THIS viewer last looked, the outcomes in
# flight with their task progress, the queue with its reason codes, the
# decisions waiting with their estimated minutes, spend over accepted change
# with the waste line, and work autonomy reported apart from what it cost a
# person. A figure the records cannot support says so in the figure's place.
#
# 1.10.0 - the plan, before the contract: a request that needs an architecture
# plan gets one, and a person approves it, before any worker runs. The rule is
# read off fields the contract already carries. A plan is REQUIRED when the risk
# class is auth, billing, schema, infra or promise, when the work spans more
# than one repository or declares a cross-repo dependency, when the allowed
# paths span more than one package, when it changes a public interface (an HTTP
# route, an object type schema, a database migration, a published contract), or
# when more than one task sits under the request or the estimate is over the
# threshold. It is OFFERED AND SKIPPABLE for a ui or logic change touching more
# than one file, and a skip records its reason, because an optional step with no
# recorded skip becomes a step nobody takes. `architecture_plan` is the noun,
# the Task planner (Architecture, SA) writes it through
# `skills/write-architecture-plan`, the feature report carries it as a stage
# between triage and the contract, and the worker refuses a contract that needed
# a plan and carries none before the repository is cloned.
#
# 1.11.0 - why a piece of work exists, and what a person wants next. Every
# request and every task carries `why`, one or more codes from the closed list
# in core, and `whyNote`, the evidence behind them in one line. Triage writes
# the codes from the record and leaves a request untagged when the evidence
# names none; the planner refuses to plan a request with no reason; the task
# inherits it; `write-task-contract` and `review-against-contract` fail a task
# that carries none. `operating-intent.yaml` holds what a person wants the
# factory doing - outcomes, what beats what, constraints, a budget, autonomy
# policy and product judgment - and is composed into the prompt of every agent
# that chooses or ranks work. The budget advises; it does not stop a run.
# One ruling asked about four releases is also now one decision sheet: the
# reply pass files the release-notes ownership asks under one `group_key`.
#
# 1.12.0 - Products is a portfolio board, and the simplest page in the factory.
# The test it is built to pass: could a person understand the state of every
# product while walking from their desk to the kitchen? So the page starts with
# the products, and a row is six facts drawn as one block, not fourteen columns
# behind a horizontal scrollbar: the product and who answers for it, its stage,
# its health, our price beside the incumbent's as ONE fact, what last shipped
# and when, and what is still owed with how much of it is moving and whether
# any of it is urgent. The seven summary cards wait until there are eight
# products to summarise, the methodology essay moves behind "About this data",
# and provenance leaves the labels for the type schema. A product nothing
# watches has no health and no `healthSource`, so the board says "monitoring
# not connected", about us and fixable, rather than `unknown`, which sounds
# like doubt about the product; `unknown` is gone from the health enum. There
# is no revenue column, because no verified revenue source exists and core now
# drops a field no row can fill. `medianDaysToShip` leaves the board entirely
# and is left empty on the record below three closed requests that each name
# the release that closed them, and whenever it would round to 0 days: over
# the live records on 2026-09-21 the three-request floor was cleared and the
# figure was still 0, because every measurable request closed within fifteen
# hours of being asked. A confident 0 is worse than no figure at all. The
# lead's `keep-the-board-honest` tick maintains the new counters: `lastShipped`
# and `lastReleaseAt`, `inFlight`, `healthSource` and `healthCheckedAt`.
#
# 1.13.0 - the surface standard, written down and attached. One playbook,
# `playbooks/designing-a-surface`, holds the rule this product has now had to
# state three times: index pages display decisions and meaning, detail pages
# display records and evidence. With it, the companion rule that a missing
# optional capability makes the interface SMALLER rather than filling it with
# blank cells, and the division the navigation expresses (Factory how the
# business is doing, Products what we operate, Work what we are doing about
# it, Review only decisions, Performance whether the machine earns its keep,
# Activity that everything happened). It is attached to what writes and
# reviews a page: `write-task-contract`, `write-architecture-plan`,
# `review-against-contract`, the planner, the engineer and the reviewer. Work
# is the first page rebuilt to it: `pages/work.yaml` declares
# `derive: workQueue` and reads as four lanes with ordered Next, derived
# Waiting, capped Done and probes dropped.
#
# 1.14.0 - Performance answers whether this team is getting faster, cheaper,
# better and less demanding of a person, in four numbers: shipped outcomes,
# median ask to ship, cost per shipped outcome, and decision minutes. The cost
# figure is a ratio over the same pool the count beside it reports, so a
# reader who divides the two gets the third; it used to be an average over
# the rows that carried a figure, and nothing reconciled. Waste is gone,
# because a request investigated and honestly answered no is a delivered
# outcome, not money burnt. What replaced it is REWORK: spend that produced
# no accepted outcome and had to be discarded or repeated, rolled up on the
# request from the tasks that ended `rejected` or `abandoned`, which is the
# same definition the Factory page already used. A request also rolls up
# `shippedAt` from the earliest release that names it, which is what makes a
# cycle time measurable at all. The eighteen per-tag tables are gone: a
# request carries several tags and its money landed under each, so they never
# added up. The evidence groups by outcome, where every request sits once.
version: 1.14.0
description: Every request — bug, review, email, incident — is tagged, ranked and, ten at a time, put in front of the person who decides; what they authorize becomes a task contract, a headless worker executes it in isolation, checks with evidence attached decide whether it worked, a person owns the merge, and every release reaches the asker — with the portfolio on top and the factory's evidence underneath.
depends: []
surfaces: []
recommend:
  when:
    - a deployment has repositories and wants changes proposed, verified and merged by a person
    - bug reports or feature requests arrive faster than anyone is working them
    - the same small change is made by hand in several repositories
    - a person asks what is in flight, what is stuck, and what nobody has answered for a week
    - bug reports, store reviews and support emails about the same product are tracked in different places, or nowhere
    - nobody can say which ten requests are most worth building next, or why, and the person who could decide is handed two hundred
  connectors: []
