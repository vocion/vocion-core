slug: repo
label: Repository
description: >-
  The registry a task contract is written against. A contract names a
  repository by slug, cites checks by the names written here, and takes its
  risk class from the paths it will touch — so the PM never invents a
  check command, a worker never runs one nobody agreed to, and a change to
  `policy/**` is at least `logic` whatever the PM called it. One record
  per repository the factory may open a pull request in; a repository with no
  record is one the factory does not touch.
icon: git-branch
# Its records read REPO-<id> in the app and in chat (core: libs/codes.ts).
code: REPO
schema:
  type: object
  # KEPT TRUE BY THE RELEASE ENGINEER (Chris, 2026-09-30): a repository that
  # makes a product and has no record yet is filed through its own tool
  # (core: services/agents/tools/fileRecord.ts). Moderated, unlike an
  # environment: its `checks` and `deployCommand` are commands the worker
  # runs, so a new one is a person's approval.
  x-agent-file:
    dedupOn: [slug]
  # RETIRED, NOT DELETED (2026-10-01: "retire REPO-312", a record for a
  # repository that does not exist). Retiring sets the row's status, so no
  # contract resolves to it, and keeps the record and its history; Undo puts
  # it back (core: libs/actions/objects-close.ts). A candidate nobody approved
  # is retired by rejecting its card.
  x-close:
    field: closedAs
    note: closedNote
    reasons:
      retired: {label: Retired — no build uses it, status: retired}
  properties:
    slug:
      x-display: {label: Slug, format: mono, group: Repository}
      type: string
      description: The handle a task's `repoSlug` uses. Short, stable, lowercase.
    closedAs:
      x-display: {label: Closed as, format: badge, group: Repository, tones: {retired: muted}}
      type: string
      enum: [retired]
    closedNote:
      x-display: {label: Why it was retired, role: prose, group: Repository}
      type: string
    url:
      x-display: {label: Repository, format: link}
      type: string
      description: Where the repository lives. The worker clones this; a person clicks it.
    defaultBranch:
      x-display: {label: Default branch, format: mono, group: Repository}
      type: string
      description: The branch a task's `baseSha` is read from and a pull request targets. Written down because `main` is a convention, not a fact.
    product:
      x-display: {label: Product, format: link, to: product}
      type: string
      description: Slug of the `product` this repository belongs to. A repository serving two products is listed under the one whose promises it carries.
    checks:
      x-display: {label: Checks, role: prose, format: steps, order: 1}
      type: array
      description: >-
        The deterministic checks a worker may cite by name, and the exact
        command each one runs. A task's `requiredChecks` are names from this
        list; the worker runs the command as written here, never a paraphrase.
        A check that is not here does not exist for the factory.
      items:
        type: object
        properties:
          name: {type: string, description: 'How a contract and a verification entry refer to it — `unit`, `typecheck`, `e2e-checkout`.'}
          command: {type: string, description: 'The shell command, exactly as CI runs it.'}
    deployCommand:
      x-display: {label: Deploy command, format: mono, group: Repository}
      type: string
      description: How this repository reaches production. Recorded so the deploy is a named action a person approves, never a command a worker discovers.
    generatedFrom:
      x-display: {label: Generated from, role: prose, format: steps, order: 3}
      type: object
      additionalProperties:
        anyOf: [{type: string}, {type: array, items: {type: string}}]
      description: >-
        A map from a generated path glob to the source it is rebuilt from, e.g.
        `apps/api/prisma/schema/**: packages/core/prisma/**`. A plan that names
        a generated file brings its source into the engineer's allowed paths,
        so the change lands where it survives the next build.
    productPaths:
      x-display: {label: Paths by product, role: prose, format: steps, order: 4}
      type: object
      additionalProperties: {type: array, items: {type: string}}
      description: >-
        A map from a product slug, or `<product>.<surface>`, to the path globs a
        change to it may touch, e.g. `send: [apps/send-api/**, apps/send-web/**]`
        and `send.data: [apps/send-api/**]`. A request built with no plan takes its
        allowed paths from here, its surface's entry first.
    riskDefaults:
      x-display: {label: Risk floor by path, role: prose, format: steps, order: 2}
      type: object
      description: >-
        A map from path glob to the LOWEST risk class a change touching it may
        carry — `policy/**: logic`, `billing/**: billing`, `migrations/**:
        schema`, `infra/**: infra`. The planner reads it when writing a
        contract and the reviewer reads it when grading one: a task whose
        `riskClass` is below what its touched paths demand is rejected before
        the diff is read. This is what makes a bug fix safe to speed up — the
        danger is in the files, not in the word "bug". `pricing/**: promise`
        is how a product's written promises become a path rule.
      additionalProperties:
        type: string
        enum: [docs, marketing, deps, ui, logic, auth, billing, schema, infra, promise]
    owners:
      x-display: {label: Owners, group: Repository}
      type: array
      description: The people who answer for this repository — who a reviewer's ask goes to and whose name is on a merge nobody else should make.
      items: {type: string}
    # WHAT THE RUNNER NEEDS TO BUILD HERE (backlog 052). The runner (core's packages/runner)
    # names no product: how this repository's surfaces build and serve, which services its
    # tests need and the files its people own are written here, and the dispatch carries them
    # into the task contract.
    qaSurface:
      x-display: {label: QA surface, format: mono, group: Runner}
      type: string
      description: The surface a change a person can see is screenshotted on, by its name under `surfaces`. Defaults to the first one.
    surfaces:
      x-display: {label: Surfaces, role: prose, format: steps, order: 5}
      type: object
      description: >-
        Each surface a change can be seen on, by name (`app`, `marketing`): the product
        environment that serves it live (`environment`, matched to an environment record's
        `surface`, else the surface's own name), and how the branch builds it for the after
        shot. `build.command` builds it from the repo root, `build.dist` is where the files land,
        `build.spaFallback` serves index.html for an unknown path, `build.env` is the build's
        environment and `build.signedInEnv` the repo's preview or mock mode for a flow that needs
        an account, so no credential exists to leak. `listRoutes` are where a list of records
        lives when a flow's path names a placeholder; `errorText` the phrases this surface's error
        states show; `previewNote` what the engineer should know about the preview's data.
      additionalProperties:
        type: object
        properties:
          environment: {type: string}
          build:
            type: object
            properties:
              command: {type: string}
              dist: {type: string}
              port: {type: integer}
              spaFallback: {type: boolean}
              env: {type: object, additionalProperties: {type: string}}
              signedInEnv: {type: object, additionalProperties: {type: string}}
          listRoutes: {type: array, items: {type: string}}
          errorText: {type: array, items: {type: string}}
          previewNote: {type: string}
    services:
      x-display: {label: Services, role: prose, format: steps, order: 6}
      type: array
      description: >-
        The services this repository's checks need beside the runner: `postgres` alone, or
        `{name: postgres, url, env, setup}` naming the address its tests expect, the variables it
        is exported as (default DATABASE_URL and TEST_DATABASE_URL) and the commands that prepare
        it (its migrations). The deploy target provides the service; the runner waits for it.
      items:
        anyOf:
          - {type: string}
          - type: object
            properties:
              name: {type: string}
              url: {type: string}
              env: {type: array, items: {type: string}}
              setup: {type: array, items: {type: string}}
    setup:
      x-display: {label: Setup, role: prose, format: steps, order: 7}
      type: array
      items: {type: string}
      description: Commands run from the repo root after install and services, before the engineer starts (a generated client, say).
    humanOwned:
      x-display: {label: Owned by a person, role: prose, format: steps, order: 8}
      type: array
      items: {type: string}
      description: Path globs a person owns in this repository beyond secrets, .git and CI workflows. The engineer may not change them and the runner never commits them.
    engineerRules:
      x-display: {label: Engineer rules, role: prose, format: steps, order: 9}
      type: array
      items: {type: string}
      description: This repository's standing rules for the engineer, one line each (a house style a check enforces, a convention). Every build here carries them.
    notes:
      x-display: {label: Notes, role: prose, order: 3}
      type: string
      description: Standing knowledge a worker needs before its first commit here — how to run it, what is generated, what never to hand-edit. Markdown.
