slug: request
label: Request
description: >-
  The single intake noun. A bug report, a feature request filed on a product
  site, a store review, a support email, a message in chat and an incident are
  ONE object arriving on different channels — not five types — because the
  factory's promise is made to the request, whatever door it came through:
  within a week it is a shipped change, an honest written answer, or a link to
  the request it duplicates. Everything downstream (triage, the task contract,
  the merge ask, the reply) hangs off this record by id, which is what makes
  "nobody asked for this" a checkable claim rather than a feeling.
icon: inbox
# Its records read FE-<id> in the app and in chat (core: libs/codes.ts).
code: FE
schema:
  type: object
  # Internal work, not an extracted record: nothing about it is published
  # outside, and Build is the person's decision. So filing one is done for
  # you under its own trust key (objects.propose_candidate.request), and a
  # request filed from chat lands on Work at once (Chris, 2026-09-28: "it
  # should probably auto file, and the card should be to start the build").
  x-moderation: none
  # WHAT THE FACTORY KEEPS FOR ITSELF (core: libs/workspace/bookkeeping.ts).
  # A write that changes only these paths is bookkeeping: it moves no open page
  # (no live notice), makes no body version and raises no `object.updated`, so
  # nothing downstream wakes for it. #269, 2026-09-30: four "drawing, attempt
  # 2" marks in four minutes re-read the open feature page each time and fired
  # `factory-contract-changed` and `design-mockup-default` five times each, all
  # to say they had nothing to do. The value is still written; the next change
  # a person would see carries it to the page.
  x-bookkeeping: [visuals.mockupDraw, recovery.handledRunIds, recovery.log, recovery.planRequestedAt, rollupsUpdatedAt]
  # When a question about a request stops being a question (backlog 039): a
  # Review item asking about one closes itself once the request ends here.
  x-settled: {field: state, in: [shipped, answered, out_of_scope, deferred]}
  # THE SAME ASK TWICE (core: services/objects/duplicateCheck.ts, backlog 044).
  # #268 was filed from chat a minute after #265 asked for the same thing and
  # got its own Build card. Now, when a request is filed, a model reads the
  # product's open requests (and ones closed in the last two weeks) and, sure
  # at the bar, links it with `duplicateOf`, done for you with Undo; the
  # intake starts nothing for it. Below the bar nothing is written or said.
  x-duplicate-check: {field: duplicateOf, within: [product], compare: [outcome, story, body], bar: 0.8, settledDays: 14}
  # THE PRODUCT IS READ, NOT GUESSED (core: services/objects/referenceRead.ts).
  # 2026-10-01, #294: asked "On Stamp's document page, show how many pages…",
  # the PM filed it under another product without looking products up, and
  # the build was refused because that product has no repo. Now, when a
  # request is filed, a model reads the person's own words against every
  # product (its name, names it goes by, tagline, aliases) and returns which
  # one they meant, with a confidence and their words. Sure at the bar and
  # different from the filing, the product is corrected, done for you with
  # Undo, and the request says so in one line. Title and story are not edited.
  x-reference-read: {field: product, type: product, key: slug, describe: [name, launchName, workingName, aliases, tagline], bar: 0.8}
  # WHO ANSWERS ON ITS PAGE (core: services/agents/router.ts pageOwnerDecision).
  # A chat opened on a request's page is the product manager's, whatever the
  # message's keywords score, unless the person names another agent
  # (conversation 362: "Three changes to this request…" went to
  # change-reviewer on "changes", and nothing was written).
  x-owner: product-manager
  # THE FRONT DOOR (core: services/chat/intake.ts). A card in chat offers
  # Build it when a type declares itself the intake; the tap hands the idea to
  # the type's `x-owner` as the person's word, who files it here and starts
  # the build (Chris, 2026-10-04: "a path to just push the idea into the
  # software factory from chat … universal. Simple. Magical. Fast.").
  x-intake: true
  # FILED THROUGH ITS OWN TOOL (core: services/agents/tools/fileRecord.ts).
  # An agent that works with requests gets `file_request`, whose arguments ARE
  # these fields: the proposal-ready bar below marked required, `product` as
  # one of the workspace's product slugs, `why` from its closed list — and
  # the identity set here, never by the model. Conversation 353 (2026-09-28):
  # propose_action with free-form fields guessed the shape (`product:
  # "Stamp"`, no story, no dedupOn), was refused twice, and nothing was filed.
  x-agent-file:
    dedupOn: [product, title]
    # A title longer than the title's maxLength is kept here, as the ask, and
    # the request is named by a model (core: services/agents/tools/fileRecord.ts).
    longTitleTo: body
    fields: [product, kind, outcome, story, body, acceptance, mainRisk, visuals, whyNote, gapCheck, why, severity, sizeClass, surface, askedBy, evidence, icp, source, theme, tags, expectedResult, howWeCheck]
    omit: [acceptance.met, acceptance.evidenceUrl, acceptance.checkedAt, visuals.beforeArtifactIds, visuals.mockupArtifactIds, visuals.afterArtifactIds, visuals.drawnArtifactId, visuals.mockupDraw]
  # RELATED (core: libs/workspace/related.ts): what a request is connected
  # to, read from what the records already say. The chat that started it
  # (first) and its artifacts are core's own; these are the factory's.
  x-related:
    - {key: product, label: Product, from: links, field: product, type: product, match: slug}
    - {key: plans, label: Plan, from: backlinks, type: architecture_plan, field: requestId}
    # Read for the pull requests; the tasks and their runs are the feature's
    # Timeline, not Related (2026-10-02: Related is records only).
    - {key: tasks, label: Engineering tasks, from: backlinks, type: engineering_task, field: requestId, hidden: true}
    - {key: pulls, label: Pull requests, from: url, field: prUrl, of: tasks}
    - {key: releases, label: Releases, from: backlinks, type: release, field: requestIds}
  properties:
    kind:
      x-display: {label: Kind, format: badge, group: Triage, tones: {bug: bad, incident: bad, gap: warn, idea: info, question: muted}}
      type: string
      description: >-
        What sort of thing was asked. `bug` — something promised does not work.
        `gap` — something expected is missing. `idea` — something new. `incident`
        — something is down or wrong for people right now. `question` — the
        asker wants to know, not to change. Decides the default route: bugs and
        incidents go to severity and a repo; ideas go to the scope decision.
      enum: [bug, gap, idea, incident, question]
    channel:
      x-display: {label: Channel, format: badge, group: Where it came from, tones: {site: info, store_review: warn, email: info, chat: info, github: info, tracker: info, dogfood: ok, internal: muted}}
      type: string
      description: The door it came through. Kept because the same request arrives differently by channel — a store review is public and terse, a dogfood note is trusted and specific — and the honest answer goes back the way it came.
      enum: [site, store_review, email, chat, github, tracker, dogfood, internal]
    product:
      x-display: {label: Product, format: link, to: product, group: Where it came from}
      type: string
      description: Slug of the `product` record this is about. Every request belongs to a product; one that fits none is the first sign it is out of scope.
    title:
      x-display: {hidden: true}
      type: string
      # TICKET-SIZED (Chris, 2026-10-03: "The title is too long and verbose …
      # not a full request or spec in the title"). FE-402's title was the whole
      # ask — "On Stamp's library list, let me sort the documents by name,
      # upload date or last opened, newest first by default, and remember my
      # choice…" — and every row, page header and share page led with it. The
      # filing tool reads this limit; handed a longer title, it keeps the words
      # in `body` (`x-agent-file.longTitleTo`) and a model names the work
      # (core: services/objects/recordName.ts). Never cut by a character count.
      maxLength: 60
      description: >-
        A ticket-sized name for the work, at most 60 characters: a noun phrase
        or an imperative in the asker's terms ("Sort the library by name, date
        or last opened", "Upload date on each library row"). The row on Work
        and the heading of the feature page. Not the ask itself — the person's
        whole words go in `body`, verbatim.
    name:
      x-display: {hidden: true}
      type: string
      description: >-
        The short name a model read from a title longer than a name, for a
        request filed before titles were ticket-sized. Surfaces read it before
        the title (core: libs/workspace/recordName.ts). Never written by a filer.
    outcome:
      x-display: {label: Outcome, role: prose, order: 0}
      type: string
      description: >-
        WHAT A PERSON CAN DO AFTERWARDS THAT THEY CANNOT DO NOW, in one
        sentence, and the line every surface leads with.

        The asker's words are evidence and are kept verbatim in `body`; the
        title names the work. Neither states the change. A
        page that leads with the ask leads with a situation; a person deciding
        needs the outcome. "Add send/share to the file detail page" is a
        control and a place. "Allow users to send files to email recipients"
        is a capability, and a stranger can tell what will be different
        afterwards.

        Written at triage, to the task-title rules in the `naming-the-work`
        playbook: start with a verb, name the user-visible outcome, no file
        paths or modules, one sentence, one change. It fails review if a
        stranger would have to open the record to know what changes.
    body:
      x-display: {label: In their words, role: prose, order: 1}
      type: string
      description: >-
        The request as it arrived — the asker's own words, unedited. Triage summarises beside it,
        never instead of it. A request an agent puts forward has no asker: leave `body` empty and
        put the feature as you would say it to the person in `story`; the prompt or pass that led
        you to it is never the ask (the feature page and its share card show `story` for a proposal).
    story:
      x-display: {label: The story, role: prose, order: 2}
      type: string
      description: >-
        The change as the person who will use it would tell it: who they are,
        what they are trying to get done, and what happens today instead.
        Markdown, a few lines. Not a specification and not a substitute for
        the acceptance criteria — the criteria say how we will know; this says
        why anybody wants it.
    askedBy:
      x-display: {label: Asked by, group: Where it came from}
      type: object
      description: Who asked. Enough to answer them on their channel; nothing more is kept.
      properties:
        name: {type: string}
        email: {type: string}
        externalId: {type: string, description: 'Their id on the channel — a store reviewer id, a GitHub login, a chat user — so the reply lands where the request came from.'}
    askedAt:
      x-display: {label: Asked}
      type: string
      format: date-time
      description: When they asked. The seven-day clock starts here, not when triage noticed.
    evidence:
      x-display: {label: Evidence, role: prose, format: steps, order: 3}
      type: object
      description: What the asker gave us to go on. Kept as links and artifact ids so the PM and QA read the same thing the asker saw.
      properties:
        urls: {type: array, items: {type: string}}
        videoUrl: {type: string}
        screenshotArtifactIds: {type: array, items: {type: integer}, description: 'Screenshots as core artifacts — versioned, previewable, one tap from the request.'}
    gapCheck:
      x-display: {label: Is the gap still there, role: prose, group: Triage, order: 4}
      type: object
      description: >-
        Whether the thing being asked for is STILL missing from the running
        product, read at the moment work was about to start rather than when
        the ask arrived. A request records what was true the day somebody
        asked; a product that ships most days makes that a perishable claim.
        Required to FILE a gap or an idea (the proposal-ready gate: the
        product's capabilities page, read in the filing turn, among its
        sources) and again before a request may enter `in_scope` or
        `building` (still-missing), refused in code rather than asked for in
        a prompt, and good for fourteen days — so a replan re-reads it rather
        than trusting a month-old look.
      properties:
        finding:
          type: string
          description: >-
            `add` — none of it exists; plan it. `modify` — part of it already
            ships, so narrow the request to the part that does not and check
            that. `none` — it all ships; close it with an honest answer
            saying where it landed and when. Only `add` lets work start.
          enum: [add, modify, none]
        how:
          type: string
          description: What was actually looked at — the route, the screen, the endpoint, the file — so the next reader can repeat the check in one move rather than trusting it. With `none`, what already ships, in a sentence the person can be told.
        checkedAt: {type: string, format: date-time}
        sources:
          type: array
          items: {type: string}
          description: >-
            What the check read, one entry each: `wiki:<slug>` for a wiki page,
            `artifact:<id>`, a URL or a file path. A gap or an idea names its
            product's capabilities page (the product's `capabilitiesPage`),
            opened with read_wiki_page in the same turn that files it.
    surface:
      x-display: {label: Surface, format: badge, group: Triage, tones: {ui: info, flow: info, data: muted, infra: muted, none: muted}}
      type: string
      description: >-
        What this change alters for a person, which is what decides whether a
        visual is owed. `ui` — something they look at. `flow` — a path they
        follow through the product. `data` / `infra` — the machine underneath,
        which a person never sees. `none` — nothing user-facing. Set at triage;
        for work that already shipped it can be read off the diff, since
        `engineering_task.filesChanged` says which paths it touched.
      enum: [ui, flow, data, infra, none]
    visuals:
      x-display: {label: Visuals, role: prose, format: steps, order: 4}
      type: object
      description: >-
        What this outcome looks like — proposed before it is built, captured
        after it ships. Core artifacts, never a second noun: an artifact is
        already the thing that versions, previews and can be cited, so a
        mockup is an artifact, a flow diagram is an artifact whose body is a
        mermaid fence, and an after-shot is an image artifact.

        A `ui` or `flow` outcome owes a `before` to be decided and an `after`
        to be closed. `noVisualReason` is the recorded way out — a way out
        that is written down, never a silent skip.
      properties:
        beforeArtifactIds: {type: array, items: {type: integer}, description: 'The screen as it is today — the real screenshot a mockup is drawn on. Written by draw_mockup, never by hand. (On a record from before mockupArtifactIds existed it holds the mockups, and is read that way.)'}
        mockupArtifactIds: {type: array, items: {type: integer}, description: 'What we propose to build: the same real screen with only the change drawn in, one image per state worth seeing (at rest, hover, confirmation). Written by draw_mockup — which also writes beforeArtifactIds — never by hand, so a decision is made against the real app rather than an invented one (request #224, 2026-09-29). A flow diagram for a flow change goes here too.'}
        afterArtifactIds: {type: array, items: {type: integer}, description: 'What shipped, captured from the running product. GIF and video later; a still is enough to close.'}
        surfaceUrl: {type: string, description: 'The path on the live product where this can be seen (e.g. /account). The host comes from the product''s production environment, never from here: a full URL whose host is not one of the product''s environments is read as its path on the product.'}
        noVisualReason: {type: string, description: 'Why this user-facing change carries no visual. Recorded rather than assumed, so the gap is a decision somebody made and not an omission nobody noticed.'}
        mockupDraw:
          type: object
          description: >-
            Where the default mockup stands, written by the platform
            (`design-mockup-default`, `design-mockup-ended`), never by hand:
            `drawing` since `at` (attempt 1, or 2 on the one retry), or
            `failed` with the `reason` the drawing drew nothing — the line the
            feature page shows where the mockup would be. Cleared when
            draw_mockup files the mockups.
          properties:
            state: {type: string, enum: [drawing, failed]}
            attempt: {type: integer}
            at: {type: string, format: date-time}
            reason: {type: string}
            automationRunId: {type: integer}
        drawnArtifactId: {type: integer, description: 'The picture the PLATFORM drew from the record (services/factory/proposalVisual.ts) — a diagram of the shape of the change, kept current on every write. It is what a card shows when nobody has filed a real mockup, and it never satisfies the mockup gate: a drawing derived from the record is not evidence of a proposed experience, so `no mock` stays on the row until Design files one or `noVisualReason` says why not (review, 2026-09-24).'}
    acceptance:
      x-display: {label: Acceptance criteria, role: prose, format: steps, order: 5}
      type: array
      description: >-
        The contract between a person and the factory: what has to be true
        before this is done. Written before the work starts, in the language
        of the product rather than the implementation — "existing Send links
        continue to resolve", not "update the redirect map".

        This is what a person approves. "Done when it works" is not a
        contract, because nobody can tell whether it was met; a criterion a
        reader cannot check is the same as no criterion. Each one carries the
        evidence that settled it, so a review reads as a list of claims with
        proof attached rather than a diff to be trusted.

        Frozen at approval (`acceptanceFrozenAt`). If the factory discovers
        something that changes the contract materially it comes back rather
        than silently reinterpreting the job.
      items:
        type: object
        required: [statement]
        properties:
          statement: {type: string, description: 'One thing that must be true, stated so a person can check it. Present tense, user-visible where possible.'}
          met: {type: boolean, description: 'Whether it holds. Absent means nobody has checked yet, which is NOT the same as false.'}
          evidenceUrl: {type: string, description: 'What settled it — a test run, a screenshot, a smoke check. A criterion marked met with no evidence is an assertion, not a proof.'}
          checkedAt: {type: string, format: date-time}
    acceptanceFrozenAt:
      x-display: {label: Contract agreed, group: Triage}
      type: string
      format: date-time
      description: >-
        When the acceptance criteria stopped being a draft and became the
        thing the factory is building against. Set at approval. A change after
        this is a renegotiation and needs a person, which is what stops the
        job being quietly reinterpreted mid-build.
    severity:
      x-display: {label: Severity, format: badge, group: Triage, tones: {p1: bad, p2: warn, p3: muted}}
      type: string
      description: For bugs and incidents. `p1` — people cannot use what was promised, nothing waits overnight. `p2` — promised, broken, worked around. `p3` — wrong but tolerable. Not a priority score for ideas; an idea has value, not severity.
      enum: [p1, p2, p3]
    sizeClass:
      x-display: {label: Size, format: badge, group: Triage, tones: {major: warn, minor: info, patch: muted}}
      type: string
      description: 'Size in release terms, not in effort: `major` — a new capability or product, which counts against the initiative limit of one in flight; `minor` — a feature within a product; `patch` — a fix. Decides which release class it rides in and how it is announced.'
      enum: [major, minor, patch]
    decisionCost:
      x-display: {label: Decision minutes, group: Triage}
      type: integer
      description: >-
        Minutes of a person's attention the decision this request will ask for
        is estimated to take — the honest answer to a question, 1; a merge of a
        docs change, 1; a merge of a logic change, 5; a pricing or architecture
        call, 60. Summed across open asks against the daily decision budget by
        the promoter, so ten small merges cost a coffee and ten architecture
        asks cost a week.
    state:
      x-display: {label: State, format: badge, group: Triage, tones: {new: warn, triaged: info, in_scope: ok, out_of_scope: muted, deferred: muted, building: info, shipped: ok, answered: muted}}
      type: string
      description: >-
        Where it stands. `new` — arrived, unread. `triaged` — kind, product and
        risk tagged, duplicate check done. `in_scope` — it is in the twenty
        percent; a task will be written. `out_of_scope` — it will not be built,
        and the honest answer says why. `building` — a task is dispatched.
        `deferred` — a person said not now, with a reason and a revisit
        condition (`deferReason`, `deferredUntil`); it is a decision, not a
        rejection, and the request comes back when the condition is met.
        `shipped` — the change merged. `answered` — the reply went back. Every
        request ends in `shipped`, `answered`, or as a duplicate of one that did.
      enum: [new, triaged, in_scope, out_of_scope, deferred, building, shipped, answered]
    # THE ONE STATUS (Chris, 2026-10-02: "one enum list … a hierarchy of
    # status labels that run the logic for those 3 tabs"). Every value belongs
    # to exactly one group, and the group is the Work tab; the feature page's
    # Current state and the product page's counts read the same field. Core
    # holds no value of it (libs/objects/statusModel.ts): the labels, groups,
    # tones, who it waits on and which transition writes which value are all
    # here. One writer per transition — the request's durable workflow at each
    # step, the factory's handlers (dispatch, QA's verdict, the merge card, the
    # merge, the release, the live check, a stop) and a person's own actions —
    # and `x-transitions` says what each one writes. A write of another field
    # carries the status with it through `F:V` entries (an agent's `state:
    # triaged`, a person's Dismiss), first declared match first. A null or
    # unknown status reads as In progress.
    status:
      x-display: {label: Status, format: badge, group: Triage, tones: {new: muted, triaged: muted, deciding: warn, queued: muted, deferred: muted, planning: info, awaiting_plan: warn, building: info, in_qa: info, changes_asked: warn, awaiting_merge: warn, deploying: info, stopped: bad, shipped: ok, seen_live: ok, answered: muted, out_of_scope: muted, duplicate: muted}}
      x-labels: {new: Not triaged, triaged: Triaged, deciding: Decide, queued: Queued, deferred: Deferred, planning: Planning, awaiting_plan: Waiting on your plan approval, building: Building, in_qa: In QA, changes_asked: Changes asked, awaiting_merge: Waiting on your merge, deploying: Deploying, stopped: Stopped · needs you, shipped: Shipped, seen_live: Shipped · seen live, answered: Answered, out_of_scope: Out of scope, duplicate: Duplicate}
      x-groups:
        - {key: progress, label: In progress, role: progress, default: true, in: [planning, awaiting_plan, building, in_qa, changes_asked, awaiting_merge, deploying, stopped]}
        - {key: proposed, label: Proposed, role: proposed, in: [new, triaged, deciding, queued, deferred], last: [deferred]}
        - {key: done, label: Done, role: done, in: [shipped, seen_live, answered]}
        - {key: archived, label: Archived, role: archived, in: [out_of_scope, duplicate]}
      # Whose move it is: these lead their tab, and the product page counts them.
      x-needs-you: [deciding, awaiting_plan, changes_asked, awaiting_merge, stopped]
      # WHAT THE ASKER HEARS, WHERE THEY ASKED (Chris, 2026-10-06): the filing reply says it has
      # started; after that only what needs them and the end. A send-back that retries by itself,
      # QA, the merge on a trust rule and the deploy stay quiet. Keyed by transition; `{line}` is
      # the step's sentence and `{title}` the request's. The feature page follows every line.
      x-tell:
        stopped: 'Blocked, and it needs you: {line}'
        plan_waits: 'The plan is ready, and it waits on your approval. {line}'
        merge_waits: 'Ready to merge, and the merge waits on you. {line}'
        live: 'Done ✅ "{title}" is live in production and checked. {line}'
        live_seen: 'Done ✅ "{title}" is live in production and checked. {line}'
        live_unconfirmed: 'Live in production: "{title}". The live check could not confirm all of it. {line}'
        live_unchecked: 'Live in production: "{title}". It could not be checked live yet. {line}'
        resolved: 'Answered: {line}'
      x-transitions:
        # Filed, recommended, a Build card up.
        created: new
        recommended: deciding
        build_card: deciding
        # The request's durable workflow, by its stage (services/factory/requestWorkflow.ts).
        starting: building
        planning: planning
        building: building
        review: in_qa
        deploying: deploying
        merged: deploying
        live: seen_live
        live_unconfirmed: shipped
        live_unchecked: shipped
        stopped: stopped
        # The factory's handlers.
        qa_changes: changes_asked
        qa_reject: changes_asked
        live_changes: changes_asked
        merge_waits: awaiting_merge
        # A plan written for a person to approve (FE-133: PL-484 waited thirteen hours unasked).
        plan_waits: awaiting_plan
        merge_running: deploying
        shipped: shipped
        live_seen: seen_live
        resolved: answered
        # A write of another field, first match first.
        'duplicateOf:*': duplicate
        'recommendationState:rejected': out_of_scope
        'state:out_of_scope': out_of_scope
        'state:shipped': shipped
        'state:answered': answered
        'state:deferred': deferred
        'recommendationState:deferred': deferred
        'state:building': building
        'recommendationState:proposed': deciding
        'recommendationState:approved': queued
        'state:in_scope': queued
        'state:triaged': triaged
        'state:new': new
      type: string
      description: >-
        Where the request stands, in one field: Proposed (not triaged,
        triaged, decide, queued, deferred), In progress (planning, building,
        in QA, changes asked, waiting on your merge, deploying, stopped · needs
        you), Done (shipped, shipped · seen live, answered) or Archived (out of
        scope, duplicate). Written by the factory at each transition and by a
        person's own actions; agents do not set it by hand. `statusLine` says
        what is happening in a sentence, `statusAt` when it was written.
      enum: [new, triaged, deciding, queued, deferred, planning, awaiting_plan, building, in_qa, changes_asked, awaiting_merge, deploying, stopped, shipped, seen_live, answered, out_of_scope, duplicate]
    statusLine:
      x-display: {hidden: true}
      type: string
      description: The sentence written with the status — "RUN-478 is building attempt 2", "QA approved 8 of 8; the merge waits on a person". Empty when the transition said none.
    statusAt:
      x-display: {hidden: true}
      type: string
      format: date-time
      description: When the status was last written.
    answer:
      x-display: {label: The answer given, role: prose, order: 2}
      type: string
      description: The honest written answer, when the request will not be built or is a question — in the asker's terms, saying what was decided and why, never "we will consider it". Proposed as a gated reply; a person releases it.
    answeredAt:
      x-display: {label: Answered}
      type: string
      format: date-time
      description: When the answer or the shipped change went back to the asker. The seven-day clock stops here.
    tags:
      x-display: {label: Tags, group: Triage}
      type: array
      description: >-
        Feature tags, free strings — `onboarding`, `billing`, `search` — the
        handle a person uses to ask "what has search cost us so far". A
        request carries as many as fit; the Costs page groups by them, so a
        request tagged twice is counted under both, and a total under a tag
        is the cumulative spend on everything that carried it.
      items: {type: string}
    taskIds:
      x-display: {label: Tasks, format: link, to: engineering_task}
      type: array
      description: The `engineering_task` records this became. Usually one; several when it spanned repositories.
      items: {type: integer}
    estimateCents:
      x-display: {label: Estimated, format: money, group: Cost}
      type: integer
      description: ROLLED UP — the sum of `estimateCents` over the tasks whose `requestId` is this record, in cents. Recomputed by core when any of those tasks' cost is written; read `rollupsUpdatedAt` beside it.
    actualCents:
      x-display: {label: Actual, format: money, group: Cost}
      type: integer
      description: ROLLED UP — the sum of `actualCents` over the tasks whose `requestId` is this record, in cents. What this feature or bug has actually cost in model spend, every attempt included.
    varianceCents:
      x-display: {label: Variance, format: money, group: Cost}
      type: integer
      description: ROLLED UP — the sum of the tasks' `varianceCents`; negative is under the estimate.
    taskCount:
      x-display: {label: Tasks, group: Cost}
      type: integer
      description: ROLLED UP — how many tasks carry this request's id, whatever their status.
    reworkCents:
      x-display: {label: Rework, format: money, group: Cost}
      type: integer
      description: >-
        ROLLED UP: the spend on this request's tasks that were `rejected` or
        `abandoned`: money that produced no accepted outcome and had to be
        discarded or repeated. A failed attempt that contributed nothing, an
        implementation replaced by a later one, a retry that was not needed.
        This is the honest measure of waste. Money spent investigating a
        request that was then answered honestly is NOT rework, because holding the
        line is a valid outcome, and the factory is not charged for good
        judgement.
    reworkTaskCount:
      x-display: {label: Discarded attempts, group: Cost}
      type: integer
      description: ROLLED UP, how many of this request's tasks were `rejected` or `abandoned`. Zero on a request that has tasks means it was accepted first pass.
    shippedAt:
      x-display: {label: Shipped}
      type: string
      format: date-time
      description: >-
        ROLLED UP: the `releasedAt` of the EARLIEST release whose
        `requestIds` names this request. There is no record of when a request
        entered `shipped` (business objects keep no state history), so the
        deploy that carried it is the honest ship moment. `askedAt` to here is
        the cycle time the Performance page takes a median of; a request with
        no release has no ship date and is left out of that median rather than
        counted as instant.
    reviewFailedTaskCount:
      x-display: {hidden: true}
      type: integer
      description: ROLLED UP — tasks whose QA review ended without a verdict, even after the recording pass. Non-zero means the row says so instead of "no action needed".
    changesRequestedTaskCount:
      x-display: {hidden: true}
      type: integer
      description: ROLLED UP — tasks for this request that QA sent back with changes. Non-zero with nothing running means the next move is Build again.
    rollupsUpdatedAt:
      x-display: {label: Cost as of}
      type: string
      format: date-time
      description: When the rolled-up figures above were last recomputed. Empty means no task for this request has had a run end yet.
    duplicateOf:
      x-display: {label: Duplicate of, format: link, to: request}
      type: integer
      description: The id of the open request this duplicates. Setting it closes this request by itself — leave state as it is (no state means "duplicate"); the Work page archives it and the factory stops. Set by triage or a person; the asker is told.
    dedupeKey:
      x-display: {label: Dedupe key, format: mono, group: Where it came from}
      type: string
      description: A normalised handle triage computes — product plus the failing surface or the asked-for thing — so the third person reporting the same broken button is linked to the first rather than opening a third task.
    # ---- What the Product manager adds. Triage tags what a request IS; the
    # product manager tags who it serves, where it ranks, what was recommended
    # and what a person decided — and every one of these is written on the
    # request so the Backlog and Recommendations pages read it from the record.
    theme:
      x-display: {label: Theme, group: Triage}
      type: string
      description: The job this serves, in the product's own vocabulary — "export", "onboarding", "billing clarity". Set by the product manager's tag audit, not by triage; the handle a backlog is grouped and ranked by.
    icp:
      x-display: {label: Who asked, group: Where it came from}
      type: string
      description: Who this is for — the ideal customer profile it serves, in the words the product record uses for its people. Set by the product manager; a request that serves nobody the product is for ranks accordingly.
    source:
      x-display: {label: Source, format: link}
      type: string
      description: Who filed it, when it was not the asker on a channel. `product-manager` marks an idea from the weekly ideas pass, so the Recommendations page can count "ideas of ours" and the ranking can weigh an agent's idea as one source and zero askers.
    liveCheck:
      type: object
      description: >-
        What QA saw of this feature on the live product after its release
        (`record_live_check`): `state` (seen, partial, not_seen), the `line`
        the page reads, `releaseId`, `checkedAt`, `attempt`, `beforeMerge`
        (the lines production cannot show) and `lines` — what it saw of each
        acceptance line. Shipped and not yet seen live reads as such.
    releaseId:
      x-display: {label: Shipped in, format: link, to: release}
      type: integer
      description: The `release` record that shipped this request — the link from an answered request to the deploy that answered it. Written when the request moves to `shipped`; a `shipped` request with no release is what the tag audit names.
    priority:
      x-display: {label: Priority, group: Ranking}
      type: integer
      description: 'Where it ranks, 0–100, against four inputs and nothing else: the product''s written promises, the operating intent, how many real people asked (duplicates count) and analytics evidence when a source exists. Written by the product manager with its reasons beside it; never a severity, never an effort.'
      minimum: 0
      maximum: 100
    priorityReason:
      x-display: {label: Why that priority, role: prose, order: 4}
      type: string
      description: One to three sentences naming which of the four inputs moved the score and by how much — the promise kept, the count of askers, the analytics figure with its source and date. A priority without this is not written.
    rankedAt:
      x-display: {label: Ranked}
      type: string
      format: date-time
      description: When the priority was last scored. Older than the last weekly review reads as stale, and the page says so by showing the date.
    recommendedAt:
      x-display: {label: Recommended}
      type: string
      format: date-time
      description: When the product manager put this request in front of a person as a recommendation ask. Its presence is what puts the request on the Recommendations page.
    recommendationBatch:
      x-display: {label: Batch, format: mono, group: Ranking}
      type: string
      description: The ask group key the recommendation was filed under so the asks a person decided together read as one thing on the page.
    recommendedOutcome:
      x-display: {label: Proposed, format: badge, group: Ranking, tones: {build: ok, answer: info, decline: warn, merge: muted}}
      type: string
      description: 'What the product manager proposed a person do with it: `build` (the PM writes a contract), `answer` (an honest reply, it will not be built), `decline` (the same, when the reason is scope or a promise), `merge` (it duplicates an open request).'
      enum: [build, answer, decline, merge]
    recommendationState:
      x-display: {label: Decision, format: badge, group: Ranking, tones: {proposed: warn, approved: ok, rejected: bad, deferred: muted}}
      type: string
      description: '`proposed` — the ask is open and waiting on a person. `approved` — a person chose an outcome. `rejected` — a person said no; the request stays open and is not recommended again.'
      enum: [proposed, approved, rejected, deferred]
    decidedAt:
      x-display: {label: Decided}
      type: string
      format: date-time
      description: When the person decided the recommendation. The gap from `recommendedAt` to here is the decision latency the daily check reports.
    decisionReason:
      x-display: {label: Their reason, role: prose, order: 5}
      type: string
      description: The person's note on their decision, verbatim. On a rejection it is why, and it is quoted in the body if the request is ever recommended again on new evidence.
    why:
      x-display: {label: Why, format: badge, group: Why, tones: {user_request: ok, production_bug: bad, blocks_goal: warn, breaks_promise: bad, required_for_dogfood: warn, manual_toil: info, platform_leverage: info, factory_reliability: warn, observed_behaviour: muted}}
      type: array
      description: >-
        Why this, why now. One or more reasons from a closed list, never a
        number. A priority of 62 explains nothing; `user_request` plus
        `required_for_dogfood` explains everything a person needs to argue
        with. REQUIRED on every request triage touches: triage that cannot
        name a reason has not understood the request, and the honest move is
        to leave the request `new` and say what is missing rather than to
        invent one. The list is closed so that "how much of this week went to
        factory reliability" is answerable across records. Definitions live
        beside the codes in `libs/workspace/reasonCodes.ts`.
      items:
        type: string
        enum: [user_request, production_bug, blocks_goal, breaks_promise, required_for_dogfood, manual_toil, platform_leverage, factory_reliability, observed_behaviour]
    whyNote:
      x-display: {label: Why this, why now, role: prose, order: 6}
      type: string
      description: >-
        The codes grounded in this record's own evidence, in one short line:
        "3 user asks, dogfood blocker", "run 341 lost $11.86 of finished
        work". Names the countable thing behind the code, not a restatement
        of it: "user_request" is the code, "Chris and two dogfood users asked
        on 2026-09-20" is the note. Written with `why` and read beside it.
    # What rolls up onto a request, and from where: the tasks that point at it.
    # Core recomputes these from every such task when one task's cost is written
    # (packages/core/src/services/objects/rollups.ts); the page reads them like
    # any other field.
    mainRisk:
      x-display: {label: Main risk, role: prose, order: 6}
      type: string
      description: 'The one thing most likely to go wrong, in a sentence a person can weigh: "changes touch the existing upload flow", "the migration rewrites every plan row". Written by the PM before the build decision and shown on the card, because a decision without its risk is a hope.'
    expectedResult:
      x-display: {label: Expected result, role: prose, order: 7, group: Result}
      type: string
      description: 'What should be different for people once this ships — the outcome the ask was really about, not the change. "Interrupted uploads resume instead of failing." Written before the build decision; a request without one can still be built, but it can never be called a success.'
    howWeCheck:
      x-display: {label: How we will check, group: Result}
      type: string
      description: 'The metric, observation or requester confirmation that will show the expected result happened: "upload failure rate in PostHog, 7 days before vs after", "the three askers confirm", "reproduction no longer reproduces". Names a source a person can open.'
    checkAfter:
      x-display: {label: Check after, format: date, group: Result}
      type: string
      format: date-time
      description: 'When there will have been enough use to learn something — set at release from `howWeCheck` (a bug: the next day; a product bet: two weeks). The daily result pass reads shipped requests past this date and writes `result`, or asks the requester.'
    result:
      x-display: {label: Result, format: badge, group: Result, tones: {helped: ok, did_not_help: bad, not_enough_evidence: muted}}
      type: string
      description: 'Whether the shipped change did what it was for. `helped` — the check shows the expected result. `did_not_help` — it shows it did not, which is a new request, not a closed one. `not_enough_evidence` — the check could not be read, or too little use to say; recorded rather than left blank so "we do not know" is a fact on the record. Shipped is delivery; this is the outcome.'
      enum: [helped, did_not_help, not_enough_evidence]
    resultNote:
      x-display: {label: What the check showed, role: prose, order: 8, group: Result}
      type: string
      description: One or two sentences with the figure or the observation and its source, dated. The evidence behind `result`, one move away.
    resultCheckedAt:
      x-display: {label: Result checked, format: date, group: Result}
      type: string
      format: date-time
    deferReason:
      x-display: {label: Why not now, role: prose, order: 9, group: Ranking}
      type: string
      description: 'A person chose Defer: the reason, in their words. Distinct from a rejection — the ask is right, the time is not.'
    deferredUntil:
      x-display: {label: Revisit, format: date, group: Ranking}
      type: string
      format: date-time
      description: 'When, or on what condition, this comes back in front of a person. A date here; a condition goes in `deferReason`. The planning pass re-surfaces a deferred request once the date has passed, and never before.'
    told:
      x-display: {label: The asker was told, group: Telling people}
      type: object
      description: >-
        Whether the PERSON WHO ASKED heard back, what they were told, and whether
        it reached them — on this request, because one release carries several
        requests with different people on different channels and the release's
        own announcement cannot say which of them was answered. The release
        keeps what deployed, whether it is healthy and whether notes were
        published; this keeps who was told. A request is closed when this says
        sent, not when the release says announced.
      properties:
        at: {type: string, format: date-time, description: When the reply was released by a person.}
        channel: {type: string, description: 'Where it went — the store, the mailbox, the issue, the chat — the same channel the request came in on.'}
        what: {type: string, description: 'One line: shipped in v1.8 / decided not to, because … / deferred until …'}
        status: {type: string, enum: [sent, failed, not_needed], description: '`sent` — released and delivered. `failed` — released and the channel refused it; still open. `not_needed` — an internal ask with no external requester, recorded so the loop is closed on purpose.'}
    blocker:
      x-display: {label: Blocked on, group: Triage}
      type: object
      description: >-
        An ACTUAL obstacle, with an owner and a next action — never derived
        from "no task is running", which also describes work awaiting
        dispatch, awaiting QA or ready to merge. Written by the PM when a
        check has failed three times, a dependency was never accepted, an
        access or credential is missing, or a decision names a person who
        has not answered; cleared when the obstacle is. The Work board reads
        Blocked from this and only this.
      properties:
        what: {type: string, description: 'The obstacle in a sentence: "the staging account is not connected", "checks fail on the shared helper three attempts running".'}
        owner: {type: string, description: 'Who can clear it — a person by email, or an agent slug.'}
        next: {type: string, description: The one move that clears it.}
        since: {type: string, format: date-time}
        waitsOn:
          type: array
          description: >-
            The records whose decision clears it — a plan to approve, an ask to
            answer, a review item (action run) to decide. When any of them is
            decided the blocker is cleared on its own and the request's
            Activity says so (`services/factory/blocker.ts`); without this, the
            records `next` names ("approve plan 136") are read the same way.
          items:
            type: object
            properties:
              kind: {type: string, enum: [plan, ask, action]}
              id: {type: integer}

rollups:
  - {field: estimateCents, from: {type: engineering_task, by: requestId}, sum: estimateCents}
  - {field: actualCents, from: {type: engineering_task, by: requestId}, sum: actualCents}
  - {field: varianceCents, from: {type: engineering_task, by: requestId}, sum: varianceCents}
  - {field: taskCount, from: {type: engineering_task, by: requestId}}
  # Whether a worker is actually on it. `state: building` is a claim the
  # request makes about itself; this counts the tasks that are moving, so the
  # Work page can read a building request with nothing running as stopped
  # without storing a second state that could disagree with the tasks.
  - {field: runningTaskCount, from: {type: engineering_task, by: requestId}, where: {field: status, in: [dispatched, running]}}
  # The two waits the board must not call Blocked: work finished and waiting
  # on QA, and work QA approved waiting on a merge (review, 2026-09-24).
  - {field: awaitingReviewTaskCount, from: {type: engineering_task, by: requestId}, where: {field: status, in: [awaiting_review]}}
  - {field: acceptedTaskCount, from: {type: engineering_task, by: requestId}, where: {field: status, in: [accepted]}}
  # QA could not finish: the review ended without a verdict (review 5710 sat six hours as "no action needed").
  - {field: reviewFailedTaskCount, from: {type: engineering_task, by: requestId}, where: {field: status, in: [review_failed]}}
  # QA sent an attempt back (record_verdict: changes). The row says so and offers Build again.
  - {field: changesRequestedTaskCount, from: {type: engineering_task, by: requestId}, where: {field: status, in: [changes_requested]}}
  # Rework: the same tasks, narrowed to the ones that were thrown away. Money
  # spent and then answered rather than shipped is NOT here, on purpose.
  - {field: reworkCents, from: {type: engineering_task, by: requestId}, sum: actualCents, where: {field: status, in: [rejected, abandoned]}}
  - {field: reworkTaskCount, from: {type: engineering_task, by: requestId}, where: {field: status, in: [rejected, abandoned]}}
  # When it shipped: the earliest release that names this request. The link
  # runs the other way from the two above, because the release lists its requests.
  - {field: shippedAt, from: {type: release, inList: requestIds}, min: releasedAt}
classificationPrompt: >-
  Given a message from any channel — a form on a product site, a store
  review, an email, a chat message, a GitHub issue, a note from someone on the
  team — decide whether it is a request the factory owes an answer to, and if
  so which kind: bug, gap, idea, incident or question. Name the product it is
  about and, for a bug or incident, a severity. Compute a dedupe key from the
  product and the thing that is broken or asked for. Report a confidence and
  the words you matched on; when the product is unclear, ask rather than file.
# HANDOFF GATES (core: libs/gates/handoffGate.ts). The deterministic half of
# "the next seat rejects weak work without repairing it": a request may not
# be committed to (`in_scope`) until the PM's card is decision-ready. A write
# that fails is refused, the record reads "Returned to PM" on Work with the
# missing things named, and nobody is interrupted. The judge half (rubric +
# reference cases, escalation to a person) runs only after this passes.
gates:
  # PROPOSAL-READY: the bar a proposal meets before it reaches a person's
  # Proposed lane, taken from the six Stamp proposals Chris called great
  # (2026-09-27; wiki "What a good proposal looks like", eval
  # proposal-reference). Runs at the door: objects.propose_candidate refuses a
  # card that fails it, naming each missing thing, and the proposer fixes it.
  - name: proposal-ready
    when: {field: status, becomes: [candidate]}
    producedBy: product-manager
    require:
      - {field: product, present: true, message: name the product this is for}
      - {field: story, present: true, message: 'write the story as one person in their words — "As a founder who just sent a deck to an investor, I want…"'}
      - {field: outcome, present: true, message: say what the person can do afterwards}
      - {field: acceptance, minItems: 3, message: write three to six acceptance lines a person can check on the screen or in a named test}
      - {field: mainRisk, present: true, message: name the one thing most likely to go wrong, in a sentence}
      - {field: visuals.surfaceUrl, present: true, message: name the live page this changes, and attach a before-shot of it as it is today}
      - {field: whyNote, present: true, message: 'say why this does not exist yet: the file, screen or marketing line you checked against what the product already does'}
      # DOES IT ALREADY SHIP? Request #226 (2026-09-29) asked for link expiry
      # "because today I have no way to revoke access" — the product shipped
      # expiry and Kill, and its capabilities page said so. A gap or an idea is
      # filed only against what the product does today, read in this turn.
      - field: gapCheck.finding
        if: {field: kind, oneOf: [gap, idea]}
        oneOf: [add, modify]
        missingMessage: >-
          check what the product already does before filing: read its
          capabilities page (read_wiki_page), then record gapCheck.finding as
          add (none of it ships), modify (part of it ships — ask for the part
          that does not) or none (it all ships), with gapCheck.how,
          gapCheck.checkedAt and gapCheck.sources
        valueMessages:
          none: >-
            already ships: {gapCheck.how}. Nothing was filed. Tell the person
            where it is and how to use it, citing the page you read, instead of
            filing a request for it
        message: 'gapCheck.finding is "{value}", which is not one of add, modify or none'
      - {field: gapCheck.how, if: {field: kind, oneOf: [gap, idea]}, present: true, message: 'say what the check looked at, so the next reader can repeat it in one move'}
      - {field: gapCheck.checkedAt, if: {field: kind, oneOf: [gap, idea]}, present: true, message: say when the check was made}
      - field: gapCheck.sources
        if: {field: kind, oneOf: [gap, idea]}
        readThisTurn: {includes: product.capabilitiesPage}
        missingMessage: 'list what the check read in gapCheck.sources — the product''s capabilities page first, as wiki:<slug>'
        message: >-
          gapCheck.sources must name {page}, opened with read_wiki_page in this
          turn — it lists what the product already ships. Read it, compare the
          ask against it, and file only what it does not already do
  - name: decision-ready
    when: {field: state, becomes: [in_scope]}
    producedBy: product-manager
    require:
      - {field: product, present: true, message: name the product this is for}
      - {field: why, present: true, message: record the reason from the closed list, so it can be ranked}
      - {field: acceptance, minItems: 3, message: 'write at least three criteria a person can check — "done when it works" is not a contract'}
      - {field: expectedResult, present: true, message: say what will be different if this works}
      - {field: howWeCheck, present: true, message: say how we will know it worked}
      - {field: decisionCost, present: true, message: estimate the decision cost so the queue can carry it}
    # The judgement half: the PM's own rubric reads the card, calibrated on
    # the reference cases. Return goes back to the PM with a reason code and
    # an example; a schema/billing/auth/infra risk, or a judge under the bar,
    # goes to a person. The workspace turns the dials (`defaults.gates`).
    judge:
      rubric: rubric-product-manager
      cases: factory-reference
      escalateBelow: 0.6
      sampleRate: 1
      alwaysEscalate: {riskClass: [schema, billing, auth, infra]}
  # STILL MISSING? Nobody plans or dispatches a request without checking, on
  # the running product, that it is still missing: two of the first rows on
  # this board in September had already shipped. Was libs/actions/gapGate.ts
  # until 2026-09-25 (backlog 011); the same refusals, declared.
  - name: still-missing
    when: {field: state, becomes: [in_scope, building]}
    producedBy: product-manager
    require:
      - field: gapCheck.checkedAt
        present: true
        maxAgeDays: 14
        missingMessage: >-
          nobody has checked this is still missing. Look at the running product —
          the route, the screen, the endpoint it asks for — then record
          gapCheck.finding as one of add (none of it exists), modify (part of it
          already ships) or none (it all ships), with gapCheck.how naming what you
          looked at and gapCheck.checkedAt. Two of the first rows checked on this
          board in September had already shipped; a request is a statement about
          the product on the day it was asked, not today
        message: >-
          the gap was last checked {days} days ago and this product ships most
          days. Look again before a worker is sent at it, and re-stamp
          gapCheck.checkedAt with what you find
      - field: gapCheck.finding
        oneOf: [add]
        missingMessage: >-
          nobody has checked this is still missing. Record gapCheck.finding as one
          of add (none of it exists), modify (part of it already ships) or none
          (it all ships), with gapCheck.how and gapCheck.checkedAt
        message: 'gapCheck.finding is "{value}", which is not one of add, modify or none. Say which of the three the check found'
        valueMessages:
          none: >-
            the gap check found this already ships. Close it with an honest answer
            saying where it landed and when, in the asker's own terms. Building it
            again is the one outcome nobody wants
          modify: >-
            the gap check found part of this already ships. Narrow the request to
            the part that does not — rename it and rewrite its story so it asks for
            that alone — then check the narrowed ask and record the new finding. A
            request that is half true builds the wrong thing
  # THE CONTRACT IS MET, AND SEEN. A request may not call itself done while a
  # criterion is unmet, and a visible change is not finished until somebody has
  # looked at it. Was libs/actions/doneGate.ts until 2026-09-25 (backlog 011).
  - name: contract-met
    when: {field: state, becomes: [shipped, accepted, released, answered]}
    producedBy: qa
    require:
      - field: acceptance
        allItems: {field: met, equals: true, label: statement}
        message: >-
          {unmet} of {total} acceptance criteria are not met — {first}. Check each
          one against the running product and record the evidence, or come back
          and change the contract. Passing engineering checks is not the contract
          being met
  - name: shown
    when: {field: state, becomes: [shipped, accepted, released]}
    producedBy: qa
    require:
      - field: visuals
        if: {field: surface, oneOf: [ui, flow]}
        anyOf:
          - {field: visuals.afterArtifactIds, minItems: 1}
          - {field: visuals.noVisualReason, present: true}
        message: >-
          this is a visible change and nothing shows what it looks like now.
          Capture an after-shot from the running product, or record why there is
          nothing to show in visuals.noVisualReason. A visible change nobody has
          looked at is not finished
