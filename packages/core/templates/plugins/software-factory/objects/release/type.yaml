slug: release
label: Release
description: >-
  One deploy of one product that reached people: what went out, which tasks
  and requests it carried, what the post-deploy check said, and who was told.
  A release is the unit the portfolio counts ("shipped this month") and the
  unit `tell-the-requester` reads to close the loop, so it is written by the
  thing that deployed — a script or the engineer — over `POST /api/v1/objects`
  with the deploy's own key, and the health result is written to the same row
  once the check has run. A task that merged but never shipped is not a
  release, and a release nobody was told about is not finished.
icon: rocket
schema:
  type: object
  properties:
    product:
      x-display: {label: Product, format: link, to: product, group: What shipped}
      type: string
      description: Slug of the `product` this release belongs to. The join the two dashboards meet on.
    version:
      x-display: {label: Version, format: mono, group: What shipped}
      type: string
      description: The version or tag as the repository names it — `v1.4.2`, `2026.09.20`. What a person quotes when they say "since the release".
    releasedAt:
      x-display: {label: Released}
      type: string
      format: date-time
      description: When it reached the deployed environment, not when the merge happened. The portfolio's "shipped this month" counts from here.
    deployRunUrl:
      x-display: {label: Deploy run, format: link}
      type: string
      description: The deploy job that did it — a CI run, an action log — one tap from the release to the thing that made it.
    commitSha:
      x-display: {label: Commit, format: mono, group: What shipped}
      type: string
      description: The commit that was deployed. Read against `engineering_task.commitSha` to know which accepted tasks are actually live.
    prUrls:
      x-display: {label: Pull requests, role: prose, format: steps, order: 3}
      type: array
      description: The pull requests this release carried.
      items: {type: string}
    taskIds:
      x-display: {label: Tasks, format: link, to: engineering_task}
      type: array
      description: The `engineering_task` records whose merges rode in it. Each one moves to `accepted` only when its commit is in a release.
      items: {type: integer}
    requestIds:
      x-display: {label: Requests it closes, format: link, to: request}
      type: array
      description: The `request` records this release closes — the people who asked for something this shipped. `tell-the-requester` reads this list and proposes the reply to each on the channel they used.
      items: {type: integer}
    sizeClass:
      x-display: {label: Size, format: badge, group: What shipped, tones: {major: warn, minor: info, patch: muted}}
      type: string
      description: 'The largest size class the release carried, in release terms: `major` — a new capability or product; `minor` — a feature within a product; `patch` — fixes only. Decides how it is announced and how loudly.'
      enum: [major, minor, patch]
    estimateCents:
      x-display: {label: Estimated, format: money, group: Cost}
      type: integer
      description: ROLLED UP — the sum of `estimateCents` over the tasks in `taskIds`, in cents. What the work this release shipped was expected to cost.
    actualCents:
      x-display: {label: Actual, format: money, group: Cost}
      type: integer
      description: ROLLED UP — the sum of `actualCents` over the tasks in `taskIds`, in cents. What the work this release shipped actually cost in model spend. Recomputed by core when any of those tasks' cost is written; a release recorded after its tasks' runs ended picks the figures up the next time one of them changes, so read `rollupsUpdatedAt` beside it.
    varianceCents:
      x-display: {label: Variance, format: money, group: Cost}
      type: integer
      description: ROLLED UP — the sum of the shipped tasks' `varianceCents`; negative is under the estimate.
    rollupsUpdatedAt:
      x-display: {label: Cost as of}
      type: string
      format: date-time
      description: When the rolled-up figures were last recomputed.
    healthAfter:
      x-display: {label: Health after, format: badge, group: After the deploy, tones: {ok: ok, degraded: warn, down: bad, unknown: muted}}
      type: string
      description: What the post-deploy check said — the black-box e2e and the curl of the deployed URL against this version. `unknown` until the check has run; a release whose health stays `unknown` past the check window is treated as `degraded` by the board.
      enum: [ok, degraded, down, unknown]
    healthCheckedAt:
      x-display: {label: Health checked}
      type: string
      format: date-time
      description: When `healthAfter` was read, so a stale result reads as stale.
    verificationArtifactIds:
      x-display: {label: Evidence, group: After the deploy}
      type: array
      description: The artifacts behind `healthAfter` — the trace, the screenshot, the curl. Evidence one tap from the release row.
      items: {type: integer}
    outcome:
      x-display: {label: Outcome, role: prose, format: steps, order: 7}
      type: object
      description: >-
        What production said about this release once it had been live long
        enough to tell. NOT `healthAfter`, which is the smoke test minutes
        after the swap — that answers "did the deploy work". This answers "did
        the change work", which is a different question and usually a later
        one.

        Shipping is not the end of the loop. A factory that never looks back
        cannot tell a release that helped from one that quietly cost 15% of a
        funnel, and it is the looking back that turns an autonomous coding
        tool into a factory.

        Every measure carries its BEFORE. A number on its own is
        uninterpretable — "share completion 76%" says nothing; "91% → 76%"
        says the release broke something.
      properties:
        verdict:
          type: string
          description: '`validated` — it did what it was for. `regressed` — something got worse. `inconclusive` — the soak ran but nothing moved enough to say, which is an honest answer and not a failure. Absent means nobody has looked yet.'
          enum: [validated, regressed, inconclusive]
        checkedAt: {type: string, format: date-time, description: When the outcome was read. A verdict with no date cannot be told from a stale one.}
        soakHours: {type: number, description: How long it was live before the reading was taken. A verdict from ten minutes after a deploy is a smoke test wearing a verdict.}
        measures:
          type: array
          description: 'What moved, each with what it was before. A measure with no `before` is reported as unreadable rather than as flat.'
          items:
            type: object
            properties:
              label: {type: string}
              before: {type: number}
              after: {type: number}
              unit: {type: string}
              goodWhen: {type: string, enum: [up, down], description: 'Which direction is good. Errors falling is good and usage falling is not, and no arithmetic can tell them apart.'}
        note: {type: string, description: 'One line a person would say: "no change in errors, share completion fell 15 points".'}
        evidenceUrl: {type: string, description: 'The dashboard, query or trace the reading came from, so the verdict can be checked rather than trusted.'}
    notes:
      x-display: {label: Release notes, role: prose, order: 1}
      type: string
      description: >-
        The release notes, markdown, in the product's voice — written from the
        tasks the release carried and the requests it closed, NEVER from the
        diff. Each item names what a person can now do and cites the request
        that asked for it; no internal task ids, no model names, no file
        paths. Drafted by the agent (`write-release-notes`), owned by a person
        before it goes anywhere — see `notesSource`.
    notesSource:
      x-display: {label: Notes by, format: badge, group: Telling people, tones: {agent: info, human: ok}}
      type: string
      description: 'Who last wrote `notes`: `agent` — the draft, as the skill produced it; `human` — a person edited or approved it, and the agent does not overwrite it again. AI fills, human wins.'
      enum: [agent, human]
    announcement:
      x-display: {label: Announcement, role: prose, order: 2}
      type: string
      description: The short public text — one or two sentences a store listing, a status page or a chat channel can carry whole. Written from `notes`, in the house voice, and released only through the `release.announce` action.
    announcedAt:
      x-display: {label: Announced}
      type: string
      format: date-time
      description: When the announcement was released by a person. Empty means the release has not been announced, and `tell-the-requester` puts it first.
    announcedTo:
      x-display: {label: Announced to, group: Telling people}
      type: object
      description: Where the announcement went and who was told — the channels it was posted to, and the request ids whose askers heard that their request shipped (`notify.requester`, one reply each, on the channel they used). The difference between `requestIds` and `announcedTo.requestIds` is the loop still open.
      properties:
        channels: {type: array, items: {type: string}}
        requestIds: {type: array, items: {type: integer}}
# What rolls up onto a release: the tasks it lists in `taskIds`. Same
# mechanism as the request's, linked the other way round — the parent names
# its children.
rollups:
  - {field: estimateCents, from: {type: engineering_task, ids: taskIds}, sum: estimateCents}
  - {field: actualCents, from: {type: engineering_task, ids: taskIds}, sum: actualCents}
  - {field: varianceCents, from: {type: engineering_task, ids: taskIds}, sum: varianceCents}
