# The trust ladder for the factory, over the actions core registers
# (`libs/actions/factory.ts`, `libs/actions/github-rerun.ts`). Every rule ships DISABLED except the branch
# push: a plugin cannot know who owns a merge in someone else's deployment,
# and Vocion refuses to let one be unowned. The workspace turns a rung on by
# slug with `extends: core`.
#
# The shape: a branch is reversible and visible, so a worker pushes one on
# its own. A merge is the production deploy on most repositories, so it is a
# person's, however small the diff. Telling an asker or announcing a release
# reaches a real person, so a person releases it. Provisioning, anything on a
# cloud account and a credential are the floor.
rules:
  # Starting a build spends money on a model and hands a repository to a
  # worker: the product owner's tap on the card, every time. Undo cancels it
  # until a worker claims it.
  # A product decision on a request — defer, out of scope, answered, a
  # recommendation approved or rejected — is the product owner's. An agent may
  # recommend it on a card; it never writes it on its own.
  - action: objects.update_meta.request.decision
    autoApproveAbove: 1
    enabled: false
    rung: execute-with-approval
    risk: medium
  # Filing a request: done for you. It lands on Work under Proposed, where
  # Dismiss is the undo and Build is the person's decision.
  - action: objects.propose_candidate.request
    autoApproveAbove: 0.5
    enabled: true
    rung: execute-within-bounds
    risk: low
  # Registering an environment: done for you. It is the factory's own
  # registry of where a product runs; the deploy keeps it current over REST.
  - action: objects.propose_candidate.environment
    autoApproveAbove: 0.5
    enabled: true
    rung: execute-within-bounds
    risk: low
  - action: factory.dispatch_task
    autoApproveAbove: 1
    enabled: false
    rung: execute-with-approval
    risk: medium
  # The factory's own retry of an attempt QA sent back, carrying the verdict.
  # Its own key so a workspace can let it run done-for-you (Undo cancels it
  # until a worker claims it) while a first build stays a person's tap. An
  # attempt that was itself a retry is never retried again.
  - action: factory.dispatch_task.retry
    autoApproveAbove: 1
    enabled: false
    rung: execute-with-approval
    risk: medium
  # THE FACTORY CARRIES A REQUEST THROUGH (backlog 038). Three starts the
  # factory makes on its own, each its own key so a workspace can hold any one
  # of them at a person's tap. Each counts toward the limit — three automatic
  # attempts per request since a person last acted, then one ask — and each
  # is undone by cancelling the run until a worker claims it.
  #
  # A fix a person asked for in a conversation (a bug, an incident or a P1,
  # its acceptance written): the ask in chat was the decision.
  - action: factory.dispatch_task.from_request
    autoApproveAbove: 0.8
    enabled: true
    rung: execute-within-bounds
    risk: medium
  # A failed run sent again: with the failing checks' output, once after the
  # infrastructure failed, or with a contract the records have since changed.
  - action: factory.dispatch_task.recovery
    autoApproveAbove: 0.8
    enabled: true
    rung: execute-within-bounds
    risk: medium
  # The build an approved plan was written for. The approval was the decision.
  - action: factory.dispatch_task.from_plan
    autoApproveAbove: 0.9
    enabled: true
    rung: execute-within-bounds
    risk: medium
  # A plan the factory asked for. The factory is 0.9 sure of a plan that states
  # its approach, what changes, what was rejected, how it is verified and what
  # happens to existing data, for work a revert can undo; 0.6 of anything else
  # — so a plan for auth, billing, schema, infra or a promise is always a
  # person's, and so is one with a gap, on a card that recommends sending it back.
  - action: factory.approve_plan
    autoApproveAbove: 0.85
    enabled: true
    rung: execute-within-bounds
    risk: medium
  # Filing the plan is not approving it: the record lands in review.
  - action: objects.propose_candidate.architecture_plan
    autoApproveAbove: 0.5
    enabled: true
    rung: execute-within-bounds
    risk: low
  - action: git.push_branch
    autoApproveAbove: 0.7
    enabled: true
    rung: execute-within-bounds
    risk: low
  # Re-running a red check's failed jobs once (backlog 049): changes no code, and
  # Undo cancels the re-run while it runs. Done for you — the diagnosis read
  # the failure as flaky, or a person fixed the pipeline and answered its ask.
  # The repo family's ids (`repo.*`) name the code host's constructs, whoever
  # hosts the code; a rule a workspace wrote against the former GitHub id
  # (`github.rerun_failed_jobs`) still governs the same action.
  - action: repo.rerun_failed_checks
    autoApproveAbove: 0.8
    enabled: true
    rung: execute-within-bounds
    risk: low
  # The pipeline's owner opens its own fix (plugin 2.33.0, backlog 049): the
  # files as one commit on a vocion/pipeline-… branch and its pull request.
  # Opening one deploys nothing; Undo closes it and deletes the branch. Only a
  # seat whose harness grants repo.open_pull may propose it.
  - action: repo.open_pull
    autoApproveAbove: 0.8
    enabled: true
    rung: execute-within-bounds
    risk: medium
  # A deploy that should have run and did not, or a redeploy of what is
  # already merged, started with workflow_dispatch (plugin 2.34.0). The merge
  # was the decision; Undo cancels the run while it runs. Only a seat whose
  # harness grants it may start one.
  - action: repo.dispatch_pipeline
    autoApproveAbove: 0.8
    enabled: true
    rung: execute-within-bounds
    risk: medium
  # A release an environment went down on, rolled back (plugin 2.35.0): GitHub's
  # revert of its pull request, opened by the environment's own recovery after a
  # re-run and a redeploy did not bring it back. Undo closes the revert, or
  # reverts it once merged.
  - action: repo.revert_pull
    autoApproveAbove: 0.8
    enabled: true
    rung: execute-within-bounds
    risk: medium
  # THE FACTORY WRITES WHERE THE WORK IS READ (plugin 2.43.0). Three families
  # of connected system — the code host (`repo.*`), the issue tracker
  # (`tracker.*`) and the chat (`chat.*`) — each with the writes a seat makes
  # on them. Every one is proposed, every one has an Undo; the ones below run
  # done for you because a person can take each back in one move, and the
  # ones a person READS — a reply to the asker, a comment on their issue, a
  # post to a channel — are a person's to send, like `notify.requester`.
  #
  # A comment on a pull request: the engineer's run report, the release
  # engineer's reading of a red check. Undo deletes it.
  - action: repo.comment_pull
    autoApproveAbove: 0.8
    enabled: true
    rung: execute-within-bounds
    risk: low
  # QA's verdict as a review on the pull request, each finding on its line.
  # The verdict itself is recorded in Vocion first; this is its mirror where
  # the engineer reads. Undo dismisses the review.
  - action: repo.submit_review
    autoApproveAbove: 0.8
    enabled: true
    rung: execute-within-bounds
    risk: medium
  # A duplicate or runaway pipeline run on the deploy branch, stopped. Undo
  # starts it again.
  - action: repo.cancel_pipeline_run
    autoApproveAbove: 0.8
    enabled: true
    rung: execute-within-bounds
    risk: low
  # An issue filed from a request, in the asker's words, with the request
  # named in it. Undo deletes it — like filing a request, done for you.
  - action: tracker.create_issue
    autoApproveAbove: 0.8
    enabled: true
    rung: execute-within-bounds
    risk: medium
  # The issue's status kept in step with the request's state. Undo moves it back.
  - action: tracker.transition_issue
    autoApproveAbove: 0.8
    enabled: true
    rung: execute-within-bounds
    risk: low
  # Priority, labels, the release version and the link to the Vocion request
  # on an issue. Undo restores the previous values.
  - action: tracker.update_issue
    autoApproveAbove: 0.8
    enabled: true
    rung: execute-within-bounds
    risk: low
  # A mockup or an after-shot attached to the issue. Undo deletes the attachment.
  - action: tracker.attach_file
    autoApproveAbove: 0.8
    enabled: true
    rung: execute-within-bounds
    risk: low
  # A comment the asker reads on their own issue — the plan, the honest
  # answer, "shipped in…". It is `notify.requester` on the tracker: a person
  # sends it. The PM names the kind (`tracker.comment.<kind>`); a kind with
  # no rule reads this one.
  - action: tracker.comment
    autoApproveAbove: 0.95
    enabled: false
    rung: execute-with-approval
    risk: medium
  # An "acknowledged" reaction on the message that became a request, a
  # "shipped" one when it did. Undo removes it.
  - action: chat.add_reaction
    autoApproveAbove: 0.8
    enabled: true
    rung: execute-within-bounds
    risk: low
  # A reply in the thread the ask came from — the requester channel for a
  # chat-born request. A person sends it, like every message a client reads.
  - action: chat.reply_in_thread
    autoApproveAbove: 0.95
    enabled: false
    rung: execute-with-approval
    risk: medium
  # A post to a channel the workspace bound (formerly `slack.post_message`):
  # release notes, what shipped, an incident update. A person sends it.
  - action: chat.post_message
    autoApproveAbove: 0.95
    enabled: false
    rung: execute-with-approval
    risk: medium
  - action: git.merge
    autoApproveAbove: 1
    enabled: false
    rung: execute-with-approval
    risk: high
  # ...and that pull request merges itself when every check on its head is
  # green (Chris, 2026-09-30: "The PR merges on green by its trust rule, and a
  # revert is the undo"). Its own class, so it earns apart from a product's
  # merges, which stay the workspace's to rule.
  - action: git.merge.pipeline
    autoApproveAbove: 0.85
    enabled: true
    rung: execute-within-bounds
    risk: medium
  # ...and the rollback merges on green too: it puts back what was live and
  # healthy before, and Undo puts the release back.
  - action: git.merge.rollback
    autoApproveAbove: 0.85
    enabled: true
    rung: execute-within-bounds
    risk: medium
  # Telling the asker is two different things, and the ladder should be able
  # to tell them apart (review, 2026-09-24): a routine, evidenced completion
  # ("shipped in v1.8, here is the release") may earn its way out under a
  # policy the product owner turns on; a decline, an incident update or
  # anything that touches a promise is read by a person every time. The PM
  # names the kind on the proposal (notify.requester.<kind>); a kind with no
  # rule of its own reads the parent's.
  - action: notify.requester
    autoApproveAbove: 0.95
    enabled: false
    rung: execute-with-approval
    risk: medium
  - action: notify.requester.completion
    autoApproveAbove: 0.9
    enabled: false
    rung: execute-with-approval
    risk: medium
  - action: notify.requester.sensitive
    autoApproveAbove: 1
    enabled: false
    rung: execute-with-approval
    risk: high
  - action: release.announce
    autoApproveAbove: 0.95
    enabled: false
    rung: execute-with-approval
    risk: medium
  - action: deploy.release
    autoApproveAbove: 1
    enabled: false
    rung: execute-with-approval
    risk: high
  - action: deploy.provision
    autoApproveAbove: 1
    enabled: false
    rung: execute-with-approval
    risk: high
  - action: aws.mutate
    autoApproveAbove: 1
    enabled: false
    rung: execute-with-approval
    risk: high
  - action: credentials.write
    autoApproveAbove: 1
    enabled: false
    rung: recommend
    risk: high
