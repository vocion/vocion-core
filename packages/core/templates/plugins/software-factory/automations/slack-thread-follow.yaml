# THE THREAD FOLLOWS THE REQUEST (backlog 057; Chris, 2026-10-04: at-mention
# Vocion in Slack, and the fix comes back in the thread with evidence). Every
# status a request takes (`record.status_marked`, one event per write) is said
# in the Slack thread the request was asked in, in the step's own sentence,
# with the request's own page: filed, building, in QA, merged, shipped, seen
# live. When the status waits on a person (`x-needs-you`), the thread also gets
# what the waiting card shows — the feature demo recorded from the branch —
# and is told that a reply here decides it (approval by reply, gap 5).
# A request not asked in Slack posts nothing; a line already said is not said
# again. Core job: `slack-thread-follow`.
slug: slack-thread-follow
name: Tell the Slack thread
label: Told the Slack thread
doing: Telling the Slack thread
description: >-
  When a request moves, the Slack thread it was asked in hears the step in
  one sentence with a link to the request's page; when it waits on a person,
  the thread gets the demo the card shows and can decide it by replying.
  Only requests that came from Slack.
status: active
when:
  event: record.status_marked
  filter:
    typeSlug: request
do:
  job: slack-thread-follow
