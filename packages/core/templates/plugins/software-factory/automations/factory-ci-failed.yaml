# A FACTORY PULL REQUEST WHOSE CI FAILED GOES BACK TO ITS ENGINEER (Chris,
# 2026-09-30, #269: "Why is it stuck? Why did chat lie and not try to progress
# it"). QA starts only on a green CI, so a red one used to leave the task
# "awaiting review" with nothing running. Now the attempt is built again at
# once, carrying the failing checks and what GitHub's annotations say, on the
# same per-stage limit. Deterministic: a built-in job.
slug: factory-ci-failed
name: CI failed on a factory pull request
description: >-
  When the checks on a factory pull request finish without passing, build the
  attempt again with what failed, instead of leaving it waiting on a review
  that never starts.
status: active
agent: product-manager
when:
  event: pr.checks_completed
  filter:
    conclusion: failure
do:
  job: factory-ci-failed
