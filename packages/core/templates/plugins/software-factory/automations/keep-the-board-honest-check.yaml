slug: keep-the-board-honest-check
name: Morning board recompute
description: >-
  Wakes the Task planner each morning, after the nightly e2e has reported, to
  recompute every product's agent-maintained counters on the AppCurious board
  from the request and release records, and date them.
status: active
agent: task-planner
when:
  schedule: '0 11 * * *'
do:
  checkMission: keep-the-board-honest
  prompt: >-
    For every product in dogfood or live, read its request and release
    records and recompute: openRequests and p1Open from requests in an open
    state; shippedThisMonth and lastReleaseAt from releases with a releasedAt;
    medianDaysToShip from askedAt to the closing release over the last ninety
    days, or empty with the reason if fewer than three closed; health from
    last night's e2e and the newest release's healthAfter, unknown when
    neither exists. Write the counters and countersUpdatedAt on the product
    record. Do not touch revenue. Report one line per product naming the
    rows each counter came from.
