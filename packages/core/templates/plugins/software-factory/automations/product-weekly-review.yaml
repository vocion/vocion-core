slug: product-weekly-review
name: Monday product review
description: >-
  Wakes the Product manager every Monday to check the `product-review`
  mission — re-rank every product's backlog with the reasons on the record,
  file this week's ideas as requests, and, only if no batch is open, put the
  next ten recommendations in front of the accountable person — because a
  ranking nobody refreshes and a queue nobody bounds are how a backlog turns
  into a graveyard.
status: active
agent: product-manager
when:
  schedule: '0 14 * * 1'
do:
  checkMission: product-review
  prompt: >-
    Three passes, in this order. First, rank (rank-the-backlog): for every
    product in dogfood or live, score every open request against the
    product's promises, the twenty-percent test, the count of real askers
    including duplicates, and an analytics figure with source and date if a
    PostHog or Sentry source exists — write priority, priorityReason and
    rankedAt on each; leave a request you cannot give a reason unranked and
    say so. Second, ideate (ideate-from-evidence): read this month's
    feedback, dogfood notes, each product's incumbent fields and the
    analytics; dedupe every candidate against open requests; file at most
    five as requests of kind idea, channel internal, source product-manager,
    each naming the job it serves and its evidence. Third, recommend
    (recommend-in-batches): if any recommendation ask of yours is still open,
    file nothing and report who it waits on and for how long; otherwise
    assemble one batch of at most ten from the top of the ranking, skipping
    anything a person rejected, one groupKey, each ask naming the request,
    the proposed outcome, the decision cost and the evidence. Report in four
    lines: ranked per product, ideas filed, batch filed or waiting, what
    needs a person before anything else.
