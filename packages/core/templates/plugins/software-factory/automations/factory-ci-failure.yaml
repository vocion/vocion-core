# A FACTORY PULL REQUEST WHOSE CI FAILED IS ANSWERED (Chris,
# 2026-09-30, #269: "Why is it stuck? Why did chat lie and not try to progress
# it"). QA starts only on a green CI, so a red one left the task "awaiting
# review" with nothing running for seven hours. This file used to wake the PM
# on a `ci.check_failed` event nothing emitted; it now answers the event the
# GitHub intake does emit, and the answer is deterministic: the attempt is
# built again at once, carrying the failing checks and what GitHub's
# annotations say, on the same per-stage limit (services/factory/ciFailed.ts).
#
# 2.25.0 (backlog 049): why it is red decides where it goes. A typed read of
# GitHub's evidence says the change broke it (back to the engineer), a flaky
# test (the failed jobs re-run once), a red default branch (one fix on it for
# every pull request behind it) or the pipeline (an ask to its owner, the
# Release engineer).
slug: factory-ci-failure
name: A failed check is answered
description: >-
  When the checks on a factory pull request finish without passing, read why
  and answer it — back to the engineer, a re-run once, one fix on the default
  branch, or an ask to the pipeline's owner — instead of leaving it waiting on
  a review that never starts.
status: active
agent: release-engineer
when:
  event: pr.checks_completed
  filter:
    conclusion: failure
do:
  job: factory-ci-failed
  input:
    owner: release-engineer
