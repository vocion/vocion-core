# The approved plan dispatches its own build (backlog 038): nobody presses Build
# a second time. The contract takes its paths from the plan's components and
# carries the plan's id, so the worker builds this approach and no other.
slug: factory-plan-approved
name: A plan was approved
description: >-
  When a plan is approved — by a person, or within the trust bar — dispatch the
  build it was written for, with the plan's id. Deterministic: a built-in job
  on `plan.approved`.
status: active
agent: product-manager
when:
  event: plan.approved
do:
  job: factory-plan-build
