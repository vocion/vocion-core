# THE ASKER HEARS BACK WHERE THEY ASKED (Chris, 2026-10-06). One automation for the app's chat and
# a Slack thread alike: what the request type tells the asker for a move (`x-tell` on its status)
# is said once in the conversation it was asked in, and in that conversation's thread. Replaced
# `slack-thread-follow`, which did the thread's half with its own rules.
slug: tell-the-asker-in-chat
name: Tell the asker where they asked
label: Told the asker
doing: Telling the asker
description: >-
  When a request is blocked, waits on a person's merge, or is live in
  production, the conversation it was asked in hears it, in the app's chat
  and in its Slack thread, with the feature page. Said once each.
status: active
when:
  event: record.status_marked
  filter:
    typeSlug: request
do:
  job: asker-follow
