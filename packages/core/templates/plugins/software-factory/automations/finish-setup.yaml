# GITHUB CONNECTED; THE RECORDS FOLLOW. The one setup step a person must do
# is the login (the login is the approval). Everything after it the factory
# can do from what the installation grants: `source.connected` for the github
# connector (core: SourceCredentialService, plugin 3.31.0) has the PM read the
# grant with describe_sources and propose the product and repository records
# — for a person to accept, since a repository record is the contract QA
# verifies against. Capped low: a connection is a rare event, and two in ten
# minutes is a reconnection.
slug: finish-setup
name: GitHub is connected; file what it grants
label: Filed the setup records
doing: Filing the setup records
description: >-
  When GitHub connects, the PM reads which repositories the installation
  grants and proposes the product and one repository record per repository,
  with the default branch and URL as GitHub reports them.
status: active
when:
  event: source.connected
  filter:
    connector: github
  maxFiresPer10m: 2
do:
  checkMission: set-up-the-factory
  prompt: >-
    GitHub was just connected to this workspace. Call describe_setup to see
    which setup steps remain, then describe_sources for the github source to
    read the repositories the installation grants, and name any mismatch
    between the grant and the source's list as describe_sources reports it.
    If no product record exists, file one with file_product from what the
    repositories are (their names, READMEs via repo_read_tree when you can
    read them) — one product unless the repositories plainly belong to
    different products, and say so if they do. Then file one repository
    record per granted repository with file_repo: url, default branch and
    product slug as GitHub reports them, nothing typed from memory. A record
    that already exists is left alone. Report in three lines: what was
    connected, what you proposed for a person to accept, and what remains.
