slug: product-recommendations-check
name: Daily batch check
description: >-
  Wakes the Product manager each weekday to check the throttle half of the
  `product-review` mission — is a recommendation batch open, who is it
  waiting on, and for how many days — because the ten-then-pause rule only
  works if the pause is visible: when the accountable person is the
  bottleneck, the board says so in their name rather than routing around
  them.
# What "fails" means here. A mission check's run is `ok` when the fire ran
# and `error` when it crashed; core has no verdict for "the criteria are not
# met", so this card cannot turn red on its own when a batch is seven days
# old. The check therefore writes the failure where a person will read it —
# the mission's report names the person and the days, and the Recommendations
# page counts "awaiting decision" from the requests — and a criteria verdict
# on a check run is named as the core follow-up in the README.
status: active
agent: product-manager
when:
  schedule: '0 13 * * 1-5'
do:
  checkMission: product-review
  prompt: >-
    Read every open ask of kind recommendation filed by product-manager.
    If there are none, report "no batch open" and the date the last one was
    fully decided, and stop. If there are, report the batch's groupKey, how
    many of its asks are decided and how many are open, who the open ones
    are waiting on (the accountable person, by name), and how many days the
    oldest has waited since recommendedAt. If that is more than seven days,
    say plainly that the mission's criterion is not met and that the person
    named is the bottleneck — do not file anything, do not remind them on any
    channel, do not assemble a second batch. Report in one line per open ask
    and one summary line.
