slug: green-every-night-check
name: Nightly black-box e2e
description: >-
  Wakes the Task planner on the cadence of the `green-every-night` mission to check the
  standing charter and do only what needs doing now.
status: active
agent: task-planner
when:
  schedule: '0 10 * * *'
do:
  checkMission: green-every-night
  prompt: >-
    For every product in dogfood or live, read last night's black-box e2e result against its deployed URL and its artifacts. A red result — or no result — becomes a bug request with a severity and a dispatched task contract now, before the morning report. Then write the morning report: one word per product, green or red, with the artifact linked.
