slug: product-batch-decided
name: A recommendation was decided
description: >-
  Fires the moment a person answers one of the Product manager's
  recommendation asks — `ask.decided`, filtered to this agent and this kind —
  so the decision is written on the request and routed while it is fresh,
  and so the next batch is assembled only once the last ask of the current
  one is decided; the `product-review` mission's ten-then-pause rule, made a
  trigger rather than a habit.
status: active
agent: product-manager
when:
  event: ask.decided
  filter:
    agentSlug: product-manager
    kind: recommendation
do:
  checkMission: product-review
  prompt: >-
    One recommendation ask was just decided; its askId, status, decision,
    decisionNote and groupKey are in the event. Read the ask and the request
    it names (recommend-in-batches). Write on the request: recommendationState
    approved or rejected, decidedAt, and the person's note as decisionReason.
    Route it — an approved build sets state in_scope for the planner; an
    approved answer or decline drafts the answer in the asker's terms and
    sets state out_of_scope for tell-the-requester to propose the reply; an
    approved merge sets duplicateOf; a rejection leaves the request open with
    its reason and out of the next batch; an "other" with a note is read
    first and written as what it means. Then count the batch: if every ask
    sharing this groupKey is decided, assemble the next batch of at most ten
    from the current ranking, skipping anything rejected; if any is still
    open, file nothing. Report in two lines: what was decided and where it
    went; batch complete and next batch filed, or how many still wait.
