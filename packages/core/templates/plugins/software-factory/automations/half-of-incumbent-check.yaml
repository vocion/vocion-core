slug: half-of-incumbent-check
name: Monthly price read
description: >-
  Wakes the Task planner on the cadence of the `half-of-incumbent` mission to check the
  standing charter and do only what needs doing now.
status: active
agent: task-planner
when:
  schedule: '0 14 1 * *'
do:
  checkMission: half-of-incumbent
  prompt: >-
    For every product, read the incumbent's like-for-like plan price from its own pricing page — fetch the page, never a review of it — and record the figure, the source and today's date on the product. Where our price is not half of it, or the figure moved since last read, raise an ask carrying both numbers and the page. Change no price yourself. Report one line per product.
