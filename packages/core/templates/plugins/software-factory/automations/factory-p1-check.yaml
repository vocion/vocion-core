slug: factory-p1-check
name: End-of-day P1 check
description: >-
  Wakes the Task planner at the end of the working day to check that nothing
  P1 is open without a fix in flight or a named person holding it.
status: active
agent: task-planner
when:
  schedule: '0 23 * * 1-5'
do:
  checkMission: no-open-p1
  prompt: >-
    List every open P1. For each: is a task contract dispatched, is a fix
    waiting on a merge decision, or is a named person holding it with the next
    step written down? Anything in none of those three is the only thing you
    escalate tonight — put it on the queue with what is broken, what you tried
    and what you need. Report one line per P1 and nothing else.
