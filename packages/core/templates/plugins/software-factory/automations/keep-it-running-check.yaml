slug: keep-it-running-check
name: Tuesday keep-it-running check
description: >-
  Wakes the Task planner on the cadence of the `keep-it-running` mission to check the
  standing charter and do only what needs doing now.
status: active
agent: task-planner
when:
  schedule: '0 15 * * 2'
do:
  checkMission: keep-it-running
  prompt: >-
    For every live product: which dependencies are more than a month behind, which certificates and signing secrets expire inside ninety days, whether the week's spend is inside budget, whether every sending domain reads clean. Write a task contract per item that needs a change — a renewal is a credentials action for a person, so that one is an ask. Report one line per product.
