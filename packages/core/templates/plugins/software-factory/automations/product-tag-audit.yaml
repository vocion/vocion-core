slug: product-tag-audit
name: Daily tag audit
description: >-
  Wakes the Product manager each weekday morning, after the board recompute,
  to check the tagging half of the `product-review` mission — every request
  triaged or closed since yesterday carries product, kind, theme, ICP,
  severity where it applies, and the task or release that ended it — because
  a backlog you cannot filter is a backlog you cannot rank, and a shipped
  request with no release behind it is a claim nobody can trace.
# On a schedule, not an event, and here is why: a request is an object, and
# core emits no event when an object's `state` changes — `request.created` is
# the workspace's own event posted at intake, and there is no `request.triaged`
# to subscribe to. A daily pass over yesterday's changes is the honest shape
# until core raises one; when it does, replace `when.schedule` with
# `when.event: request.triaged` and this file says nothing else different.
status: active
agent: product-manager
when:
  schedule: '30 11 * * 1-5'
do:
  checkMission: product-review
  prompt: >-
    Read every request whose state changed since yesterday's audit. For each,
    check the planner's tags against the request's own words — kind, product,
    severity for a bug or incident, sizeClass — and correct only what the
    record contradicts, saying what you read. Add theme and icp where they
    are missing. For every request now in shipped, confirm releaseId names
    the release whose requestIds include it and taskIds names its tasks; for
    every request in answered, confirm answer is written. A request that fits
    no product is a question for a person, not a guess. Do not re-triage, do
    not rank, do not recommend. Report in two lines: requests fixed with what
    changed, requests needing a person and why.
