slug: stand-up-product-check
name: Monday product check
description: >-
  Wakes the Task planner on the cadence of the `stand-up-product` mission to check the
  standing charter and do only what needs doing now.
status: active
agent: task-planner
when:
  schedule: '0 16 * * 1'
do:
  checkMission: stand-up-product
  prompt: >-
    Read the one product in flight: its record, its stage, which of the platform-template pieces — site, e2e, admin filter, analytics, MCP server — have a task, a merged change or a written reason. Write the contracts that are missing, with request ids. If a second build brief has arrived, do not decompose it: raise an ask naming both and stop. Report the product's status in one dated paragraph.
