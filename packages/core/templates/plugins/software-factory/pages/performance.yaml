# Performance. Is this team getting faster, cheaper, better, and less
# demanding of a person?
#
# Four numbers answer it, in that order, and there are only four: what it
# shipped, how long a request waits to ship, what a shipped outcome costs,
# and how many minutes of a person's attention it asked for. Everything else
# on the page is a section under them, or the evidence table under those.
#
# TWO THINGS THIS PAGE WILL NOT DO.
#
# It will not print a figure a reader can disprove by division. "Cost per
# shipped outcome" is a `ratio`: the spend on shipped requests over the
# NUMBER of shipped requests, the same number printed beside it. The old page
# used `avg`, which divides by however many rows happened to carry a cost
# figure, so $35.62 and 9 outcomes sat next to $1.44 and nothing reconciled.
# A shipped request that cost nothing measurable is still a shipped request
# and still counts in the denominator.
#
# It will not call an honest answer waste. The old page summed the spend on
# `answered` requests and labelled it waste, which punishes the one outcome
# the factory promises besides shipping: a request investigated and honestly
# told no. Waste is REWORK: spend that produced no accepted outcome and had
# to be discarded or repeated, rolled up from the tasks that were `rejected`
# or `abandoned` (objects/request/type.yaml, `reworkCents`).
#
# ONE WINDOW. Every figure and every row obeys `window:` unless the stat says
# `lifetime`, so two numbers on this page are always over the same period.
#
# TAGS ARE FILTERS, NOT SECTIONS. The old page grouped by tag and printed
# eighteen tables that did not add up: a request tagged `naming` and `stamp`
# appeared under both, and so did its money. The evidence table groups by
# OUTCOME, where every request sits exactly once and the group totals sum to
# the page total. Tags stay as a column, and run-level cost, cost by model
# and cost by agent are one click away on Activity.
slug: performance
title: Performance
description: Is the factory getting better?
icon: gauge
nav: {section: Business, order: 3}
archetype: list
source: {kind: objects, objectType: request}
# This page IS its figures. It used to list every request under them, which
# made it a second Backlog — the same rows, in a worse order, under headings
# that were not about them. The records live on Backlog and Factory log; this
# page links out to them.
showRows: false
# `createdAt` and not a metadata date: every request has one, so no figure is
# quietly computed over a different set of rows than the one beside it. The
# window is a COHORT — the requests that arrived inside it — which is what
# makes a figure comparable with the same figure one period earlier.
window:
  field: createdAt
  label: Last
  options: [7, 30, 90]
  default: 30
# THE FOUR. Are we shipping faster, is quality holding, is it costing less,
# does it need less of me.
#
# Every one carries its DIRECTION, because the absolute number is nearly
# unreadable on its own: "$1.28 per release" says almost nothing next to
# "$1.28, down 38%". `goodWhen` is declared rather than inferred — cost
# falling is good and quality falling is not, and no arithmetic can tell them
# apart.
#
# The unit is a RELEASE, everywhere. "Outcome" is abstract AI language;
# release is software language, and one canonical denominator is what lets a
# reader divide any two of these figures and get a third.
stats:
  - label: Speed to release
    kind: medianHours
    from: meta.askedAt
    field: meta.shippedAt
    suffix: ' h'
    compare: prior
    goodWhen: down
    note: Hours from when a person asked to when the release carrying it went out, middle value. A request with no ask date or no release is left out of the median rather than counted as instant.
  - label: Cost per release
    kind: ratio
    field: meta.actualCents
    where: {field: meta.state, op: eq, value: shipped}
    format: money
    compare: prior
    goodWhen: down
    note: All model spend measured on released requests, divided by how many were released. Spend on work still in flight is not in the numerator.
  - label: Accepted first pass
    kind: ratio
    where: [{field: meta.state, op: eq, value: shipped}, {field: meta.taskCount, op: gte, value: 1}, {field: meta.reworkTaskCount, op: lte, value: 0}]
    of: [{field: meta.state, op: eq, value: shipped}, {field: meta.taskCount, op: gte, value: 1}]
    format: percent
    compare: prior
    goodWhen: up
    note: Of the released requests that took at least one task, the share where no task was rejected or abandoned. A request released without a task is in neither half, because there was no implementation to accept.
  - label: Human time per release
    kind: ratio
    field: meta.decisionCost
    where: {field: meta.state, op: eq, value: shipped}
    suffix: ' min'
    compare: prior
    goodWhen: down
    note: The minutes of attention the decisions on released requests were estimated to take, divided by how many were released. An honest answer is one minute; an architecture call is sixty.
  # ---- What the factory did without a person. Squatch's whole promise is
  # how much software this can produce without consuming an engineering team,
  # so it is stated as a share, not as three raw counters a reader has to
  # divide in their head.
  - label: Released without you
    group: Human involvement
    kind: ratio
    where: [{field: meta.state, op: in, value: [shipped, answered]}, {field: meta.decidedAt, op: missing}]
    of: {field: meta.state, op: in, value: [shipped, answered]}
    format: percent
    compare: prior
    goodWhen: up
    note: Of everything that reached a release or an honest answer, the share that got there without anyone being asked to decide.
  - label: Waiting on you now
    group: Human involvement
    kind: countWhere
    where: {field: meta.recommendationState, op: eq, value: proposed}
    lifetime: true
    note: Recommendations put in front of a person and not yet decided. This is the queue autonomy is meant to shrink, and it is a live count rather than a windowed one.
  - label: Releases
    group: Human involvement
    kind: countWhere
    where: {field: meta.state, op: eq, value: shipped}
    compare: prior
    note: Requests that reached a merged, released change in this window. This is the denominator every per-release figure above divides by.
# ---- Needs attention. These are EXCEPTIONS, and each is hidden when it is
# zero: a page that prints "0 defects" and "$0.00 rework" every week teaches a
# reader to skip the row, which is exactly where a real one would then hide.
  - label: Rework spend
    group: Needs attention
    kind: sum
    field: meta.reworkCents
    format: money
    hideWhenZero: true
    compare: prior
    goodWhen: down
    note: Spend that produced no accepted outcome and had to be discarded or repeated — a failed attempt that contributed nothing, an abandoned implementation, an implementation rejected and replaced. Money spent investigating a request that was then answered honestly is NOT here; holding the line is a valid outcome.
  - label: Defects reported
    group: Needs attention
    kind: countWhere
    where: {field: meta.kind, op: in, value: [bug, incident]}
    hideWhenZero: true
    compare: prior
    goodWhen: down
    note: Requests filed as a bug or an incident in this window, meaning something already released did not work. It counts the report, not its severity, and it cannot say which release introduced the fault, because nothing links a bug back to one.
# One chart, not a spreadsheet. A table of Aug 3 / Aug 10 / Aug 17 running
# horizontally is desktop-report UI and unreadable on a phone.
series:
  - label: Releases per week
    dateField: meta.shippedAt
    where: {field: meta.state, op: eq, value: shipped}
    bucket: week
    buckets: 8
    measures:
      - {label: Released, field: meta.actualCents, kind: count}
  - label: Cost per week
    dateField: meta.shippedAt
    where: {field: meta.state, op: eq, value: shipped}
    bucket: week
    buckets: 8
    format: money
    measures:
      - {label: Spent, field: meta.actualCents, kind: sum}
