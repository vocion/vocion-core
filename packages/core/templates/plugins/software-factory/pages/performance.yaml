# Performance. Is this team getting faster, cheaper, better, and less
# demanding of a person?
#
# Four numbers answer it, in that order, and there are only four: what it
# shipped, how long a request waits to ship, what a shipped outcome costs,
# and how many minutes of a person's attention it asked for. Everything else
# on the page is a section under them, or the evidence table under those.
#
# TWO THINGS THIS PAGE WILL NOT DO.
#
# It will not print a figure a reader can disprove by division. "Cost per
# shipped outcome" is a `ratio`: the spend on shipped requests over the
# NUMBER of shipped requests, the same number printed beside it. The old page
# used `avg`, which divides by however many rows happened to carry a cost
# figure, so $35.62 and 9 outcomes sat next to $1.44 and nothing reconciled.
# A shipped request that cost nothing measurable is still a shipped request
# and still counts in the denominator.
#
# It will not call an honest answer waste. The old page summed the spend on
# `answered` requests and labelled it waste, which punishes the one outcome
# the factory promises besides shipping: a request investigated and honestly
# told no. Waste is REWORK: spend that produced no accepted outcome and had
# to be discarded or repeated, rolled up from the tasks that were `rejected`
# or `abandoned` (objects/request/type.yaml, `reworkCents`).
#
# ONE WINDOW. Every figure and every row obeys `window:` unless the stat says
# `lifetime`, so two numbers on this page are always over the same period.
#
# TAGS ARE FILTERS, NOT SECTIONS. The old page grouped by tag and printed
# eighteen tables that did not add up: a request tagged `naming` and `stamp`
# appeared under both, and so did its money. The evidence table groups by
# OUTCOME, where every request sits exactly once and the group totals sum to
# the page total. Tags stay as a column, and run-level cost, cost by model
# and cost by agent are one click away on Activity.
slug: performance
title: Performance
description: Whether the factory is getting faster, cheaper, better and less demanding of a person, in four numbers, then quality, then what autonomy is actually saving.
icon: gauge
nav: {section: Software factory, order: 4, secondary: true}
archetype: list
source: {kind: objects, objectType: request}
sort: {field: meta.actualCents, dir: desc}
# Outcome, not tag: every request sits in exactly one group, so the totals
# under the groups add up to the totals on top.
groupBy: meta.state
# `createdAt` and not a metadata date: every request has one, so no figure on
# this page is quietly computed over a different set of rows than the one
# beside it. The window is a COHORT, the requests that arrived inside it,
# which is what makes "cost per shipped outcome" comparable period to period.
window:
  field: createdAt
  label: Requests that arrived in the last
  options: [7, 30, 90]
  default: 30
stats:
  # ---- The four. Output, speed, economics, human load. ----
  - label: Shipped outcomes
    kind: countWhere
    where: {field: meta.state, op: eq, value: shipped}
    note: Requests that reached a merged, released change in this window. The denominator of the cost figure beside it is this same number.
  - label: Ask to ship, median
    kind: medianHours
    from: meta.askedAt
    field: meta.shippedAt
    suffix: ' h'
    note: Hours from when a person asked to when the release that carried it went out, middle value. A request with no ask date or no release is left out of the median rather than counted as instant, so this is the median of the requests that can be measured, not of all of them.
  - label: Cost per shipped outcome
    kind: ratio
    field: meta.actualCents
    where: {field: meta.state, op: eq, value: shipped}
    format: money
    note: All model spend measured on shipped requests, divided by how many shipped. Every shipped request is in the denominator, including one that cost nothing measurable. Spend on work still in flight is not in the numerator; it is in the "building" group below.
  - label: Decision minutes asked of a person
    kind: sum
    field: meta.decisionCost
    suffix: ' min'
    note: The minutes of attention the decisions on this window's requests were estimated to take, summed. An honest answer is one minute; an architecture call is sixty.
  # ---- Quality. A cheap factory that ships poor work is not performing. ----
  - label: Accepted first pass
    group: Quality
    kind: ratio
    where: [{field: meta.state, op: eq, value: shipped}, {field: meta.taskCount, op: gte, value: 1}, {field: meta.reworkTaskCount, op: lte, value: 0}]
    of: [{field: meta.state, op: eq, value: shipped}, {field: meta.taskCount, op: gte, value: 1}]
    format: percent
    note: Of the shipped requests that took at least one task, the share where no task was rejected or abandoned. A request that shipped without a task is in neither half, because there was no implementation to accept.
  - label: Rework spend
    group: Quality
    kind: sum
    field: meta.reworkCents
    format: money
    note: Spend that produced no accepted outcome and had to be discarded or repeated, such as a failed attempt that contributed nothing, an abandoned implementation, an unnecessary retry, an implementation rejected and replaced. Money spent investigating a request that was then answered honestly is NOT here; holding the line is a valid outcome.
  - label: Defects reported
    group: Quality
    kind: countWhere
    where: {field: meta.kind, op: in, value: [bug, incident]}
    note: Requests filed as a bug or an incident in this window, meaning something already shipped did not work. It counts the report, not its severity, and it cannot say which release introduced the fault, because nothing links a bug back to one.
  # ---- Autonomy as a business effect, not a blended percentage. ----
  - label: Outcomes reached with no human decision
    group: What autonomy saved
    kind: countWhere
    where: [{field: meta.state, op: in, value: [shipped, answered]}, {field: meta.decidedAt, op: missing}]
    note: Requests that reached a shipped change or an honest answer without anyone being asked to decide anything.
  - label: Outcomes that needed one
    group: What autonomy saved
    kind: countWhere
    where: [{field: meta.state, op: in, value: [shipped, answered]}, {field: meta.decidedAt, op: exists}]
    note: Requests that reached an outcome, but only after a person decided something. An approval accepted unchanged is the candidate for raising this agent's autonomy next.
  - label: Still waiting on a person
    group: What autonomy saved
    kind: countWhere
    where: {field: meta.recommendationState, op: eq, value: proposed}
    note: Recommendations put in front of a person and not yet decided. This is the queue autonomy is meant to shrink.
series:
  - label: Shipped outcomes per week
    dateField: meta.shippedAt
    where: {field: meta.state, op: eq, value: shipped}
    bucket: week
    buckets: 8
    measures:
      - {label: Shipped, field: meta.actualCents, kind: count}
  - label: Spend on what shipped, per week
    dateField: meta.shippedAt
    where: {field: meta.state, op: eq, value: shipped}
    bucket: week
    buckets: 8
    format: money
    measures:
      - {label: Spent, field: meta.actualCents, kind: sum}
primary:
  field: title
  subtitle: [kind, tags]
fields:
  - {key: title, label: Request}
  - {key: kind, label: Kind, from: meta.kind, format: badge, tones: {bug: bad, incident: bad, gap: warn, idea: info, question: muted}}
  - {key: product, label: Product, from: meta.product, format: link, to: product, hideWhenConstant: true}
  - {key: tags, label: Tags, from: meta.tags, priority: 3}
  - {key: estimate, label: Estimated, from: meta.estimateCents, format: money, total: true, priority: 2}
  - {key: actual, label: Actual, from: meta.actualCents, format: money, total: true}
  - {key: rework, label: Rework, from: meta.reworkCents, format: money, total: true}
  - {key: tasks, label: Tasks, from: meta.taskCount, format: mono, align: right, priority: 3}
  - {key: asked, label: Asked, from: meta.askedAt, format: date, priority: 2}
  - {key: shipped, label: Shipped, from: meta.shippedAt, format: date, priority: 2}
rowLink: /dashboard/objects/{id}
# Every row here is a request, so every row reaches its own report.
rowActions:
  - {label: Report, href: '/dashboard/p/feature/{id}'}
