# The Factory floor — every engineering task, newest first, with what is
# stuck at the top of the eye. An ordinary `list` over the object noun: the
# task IS the record a person reads, so there is no worker-run source here and
# none is needed. Each row opens the task; the pull request is one move on from
# there. No new table, no new route. Sits in the plugin's own nav section with
# the backlog before it and the costs and the log after it — intake, work,
# what it cost.
#
# The cost strip under the stats is the historical read: what the tasks cost
# per week for the last eight weeks, estimated beside actual. A task is
# counted in the week its last run ended (`costUpdatedAt`), every attempt
# summed, so a task retried across two weeks lands whole in the second.
slug: factory-floor
title: Factory floor
description: Every engineering task — its contract, its checks, its pull request and who it is waiting on.
icon: hammer
nav: {section: Software factory, order: 3}
archetype: list
source: {kind: objects, objectType: engineering_task}
# Tasks change state as workers claim, finish and get reviewed; the floor
# re-reads itself every 15s while open so what is stuck stays true.
live: {every: 15}
sort: {field: createdAt, dir: desc}
stats:
  - {label: Tasks, kind: count}
  - {label: Waiting on a person, kind: countWhere, where: {field: status, op: eq, value: awaiting_review}}
  - {label: Changes requested, kind: countWhere, where: {field: status, op: eq, value: changes_requested}}
  - {label: Accepted, kind: countWhere, where: {field: status, op: eq, value: accepted}}
  - {label: Retried, kind: countWhere, where: {field: meta.attempt, op: gte, value: 2}}
  - {label: Major in flight, kind: countWhere, where: {field: meta.sizeClass, op: eq, value: major}}
  # A task carries evidence when its first verification entry points at an
  # artifact. The accessor indexes into the array; there is no artifact-link
  # format for a field, so the proof itself is one tap on from the row.
  - {label: Carrying evidence, kind: countWhere, where: {field: meta.verification.0.artifactIds.0, op: exists}}
  - {label: Spent, kind: sum, field: meta.actualCents, format: money}
series:
  - label: Per week, last 8
    dateField: meta.costUpdatedAt
    bucket: week
    buckets: 8
    format: money
    measures:
      - {label: Estimated, field: meta.estimateCents, kind: sum}
      - {label: Actual, field: meta.actualCents, kind: sum}
# The row leads with the task, wide and never truncated; what used to be
# four narrow columns (repository, size, risk, attempt, who asked) reads as
# one muted line under it. A fact that is the same on every visible row —
# one repository, one product — is hoisted to the line above the table
# instead of repeated down it, and `priority` says which columns a phone
# drops first. `Decision min` is not here: it is a planning figure, and it
# lives on the backlog and on the task's own record.
primary:
  field: title
  subtitle: [repo, size, risk, attempt, request]
fields:
  - {key: title, label: Task}
  - {key: repo, label: Repository, from: meta.repoSlug, format: mono, hideWhenConstant: true}
  - {key: product, label: Product, from: meta.productSlug, format: mono, hideWhenConstant: true, priority: 3}
  - {key: size, label: Size, from: meta.sizeClass, format: badge, tones: {major: warn, minor: info, patch: muted}}
  - {key: risk, label: Risk, from: meta.riskClass, format: badge, tones: {docs: muted, marketing: muted, deps: info, ui: info, logic: warn, auth: bad, billing: bad, schema: bad, infra: bad, promise: bad}}
  - {key: status, label: Status, from: status, format: badge, tones: {drafted: muted, ready: info, dispatched: info, running: info, awaiting_review: warn, changes_requested: warn, accepted: ok, rejected: bad, abandoned: muted}}
  - {key: attempt, label: Attempt, from: meta.attempt, format: mono}
  # The request by its own title, not its id: the number on the row was the
  # one fact nobody could read.
  - {key: request, label: Asked by, from: meta.requestId, format: link, to: request}
  # `false` here means a check failed. No verification record at all is not
  # a failure, and the renderer says "not recorded" for it.
  - {key: verified, label: Verified, from: meta.verification.0.passed, format: badge, tones: {'true': ok, 'false': bad}}
  # Model spend: the planner's estimate, and the sum of every run's `cents`
  # written back by core when a run for this task ends.
  - {key: estimate, label: Estimated, from: meta.estimateCents, format: money, total: true, priority: 2}
  - {key: actual, label: Actual, from: meta.actualCents, format: money, total: true, priority: 2}
  - {key: pr, label: PR, from: meta.prUrl, format: link, priority: 2}
  - {key: created, label: Opened, from: createdAt, format: date, priority: 2}
# Abandoned tasks are the archive, not the floor; a workspace that wants them
# replaces this file by slug.
filters:
  - {field: status, op: neq, value: abandoned}
rowLink: /dashboard/objects/{id}
# The request's whole story, reached from the task that serves it. A task
# whose `requestId` is missing shows no link rather than a dead one.
rowActions:
  - {label: Report, href: '/dashboard/p/feature/{meta.requestId}'}
