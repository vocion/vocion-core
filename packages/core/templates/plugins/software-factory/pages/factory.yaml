# Factory - the briefing, and the landing page.
#
# This page does not explain the factory's records. It briefs a person on
# their factory. In about twenty seconds they should know: are we okay, does
# anything need me, what is being built, what is next, what changed, what did
# it cost. That is the order below, and it is deliberate - two things blocked
# on a person outrank seven things allegedly in flight.
#
# Three rules keep it honest, and each one used to be broken here.
#
#   A heading is a promise. "In progress" lists only outcomes a worker is on
#   right now. Approved and queued outcomes are counted in one line and live
#   on Work; they are not dressed up as work in flight.
#
#   Nothing is ranked without a reason. A request with no recorded reason
#   cannot enter Next. The shortfall surfaces once, as a factory quality
#   defect, not one apologetic row at a time.
#
#   One number, one meaning. "Needs you" counts decisions that require human
#   judgment - restatements of one question collapse into it, and routine
#   approvals an agent already answered for itself are accounted for
#   separately. It is not a queue depth, and nothing else on this page
#   reports a second, different count of the same thing.
#
# Every `note` on a panel is one short line a person reads. Every `method` is
# how the figures were computed, and it is never drawn beside the numbers: it
# sits behind "How this is measured". The page states conclusions; the method
# is one click away.
slug: factory
title: Factory
description: How the factory is doing, what needs you, what is being built, what is next, what changed, and what it is costing.
icon: gauge
nav: {section: Business, order: 0}
archetype: overview
panels:
  # 1. The read. Synthesised after every panel below is computed, from those
  #    panels, so it can never contradict them.
  - kind: judgment
    title: Judgment

  # 2. What only a person can decide. Three at most, each with the filer's
  #    recommendation and whether it is holding work up. Nothing needing a
  #    person collapses the whole section to one line.
  - kind: needsYou
    title: Needs you
    href: /dashboard/inbox
    limit: 3
    # A sourceRef reads `<subject>:<detail>`. These prefixes name one record
    # rather than a subject, so two decisions under them are two decisions.
    perRecordSources: [action_run, mission-check, object, request, ask, worker_run]
    method: >-
      One open decision record is not one decision. Records sharing a group key,
      or filed under the same subject, are counted once: a mission check that
      re-files the same unanswered question every hour produces a queue depth,
      not a person being asked eight times. Routine approvals an agent already
      recommended an answer for are not judgment calls and are counted apart.
      A decision blocks work when it names the record it is holding up.

  # 3. What a worker is on RIGHT NOW. The tasks decide membership, not the
  #    outcome's own status.
  - kind: active
    title: In progress
    objectType: request
    statusIn: [active, building, new, candidate]
    stateField: meta.state
    stateIn: [in_scope, triaged, building, new]
    limit: 3
    rowLink: /dashboard/p/feature/{id}
    tasks:
      objectType: engineering_task
      joinField: meta.requestId
      completeStatus: [accepted]
      workingStatus: [claimed, running]
      waitingStatus: [awaiting_review]
    method: >-
      An outcome is in progress when at least one engineering task under it is
      claimed or running. An outcome with no contracted task is approved or
      queued; an outcome whose tasks have all stopped is waiting on a review.
      Both are counted in this panel's own line and listed on Work.

  # 4. What the factory intends next, and why. Three at most.
  - kind: next
    title: Next
    objectType: request
    statusIn: [new, candidate, active]
    stateField: meta.state
    stateIn: [new, triaged, in_scope]
    orderBy: meta.priority
    limit: 3
    noteFields: [whyNote, priorityReason]
    rowLink: /dashboard/p/feature/{id}
    method: >-
      The order comes from the backlog ranking and is never drawn: a priority
      integer is a ranking, not an answer. The reason comes from the record's
      own reason codes. A request with no recorded reason is not ranked at all,
      because a rank without a reason is a number asking to be trusted.

  # 5. What changed. Empty, this is one line.
  - kind: digest
    title: Since last visit
    fallbackHours: 24
    arrivals:
      # When the person ASKED, not when the row was written: the backlog was
      # backfilled, so createdAt would report every request as brand new.
      - {objectType: request, label: requests arrived, dateFields: [meta.askedAt, createdAt]}
    transitions:
      - objectType: request
        to: [shipped]
        label: shipped
        dateFields: [meta.releasedAt, meta.answeredAt, updatedAt]
        detail: 3
      - objectType: engineering_task
        to: [accepted]
        label: changes accepted
        dateFields: [meta.acceptedAt, meta.reviewedAt, updatedAt]
        detail: 3
    rollups:
      - objectType: release
        label: releases
        dateFields: [meta.releasedAt, createdAt]
        moneyField: meta.actualCents
    decisions:
      label: decisions arrived
      risk: []
    method: >-
      Human-meaningful change only, measured from when this viewer last opened
      this page. Deploys roll into one money line and worker runs are not here
      at all; both are on Activity.

  # 6. The products, read as sentences. A product nothing is connected to says
  #    so, because "health unknown" is a label and "not connected" is an act.
  - kind: status
    title: Products
    objectType: product
    headline: title
    healthField: meta.health
    rowLink: /dashboard/objects/{id}
    facts:
      - {kind: field, label: stage, from: meta.stage}
      - {kind: field, label: health, from: meta.health}
      - kind: related
        label: open requests
        objectType: request
        relatedField: meta.product
        subjectFields: [meta.slug, meta.name, title]
        excludeStatus: [shipped, rejected, answered, duplicate]
      - kind: related
        label: changes building
        objectType: engineering_task
        relatedField: meta.productSlug
        subjectFields: [meta.slug, meta.name, title]
        status: [new, claimed, running, awaiting_review]
    method: >-
      Open and building are counted from the request and task records
      themselves, not from the counters an agent refreshes each morning, so a
      line cannot go stale between ticks.

  # 7. What it cost. A trend, not an explanation.
  - kind: economics
    title: Economics
    windowDays: 30
    objectType: engineering_task
    dateFields: [meta.costUpdatedAt, meta.runCompletedAt, createdAt]
    costField: meta.actualCents
    acceptedStatus: [accepted]
    reworkStatus: [rejected, abandoned]
    method: >-
      Spend is every costed piece of work in the window, compared with the
      window before it when there is one. Rework is spend on attempts that did
      not land. It is not called waste: a failed attempt can leave diagnostics,
      a preserved branch and a better next attempt, and nothing yet records
      whether any of it was genuinely pointless.

  # 8. How much of this ran without a person, and the one thing to do about it.
  - kind: autonomy
    title: Autonomy
    windowDays: 7
    method: >-
      Finished without you and ran under a trust rule are work measures.
      Decisions you answered is throughput over the window, not the open queue;
      the queue is reported once, under Needs you.
