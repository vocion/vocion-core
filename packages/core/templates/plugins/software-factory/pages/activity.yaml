# Activity. The bottom of the evidence stack.
#
# This is the one surface where real complexity is welcome, because it is the
# one a person opens when a number above it needs explaining. Everything that
# happened is here. That is not the same as pasting the raw shape of every
# database record onto a screen, so the page is built around four rules.
#
# ONE. A run says four things, not one. `worker_run.status` is a single text
# column and the factory kept asking it to carry four independent facts, which
# produced rows reading "status failed, progress complete, checks passed, pull
# request opened". Execution, verification, output and task disposition are
# separate columns here (libs/factory/runFacts.ts reads them off the same row,
# with no migration), so a run can say honestly: execution completed,
# verification failed, work preserved, retried.
#
# TWO. The unit is the task, not the run. Every run is still here, which is the
# guarantee this page exists to keep, but five attempts at one rename read as
# one piece of work with five attempts under it rather than as five unrelated
# red rows in a twenty row table.
#
# THREE. A failure names its cause and says whether the factory fixed it.
# "Failed" on its own is the weakest thing this page can say, because on a
# factory that retries, most failures are already resolved by the time anyone
# reads them.
#
# FOUR. Progressive disclosure. The row is outcome, result, recovery, cost,
# duration, pull request and time. The agent, the model, the tokens, the
# heartbeat, the lease, the contract and the worker's own paragraph are
# evidence and read inside the row.
#
# Bookkeeping runs (`compact`, `snapshot`) are left out: they are the
# machinery's own noise, not the factory's work.
#
# Live: a worker heartbeats every ~30s with its progress, its cost and a fresh
# lease, so the page re-reads itself every 15s while it is open.
slug: activity
title: Activity
description: Everything the factory did, grouped by the work it was doing, with what happened, what it cost, why anything failed and whether it recovered.
icon: activity
nav: {section: Advanced, order: 1}
archetype: list
source: {kind: workerRuns, kinds: [worker, lead, red-team], limit: 200}
live: {every: 15}
sort: {field: createdAt, dir: desc}

# Activity should mean activity. "All" is the chronological operational
# timeline and the default; "Runs" is the run-oriented table a person debugs
# with; the failure classes are the same rows narrowed to one cause, which is
# what "filter by them" means on a server-rendered page. Releases and
# decisions are genuinely different records and say so by navigating.
views:
  - key: all
    label: All
    note: Everything the factory did, newest first, grouped by the task it was doing.
  - key: runs
    label: Runs
    note: Worker runs only, without the leads' planning cycles or the red-team grades.
    filters: [{field: meta.kind, op: eq, value: worker}]
  - key: unresolved
    label: Unresolved
    note: Runs that did not succeed and that nothing since has fixed. This is the list that is actually waiting on someone.
    filters: [{field: meta.recovery, op: eq, value: unresolved}]
  - key: contract
    label: Contract
    note: Refused before any work started. The contract is wrong, so the lead that wrote it owns this.
    filters: [{field: meta.failureClass, op: eq, value: contract}]
  - key: environment
    label: Environment
    note: The machine could not be made ready. A missing repository, a service that never came up.
    filters: [{field: meta.failureClass, op: eq, value: environment}]
  - key: verification
    label: Verification
    note: The work happened and the checks said no. A retry is the normal answer.
    filters: [{field: meta.failureClass, op: eq, value: verification}]
  - key: releases
    label: Releases
    href: /dashboard/p/releases
  - key: decisions
    label: Decisions
    href: /dashboard/inbox

# The summary used to report 20 runs, 7 completed, 0 lost, 0 running, and
# never said that 13 had failed, which was the dominant condition on the
# screen. Each figure below counts exactly one concept, so no two of them can
# contradict each other, and "Lost" appears only when it is not zero.
stats:
  - {label: Runs, kind: count}
  - {label: Completed, kind: countWhere, where: {field: meta.execution, op: eq, value: completed}}
  - {label: Failed, kind: countWhere, where: {field: meta.execution, op: eq, value: failed}}
  - {label: Cancelled, kind: countWhere, where: {field: meta.execution, op: eq, value: cancelled}}
  - {label: Running, kind: countWhere, where: {field: meta.execution, op: eq, value: running}}
  - {label: Lost, kind: countWhere, where: {field: status, op: eq, value: lost}, hideWhenZero: true}
  # The metric that beats a failure count: how much of what went wrong the
  # factory already put right without anyone being asked.
  - {label: Recovered, kind: countWhere, where: {field: meta.recovery, op: in, value: [retried, preserved]}}
  - {label: Unresolved, kind: countWhere, where: {field: meta.recovery, op: eq, value: unresolved}}
  - {label: Spend, kind: sum, field: meta.cents, format: money}
  - {label: Spend on unsuccessful attempts, kind: sum, field: meta.cents, format: money, where: {field: meta.successful, op: eq, value: false}}

# The unit is the work, not the run. Attempts read under the task they were
# attempts at.
groupBy: meta.taskKey

primary:
  field: headline
  subtitle: [execution, verification, output, failureClass, recovery]

fields:
  # ---- the row -------------------------------------------------------
  # The worker's self-report, read rather than pasted. Its own prose says
  # "Task send-0011-qa-probe (ui): changed 1 file(s) inside allowed_paths, 2/2
  # checks passed, opened https://github.com/...", which is good evidence and
  # terrible primary copy. Vocion holds every one of those facts as structure.
  - {key: headline, label: What happened, from: meta.headline}
  # The four concepts, each answering its own question.
  - {key: execution, label: Execution, from: meta.execution, format: badge, tones: {completed: ok, failed: bad, cancelled: muted, running: info, queued: muted}}
  - {key: verification, label: Verification, from: meta.verification, format: badge, tones: {passed: ok, failed: bad, not_run: muted}}
  - {key: output, label: Output, from: meta.output, format: badge, tones: {pull_request: ok, work_preserved: warn, no_changes: muted, none: muted}}
  - {key: disposition, label: Task, from: meta.disposition, format: badge, tones: {accepted: ok, rejected: bad, retried: warn, open: info}, priority: 2}
  # Why it went wrong, so the red rows stop all saying the same word.
  - {key: failureClass, label: Cause, from: meta.failureClass, format: badge, tones: {contract: warn, environment: warn, verification: bad, worker: bad, control: muted}}
  # Whether the factory fixed it. Blank on a run that did not need fixing.
  - {key: recovery, label: Recovery, from: meta.recoveryNote}
  - {key: cents, label: Cost, from: meta.cents, format: money, total: true}
  - {key: duration, label: Duration, from: meta.durationSeconds, format: duration, priority: 2}
  - {key: pr, label: PR, from: meta.outputUrl, format: link}
  - {key: created, label: When, from: createdAt, format: relative}

  # ---- the evidence, inside the row ----------------------------------
  # Everything below this line answers a question an investigator has and a
  # reader does not. It is one click away, on the row, and never in a column.
  - {key: agent, label: Agent, from: meta.agentSlug, format: mono, detail: true}
  - {key: kind, label: Kind, from: meta.kind, format: badge, tones: {worker: info, lead: muted, red-team: warn}, detail: true}
  - {key: rawStatus, label: Recorded status, from: status, format: mono, detail: true}
  - {key: model, label: Model, from: meta.model, format: mono, detail: true}
  - {key: attempt, label: Attempt, from: meta.attempt, format: mono, detail: true}
  - {key: tokens, label: Tokens, from: meta.tokens, format: mono, detail: true}
  - {key: checks, label: Checks, from: meta.checks, format: mono, detail: true}
  - {key: files, label: Files changed, from: meta.filesChanged, format: mono, detail: true}
  - {key: task, label: Contract task, from: meta.input.task.task_id, format: mono, detail: true}
  - {key: risk, label: Risk class, from: meta.input.task.risk_class, format: mono, detail: true}
  - {key: repo, label: Repository, from: meta.input.task.repo, format: mono, detail: true}
  - {key: branch, label: Branch, from: meta.result.branch, format: mono, detail: true}
  - {key: started, label: Started, from: meta.claimedAt, format: date, detail: true}
  - {key: finished, label: Finished, from: meta.completedAt, format: date, detail: true}
  # A heartbeat and a lease are the live signal. They matter while a run is
  # alive and are noise on a run that finished yesterday, so they are never a
  # column and are simply absent once the run stops writing them.
  - {key: heartbeat, label: Heartbeat, from: meta.heartbeatAt, format: relative, detail: true}
  - {key: lease, label: Lease, from: meta.leaseExpiresAt, format: relative, detail: true}
  - {key: progress, label: Last progress, from: meta.progress, format: progress, detail: true}
  # Shows only on a run a person asked to stop; an off flag is not a badge.
  - {key: stop, label: Stop asked, from: meta.stopRequested, format: badge, tones: {'true': warn}, detail: true}
  - {key: error, label: Error, from: meta.error, detail: true}
  # The worker's own paragraph, kept whole, where an investigator can read it.
  - {key: summary, label: Worker's own report, from: meta.summary, detail: true}

# Both directions with the outcome page: from a run, back to the work it
# served. An action whose href the row cannot fill is not drawn, so a run with
# no request simply has no link rather than a link to a 404.
rowActions:
  - {label: Outcome, href: '/dashboard/p/feature/{meta.requestId}'}
