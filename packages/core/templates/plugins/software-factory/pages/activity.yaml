# Activity. The evidence stream, buried on purpose.
#
# This was the Factory log, and it is where the factory's own record now
# lives: every worker run, newest first, with the lead's planning ticks, the
# dispatched jobs and the red-team grades, the model's own summary, the tokens
# it spent and the pull request one tap away. Rendered by the core `list`
# archetype over the `workerRuns` source (worker_run rows, see
# docs/entities/worker-run.md); no new table, no new route. Bookkeeping runs
# (`compact`, `snapshot`) are left out: they are the machinery's own noise,
# not the factory's work.
#
# It sits under Advanced because a run is not something a person manages. It
# is what a person reads when a number above it needs explaining. Releases,
# the other half of this section, is a hidden page at /dashboard/p/releases,
# reached from here and from Products rather than from the nav.
#
# Live: a worker heartbeats every ~30s with its progress, its cost and a
# fresh lease, so the page re-reads itself every 15s while it is open. A
# running row shows its phase moving, its heartbeat ageing and its lease
# holding, and a row that has gone quiet is visible before the reaper marks
# it lost. One request per interval per open tab; nothing new is emitted.
slug: activity
title: Activity
description: Every run the factory made, with who ran it, what kind it was, what it cost in money and tokens, what it said it did, and the pull request it opened.
icon: activity
nav: {section: Advanced, order: 1}
archetype: list
source: {kind: workerRuns, kinds: [worker, lead, red-team], limit: 200}
live: {every: 15}
sort: {field: createdAt, dir: desc}
stats:
  - {label: Runs, kind: count}
  - {label: Completed, kind: countWhere, where: {field: status, op: eq, value: completed}}
  - {label: Lost, kind: countWhere, where: {field: status, op: eq, value: lost}}
  - {label: Running, kind: countWhere, where: {field: status, op: eq, value: running}}
primary:
  field: summary
  subtitle: [agent, kind, attempt]
fields:
  - {key: agent, label: Agent, from: meta.agentSlug, format: mono, hideWhenConstant: true}
  - {key: kind, label: Kind, from: meta.kind, format: badge, tones: {worker: info, lead: muted, red-team: warn}, hideWhenConstant: true}
  - {key: status, label: Status, from: status, format: badge, tones: {queued: muted, running: info, paused: muted, awaiting_review: warn, completed: ok, failed: bad, cancelled: muted, lost: bad}}
  - {key: attempt, label: Attempt, from: meta.attempt, format: mono}
  # What the worker said on its last heartbeat, and whether it is still breathing.
  - {key: progress, label: Progress, from: meta.progress, format: progress}
  - {key: heartbeat, label: Heartbeat, from: meta.heartbeatAt, format: relative}
  - {key: lease, label: Lease, from: meta.leaseExpiresAt, format: relative, priority: 3}
  # Shows only on a run a person asked to stop; an off flag is not a badge.
  - {key: stop, label: Stop asked, from: meta.stopRequested, format: badge, tones: {'true': warn}}
  - {key: cents, label: Cost, from: meta.cents, format: money}
  - {key: tokens, label: Tokens, from: meta.tokens, format: mono, align: right, priority: 3}
  - {key: summary, label: Said it did, from: meta.summary}
  - {key: pr, label: PR, from: meta.result.pr_url, format: link, priority: 2}
  - {key: started, label: Started, from: createdAt, format: date, priority: 3}
  - {key: finished, label: Finished, from: meta.completedAt, format: date, priority: 2}
# No run detail route exists yet; the activity stream filtered to workers is
# the nearest place a run can be read whole.
rowLink: /dashboard/activity?kind=worker
