# Runs. Every engineering run the factory made, newest first: the one a person
# opens when something is running, or when something stopped and they want to
# know why and fix it.
#
# Chris, 2026-09-28: "a log of runs with active run and historical run detail
# pages … fail clearly so that we can attach from here to fix the gap and re
# run." The row says what happened and why it stopped; the run page (the same
# preview, full width) says where it stopped, links the raw log, and carries a
# "Fix it from Claude Code" prompt with everything needed to attach.
#
# The facts are libs/factory/runFacts.ts (execution, verification, output,
# cause, recovery), read once for every row. Live: a worker heartbeats every
# ~30s, so the page re-reads itself every 15s while it is open.
slug: runs
title: Runs
description: Every run, engineering and agent, newest first — what is running now, what stopped and why, and what each attempt cost.
icon: activity
nav: {section: Software factory, order: 6, secondary: true}
archetype: list
source: {kind: workerRuns, kinds: [worker], agentRuns: true, limit: 200}
live: {every: 15}
sort: {field: createdAt, dir: desc}

# All first: the page opens on the history, newest first (Chris: "i don't
# see any of our historical runs" — it opened on Active, empty between runs).
views:
  - key: all
    label: All
    note: Every run, newest first.
  - key: active
    label: Active
    note: Running or waiting for a worker right now.
    filters: [{field: meta.execution, op: in, value: [running, queued]}]
  - key: engineering
    label: Engineering
    note: The engineer's runs in the sandbox, one per attempt.
    filters: [{field: meta.kind, op: eq, value: worker}]
  - key: agents
    label: Agents
    note: QA reviews and the product manager's checks.
    filters: [{field: meta.kind, op: eq, value: agent}]
  - key: unresolved
    label: Needs you
    note: Stopped, and nothing since has fixed it. Open one to see where it stopped and why.
    filters: [{field: meta.recovery, op: eq, value: unresolved}]

stats:
  - {label: Running, kind: countWhere, where: {field: meta.execution, op: in, value: [running, queued]}}
  - {label: Needs you, kind: countWhere, where: {field: meta.recovery, op: eq, value: unresolved}}
  - {label: Spend, kind: sum, field: meta.cents, format: money}

primary:
  field: headline
  subtitle: [kind, execution, failureClass, recovery, cents, created]

fields:
  - {key: headline, label: What happened, from: meta.headline}
  - {key: kind, label: Kind, from: meta.kind, format: badge, tones: {worker: info, agent: muted}}
  - {key: execution, label: Run, from: meta.execution, format: badge, tones: {completed: ok, failed: bad, cancelled: muted, running: info, queued: muted}}
  - {key: failureClass, label: Why it stopped, from: meta.failureClass, format: badge, tones: {contract: warn, environment: warn, verification: bad, worker: bad, control: muted}}
  - {key: recovery, label: Recovery, from: meta.recoveryNote}
  - {key: cents, label: Cost, from: meta.cents, format: money, total: true}
  - {key: duration, label: Duration, from: meta.durationSeconds, format: duration, priority: 2}
  - {key: pr, label: PR, from: meta.outputUrl, format: link, priority: 2}
  - {key: created, label: When, from: createdAt, format: relative}
  - {key: error, label: Error, from: meta.error, detail: true}

rowLink: /dashboard/p/runs/{meta.runRef}
rowActions:
  - {label: Feature, href: ['/dashboard/p/feature/{meta.requestId}', '/dashboard/objects/{meta.taskRecordId}']}
