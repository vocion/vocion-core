# AppCurious — the portfolio. The outcome view and the factory project's home:
# every product, how it is doing, what it costs beside the incumbent, what
# shipped this month and how fast requests turn into releases. First in the
# nav on purpose — a person opens this, and only then the Software factory
# section underneath, which is the evidence for every number here.
#
# The counters (open requests, shipped this month, median days, P1s, health)
# are AGENT-MAINTAINED: a page's stats compute over their own rows, so a count
# across requests or releases per product cannot be a page stat. The lead's
# `keep-the-board-honest` tick recomputes them from the records each morning
# and stamps `countersUpdatedAt`; the prose beside this file says so, and the
# column labels say so. Revenue stays empty until a verified source exists.
slug: portfolio
title: AppCurious
description: Every product — stage, health, our price beside the incumbent's, what shipped this month, what is still owed, and how fast a request becomes a release.
icon: layout-dashboard
nav: {section: AppCurious, order: 0}
archetype: list
source: {kind: objects, objectType: product}
sort: {field: meta.stage, dir: asc}
stats:
  - {label: Products, kind: count}
  - {label: Live, kind: countWhere, where: {field: meta.stage, op: eq, value: live}}
  - {label: Down or degraded, kind: countWhere, where: {field: meta.health, op: in, value: [down, degraded]}}
  - {label: Products with a P1 open, kind: countWhere, where: {field: meta.p1Open, op: gte, value: 1}}
  - {label: Median days to ship (avg), kind: avg, field: meta.medianDaysToShip, suffix: d}
fields:
  - {key: title, label: Product}
  - {key: stage, label: Stage, from: meta.stage, format: badge, tones: {idea: muted, building: info, dogfood: warn, live: ok, retired: muted}}
  - {key: live, label: Live, from: meta.urls.app, format: link}
  - {key: health, label: Health, from: meta.health, format: badge, tones: {ok: ok, degraded: warn, down: bad, unknown: muted}}
  - {key: price, label: Our price, from: meta.ourPrice, format: mono}
  - {key: incumbentPrice, label: Incumbent list price, from: meta.incumbent.listPrice, format: mono}
  - {key: shipped, label: Shipped this month (agent-maintained), from: meta.shippedThisMonth, format: mono}
  - {key: open, label: Open requests (agent-maintained), from: meta.openRequests, format: mono}
  - {key: p1, label: P1 open (agent-maintained), from: meta.p1Open, format: mono}
  - {key: median, label: Median days to ship (agent-maintained), from: meta.medianDaysToShip, format: mono}
  - {key: revenue, label: Revenue (no source yet), from: meta.revenueMonthCents, format: money}
  - {key: updated, label: Counters as of, from: meta.countersUpdatedAt, format: date}
rowLink: /dashboard/objects/{id}
