# Products. The portfolio board, and the simplest page in the factory.
#
# The test it is built to pass: could a person understand the state of every
# Squatch product while walking from their desk to the kitchen? That rules out
# most of what a board wants to become. Six facts per product: what it is,
# where it is in its life, whether it is healthy, who answers for it, what we
# charge against the incumbent, what last shipped and what is still owed. And
# nothing else above them.
#
# What used to be here and is not any more, and why:
#
# - Seven summary cards over two products. A summary earns its place by saving
#   the reader from reading the rows; over two rows it saves nobody anything.
#   `statsMinRows` brings them back when the portfolio is worth summarising.
# - "Median days to ship". The records do not link a request to the release
#   that closed it, and the whole corpus is days old, so the figure was 0, an
#   artifact of when the factory started, read as a claim about how fast we
#   are. The tick leaves it empty below three properly closed requests.
# - "Shipped this month". A count is the Performance question. What a person
#   wants from a portfolio is WHAT shipped, so the row carries the newest
#   release's announcement line with when it shipped under it.
# - A revenue column, headed "Revenue (no source yet)". No verified revenue
#   source exists, so no row could fill it, and a column of dashes advertised
#   the gap once per row in the width a fact could have used. It is not
#   declared here. Core's `hideWhenEmpty` is the general form of the same
#   rule, on by default, so the day a field here stops being fillable the
#   board loses it without anyone editing this file, and the day revenue is
#   recorded the field can be declared and will appear on its own.
# - Four pricing columns. Ours, theirs, their name and the date are ONE fact.
#   `format: compare` draws it as one, with the date on hover.
# - "(agent-maintained)" on six labels. Provenance in the furniture. It is in
#   the type schema and behind "About this data"; the board is where it is
#   read, not where it is explained.
# - "Counters as of" on every row. Freshness is not news until it stops being
#   fresh: `staleAfterHours` draws it only on a row that has gone stale, and
#   while every row is current the field is empty everywhere and disappears.
#
# The card is derived from the requests and releases themselves
# (`derive: productBoard`, libs/workspace/productBoard.ts), not from a
# morning tick, so what it says needs you is what Work would show you.
#
# The drill from a product is its OVERVIEW, `/dashboard/p/products/<id>`:
# what needs attention by name, the work underway, recent releases, what is
# measured, and the product's context, with the raw record behind Technical
# details. The generic record page is one ⋯ away for editing.
slug: products
title: Products
description: How are my products doing?
icon: layout-dashboard
nav: {section: Software factory, order: 1}
archetype: list
pluginPanel: false
layout: block
source: {kind: objects, objectType: product}
derive: productBoard
sort: {field: meta.stage, dir: asc}
# Drawn once the portfolio is big enough that reading every row is the slower
# way to answer these. At two products the rows already say all of it.
statsMinRows: 8
stats:
  - {label: Products, kind: count}
  - {label: Live, kind: countWhere, where: {field: meta.stage, op: eq, value: live}}
  - {label: In internal testing, kind: countWhere, where: {field: meta.stage, op: eq, value: dogfood}}
  - {label: Issue detected, kind: countWhere, where: {field: meta.healthState, op: eq, value: issue}}
# THE CARD (products red team, 2026-09-28). In the order the questions are
# asked, one line each:
#
#   Send                                          (small mark, the name opens the overview)
#   Send big files and know when they were opened (what it is for)
#   Review 2 decisions                            (the ONE thing that needs you, loudest)
#   1 change in progress · 5 open requests        (what is underway, each its own link)
#   Latest: Email delivery tracking · 8h ago      (what last shipped, links to it)
#   Internal testing · Health check outdated · Built on Squatch Core   (quiet)
#
# Lifecycle, health and attention are three different axes and never share a
# word: "dogfood" is a stage, not a warning; a health check older than the
# latest release says "outdated", never "ok"; and a decision is said once, as
# the action ("Review 2 decisions"), never also as "2 to decide".
primary:
  field: title
  subtitle: [tagline, attention, inProgress, backlog, workNone, latest, latestWhen, stage, health, deps]
  thumb: icon
fields:
  - {key: title, label: Product}
  - {key: icon, label: Mark, from: meta.icon, format: icon}
  - {key: tagline, label: What it is for, from: meta.tagline}
  - key: attention
    label: Needs you
    from: meta.attentionLine
    emphasis: strong
    toneFrom: meta.attentionTone
    breakBefore: true
    # Decisions and blocked work open Work on the right tab for this product;
    # an issue (no Work tab) opens the product's overview.
    href: ['/dashboard/p/work?product={meta.slug}#{meta.attentionTab}', '/dashboard/p/products/{id}']
  - {key: inProgress, label: In progress, from: meta.inProgressLine, breakBefore: true, href: '/dashboard/p/work?product={meta.slug}#in-progress'}
  - {key: backlog, label: Open requests, from: meta.backlogLine, href: '/dashboard/p/work?product={meta.slug}#proposed'}
  - {key: workNone, label: Work, from: meta.workNoneLine}
  # The release's own page (releases.yaml `recordPage`), the same place a
  # Releases row and every other link to a release opens.
  - {key: latest, label: Latest release, from: meta.latestReleaseLine, breakBefore: true, href: '/dashboard/p/releases/{meta.latestReleaseId}'}
  - {key: latestWhen, label: Released, from: meta.latestReleaseAt, format: relative}
  - {key: stage, label: Stage, from: meta.lifecycle, breakBefore: true}
  - {key: health, label: Health, from: meta.healthLabel, toneFrom: meta.healthTone}
  - {key: deps, label: Built on, from: meta.dependencyLine}
  # Behind the product's overview, not on the card.
  - {key: owner, label: Accountable, from: meta.accountableUser, detail: true}
  # The architecture the Release seat read from the repositories (3.31.0):
  # the diagram artifact, resolved to its picture (core: services/workspace/pageImages.ts).
  - {key: architecture, label: Architecture, from: meta.architecture.diagramArtifactId, format: image, detail: true}
  - {key: mappedAt, label: Architecture read, from: meta.architecture.mappedAt, format: relative, detail: true}
  - key: price
    label: Our price
    from: meta.ourPrice
    format: compare
    beside: {from: meta.incumbent.listPrice, labelFrom: meta.incumbent.name, checkedFrom: meta.incumbent.checkedOn}
    detail: true
# THE OVERVIEW a card's name opens, for the person who runs the product
# (Chris, 2026-10-01: "make it better for a PM ... I should have
# explorability into release engineer needs and configs there (env and git
# etc) but that shouldn't be primary"). One question per section, in the
# order a product manager asks them: how is it doing (its measures, each with
# its direction, and live health in one line), what needs me (one line each,
# with the move), what is moving (You, Now, Next), what shipped (and whether
# it was seen live), what is proposed (Build or Dismiss), what it looks like,
# what the wiki says about it, what it is, then how it ships (environments,
# repositories, the pipeline: folded, for the Release engineer), what
# happened, and what it is connected to.
recordPage:
  kind: product
  sections: [doing, needs, moving, shipped, proposed, look, wiki, about, engineering, activity, related]
  folded: [engineering]
# Live in place: a request, a release or an environment written anywhere
# re-reads the board and the overview on the shared stream.
live: {follow: ['list:request', 'list:release', 'list:environment', runs], every: 30}
# The name opens the product's overview. The card's other lines open their
# own places, so the card itself is not one big link.
rowLink: '/dashboard/p/products/{id}'
rowActionsAs: menu
rowActions:
  - {label: All releases, href: '/dashboard/p/releases?product={meta.slug}'}
  - {label: Wiki, href: /dashboard/p/wiki}
  - {label: Edit fields and history, href: '/dashboard/objects/{id}'}
