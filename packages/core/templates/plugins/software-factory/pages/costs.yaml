# Costs — where the money went. Every request, whatever its state, with
# what its tasks were expected to cost and what they actually cost, grouped
# by feature tag so a tag's total is the cumulative spend on everything that
# carried it. An ordinary `list` over the `request` noun: the figures are
# ROLLED UP onto the request record by core when a task's cost is written
# (objects/request/type.yaml, `rollups:`), so this page reads them like any
# other field and never computes across types itself.
#
# A request tagged twice sits under both tags on purpose — "what has search
# cost" and "what has billing cost" both want the request that touched both.
# The stats on top are over every row once. "Spent this month" is the spend
# on requests whose cost last moved this month; a request's cost moves when
# one of its tasks' runs ends, so a long-running feature is counted in the
# month its latest run ended, not spread across the months it took.
slug: costs
title: Costs
description: Where the money went — what each feature and bug was estimated to cost, what it actually cost, and the cumulative spend under every feature tag.
icon: coins
nav: {section: Software factory, order: 5}
archetype: list
source: {kind: objects, objectType: request}
sort: {field: meta.actualCents, dir: desc}
groupBy: meta.tags
stats:
  - {label: Total spent, kind: sum, field: meta.actualCents, format: money}
  - {label: Total estimated, kind: sum, field: meta.estimateCents, format: money}
  - {label: Spent this month, kind: sum, field: meta.actualCents, format: money, where: {field: meta.rollupsUpdatedAt, op: since, value: month}}
  - {label: Requests with spend, kind: countWhere, where: {field: meta.actualCents, op: exists}}
  # A feature is a gap or an idea; a bug is a bug. Incidents and questions are
  # neither, and are left out of both averages rather than folded into one.
  - {label: Average cost of a feature, kind: avg, field: meta.actualCents, format: money, where: {field: meta.kind, op: in, value: [gap, idea]}}
  - {label: Average cost of a bug, kind: avg, field: meta.actualCents, format: money, where: {field: meta.kind, op: eq, value: bug}}
primary:
  field: title
  subtitle: [kind, tags]
fields:
  - {key: title, label: Request}
  - {key: kind, label: Kind, from: meta.kind, format: badge, tones: {bug: bad, incident: bad, gap: warn, idea: info, question: muted}}
  - {key: product, label: Product, from: meta.product, format: link, to: product, hideWhenConstant: true}
  - {key: tags, label: Tags, from: meta.tags}
  - {key: estimate, label: Estimated, from: meta.estimateCents, format: money, total: true}
  - {key: actual, label: Actual, from: meta.actualCents, format: money, total: true}
  - {key: variance, label: Variance, from: meta.varianceCents, format: money, total: true, priority: 2}
  - {key: tasks, label: Tasks, from: meta.taskCount, format: mono, align: right, priority: 2}
  - {key: state, label: State, from: meta.state, format: badge, tones: {new: warn, triaged: info, in_scope: ok, out_of_scope: muted, building: info, shipped: ok, answered: muted}}
  - {key: updated, label: Cost as of, from: meta.rollupsUpdatedAt, format: date, priority: 3}
rowLink: /dashboard/objects/{id}
