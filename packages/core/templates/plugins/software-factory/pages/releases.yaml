# Releases. What reached people, newest first, one day at a time.
#
# A product owner opens this page with four questions: what changed for
# users, is it live and did verification pass, does anything need me, and who
# should hear about it. The technical evidence — commits, the deploy run, the
# shas, the QA screenshots — is on each release's own page, one click away,
# and nowhere on the list (the 2026-09-28 red team: a row led with
# "send 930a23f6ebbd", and "No factory feature in this deploy" sat over two
# changes to the factory worker presented as product improvements).
#
# The rows are written by the deploy (a script or the engineer) over
# POST /api/v1/objects with the deploy's own key; the release pack links each
# pull request to its task, request and QA verdict in code
# (`services/factory/releasePack.ts`). What a row SAYS is one reading of that
# record, shared with its page (`libs/workspace/releaseFeed.ts`):
#
#   - the title is the shipped feature's own title; a deploy of several says
#     the first and counts the rest; a deploy of only machinery says so;
#   - a commit that changed the factory worker, the deploy pipeline or CI is
#     internal, judged from its subject (`fix(worker): …`) because the record
#     carries subjects and not file paths;
#   - verification is three questions, never one badge: QA's acceptance of
#     each feature, the post-deploy health check, and the product impact;
#   - the announcement is a workflow. The deploy script's placeholder line is
#     "not prepared", never content.
#
# Before one release per deploy, each surface's deploy was its own record
# (`surface: web`). Those read as deployments of one surface, under All
# deployments. They are not grouped into releases: two rows sharing a commit
# may not have gone out together, and a shared commit alone does not prove it.
slug: releases
title: Releases
description: Recent product changes, verification, and announcements.
icon: rocket
nav: {section: Software factory, order: 3}
archetype: list
pluginPanel: false
source: {kind: objects, objectType: release}
derive: releaseFeed
sort: {field: meta.releasedAt, dir: desc}
groupBy: meta.releaseDayLabel
layout: feed
views:
  - key: releases
    label: Releases
    filters: [{field: meta.releaseKind, op: eq, value: release}]
  - key: attention
    label: Needs attention
    note: Releases with something unresolved — a failed or missing check, a feature shipped without QA, a result that got worse, or someone who asked and has not heard.
    filters: [{field: meta.needsAttention, op: eq, value: true}]
  - key: deployments
    label: All deployments
    note: Every deploy on record, including the per-surface deployments written before one release per deploy.
# Timeframed, and an issue is not the same fact as a check nobody ran.
stats:
  - {label: 'Releases, last 30 days', kind: countWhere, where: {field: meta.releasedAt, op: since, value: 30d}}
  - {label: 'Issues detected, last 30 days', kind: countWhere, where: [{field: meta.releasedAt, op: since, value: 30d}, {field: meta.issueDetected, op: eq, value: true}]}
  - {label: 'Verification missing, last 30 days', kind: countWhere, where: [{field: meta.releasedAt, op: since, value: 30d}, {field: meta.verificationMissing, op: eq, value: true}]}
statsMinRows: 4
primary:
  field: headline
  subtitle: [context, verification, communication]
feed:
  aside: [version]
  summary: summary
  lines: [verificationLine]
  note: attention
fields:
  - {key: headline, label: Release, from: meta.headline}
  - {key: version, label: Version, from: meta.versionShort, format: mono}
  - {key: context, label: Where and when, from: meta.context}
  - {key: summary, label: Summary, from: meta.summary}
  - {key: verification, label: Verification, from: meta.verification, format: badge, tones: {Verified: ok, Issue detected: bad, Verification missing: warn}}
  - {key: verificationLine, label: Checks, from: meta.verificationLine}
  # Communication state. "Not needed" is internal maintenance, with its
  # reason on the release's page.
  - {key: communication, label: Announcement, from: meta.communication, format: badge, tones: {Published: ok, Approved: info, Draft ready: info, Not prepared: warn, Not needed: muted}}
  - {key: attention, label: Needs attention, from: meta.attention}
rowLink: /dashboard/p/releases/{id}
# A product card opens THIS page as that product's releases: `?product=send`
# narrows the feed, and the picker offers every product the rows carry.
queryFilters:
  - {param: product, field: meta.product, label: Product, picker: {labelFrom: meta.productName}}
# The release's own page, `/dashboard/p/releases/<id>`
# (`services/factory/releaseReport.ts`). The announcement's moves, in the
# workspace's words: draft and review each open a chat with the release as
# context and its prompt sent. Publishing is one press on the page itself
# (2.27.0): `release.announce` runs as the person, posting the words with the
# live screenshot to the workspace's Slack channel (Undo deletes the post), or,
# with no Slack connection, a copy as rich text with the picture and the picture
# as a download. The `publish` prompt below is what an agent is asked when a
# person asks for it in chat instead.
recordPage:
  kind: release
  actions:
    draft:
      label: Draft announcement
      agent: product-manager
      prompt: >-
        Draft the announcement for this release, following write-release-notes:
        one or two sentences on what people can now do, written only from the
        verified changes on the release page, never from internal or reverted
        commits, and never mentioning QA, criteria, proof counts, pull request
        numbers or plan risks (the page shows those beside it). Write it to the release's `announcement` with
        `notesSource: agent` and `announcementState: draft`. Do not publish it. Then show me the draft beside
        the evidence for each claim.
    review:
      label: Review draft
      agent: product-manager
      prompt: >-
        Show me this release's draft announcement beside the verified changes
        it claims. Flag any sentence the evidence does not support, suggest the
        fix, and ask me to approve it; when I approve, set `notesSource: human`
        and `announcementState: approved`.
    publish:
      label: Publish
      agent: product-manager
      prompt: >-
        Propose `release.announce` for this release with its `releaseId`; it
        posts the approved announcement with its live picture to the
        workspace's Slack channel. The words and the picture are read off the
        release, so do not restate them.
