# Releases. What actually reached people, newest first.
#
# Buried under Activity: it has no nav row of its own, and is reached from
# Activity and from Products. It now carries the announcement line the
# Changelog used to show on a page of its own, so the public wording of every
# release is still one place, beside the deploy that carried it.
#
# The row the Products board's "shipped this month" counts, and the row
# `tell-the-requester` reads to close the loop. Written by the deploy (a
# script or the engineer) over POST /api/v1/objects with the deploy's own key,
# then the health result against the same row once the post-deploy check has
# run.
slug: releases
title: Releases
description: Every deploy that reached people, with product, version, what it carried, the announcement line the public reads, what the post-deploy check said, and who has been told.
icon: rocket
nav: {section: Advanced, order: 2, hidden: true}
archetype: list
source: {kind: objects, objectType: release}
sort: {field: meta.releasedAt, dir: desc}
groupBy: meta.product
stats:
  - {label: Releases, kind: count}
  - {label: Major, kind: countWhere, where: {field: meta.sizeClass, op: eq, value: major}}
  - {label: Patch, kind: countWhere, where: {field: meta.sizeClass, op: eq, value: patch}}
  - {label: Unhealthy after, kind: countWhere, where: {field: meta.healthAfter, op: in, value: [down, degraded]}}
  - {label: Health unknown, kind: countWhere, where: {field: meta.healthAfter, op: eq, value: unknown}}
  - {label: Notes owned by a person, kind: countWhere, where: {field: meta.notesSource, op: eq, value: human}}
primary:
  field: title
  subtitle: [version, size, commit]
fields:
  - {key: title, label: Release}
  - {key: version, label: Version, from: meta.version, format: mono}
  - {key: size, label: Size, from: meta.sizeClass, format: badge, tones: {major: warn, minor: info, patch: muted}}
  - {key: health, label: Health after, from: meta.healthAfter, format: badge, tones: {ok: ok, degraded: warn, down: bad, unknown: muted}}
  - {key: released, label: Released, from: meta.releasedAt, format: date}
  - {key: deploy, label: Deploy run, from: meta.deployRunUrl, format: link, priority: 3}
  - {key: commit, label: Commit, from: meta.commitSha, format: mono}
  # What the shipped tasks were expected to cost and what they cost, rolled up
  # over `taskIds`; the total under each product is that product's spend on
  # what actually reached people.
  - {key: estimate, label: Estimated, from: meta.estimateCents, format: money, total: true, priority: 2}
  - {key: actual, label: Actual, from: meta.actualCents, format: money, total: true, priority: 2}
  - {key: notesBy, label: Notes by, from: meta.notesSource, format: badge, tones: {agent: info, human: ok}, priority: 3}
  - {key: announced, label: Announced, from: meta.announcedAt, format: date, priority: 2}
  # The line the public reads. This is what the Changelog page carried; it
  # is a column here rather than a page of its own.
  - {key: announcement, label: What shipped, from: meta.announcement}
rowLink: /dashboard/objects/{id}
