# Work. The queue a person manages, not a browser over the records behind it.
#
# The outcome is still the object, and that part was right: one row is one
# thing the factory owes or is delivering, and the tasks, runs, checks and
# pull requests underneath it are the detail page's job. What was wrong was
# the reading. The page showed the record: seven states, a decision state
# beside a proposed outcome, sixteen columns, "not recorded" eighty times,
# seventeen finished items, five token probes. That is a database browser for
# a good data model.
#
# So this page is DERIVED (`derive: workQueue`, libs/workspace/workQueue.ts).
# The derivation is where the state machine turns into four lanes a person
# thinks in, the reason codes turn into a sentence, and the money turns into
# the one figure the lane makes sense of. The manifest below declares the
# reading; it no longer declares the schema.
#
#  - **Next**, ordered and numbered, because "what comes next" is the one
#    question the section exists to answer. Only a request whose reason was
#    recorded is ranked: an outcome nobody wrote a reason for cannot be
#    argued to be the second most important thing we do, so it queues
#    unnumbered and the heading says how many are in that state. Today that
#    is all of them, and the page says so once, in the heading, rather than
#    once per row in a column of blanks.
#  - **In progress**, what a worker is building right now.
#  - **Waiting on you**, derived rather than stored: an outcome whose
#    recommendation nobody has decided is not moving, whatever its state
#    says. Work owns the work state and shows it; Review still owns the
#    decision, and the minutes it will cost ride on this lane's heading
#    rather than standing alone as a metric.
#  - **Done recently**, capped, with the rest one link away in Activity.
#
# Probes and end-to-end records are dropped here. They are legitimate history
# and they are not management information; burying them is what the new
# architecture was for.
slug: work
title: Work
description: What we owe, what is running, what is stopped on you, and what just landed.
icon: list-checks
nav: {section: Business, order: 2}
archetype: list
source: {kind: objects, objectType: request}
# Seven states, four lanes, and every sentence on the row: see
# libs/workspace/workQueue.ts, which is also where the mapping is argued with.
derive: workQueue
# States move as workers claim, finish and get reviewed; the queue re-reads
# itself every 15s while open so what is stuck stays true.
live: {every: 15}
# The derivation ordered the lanes and the rows inside them; the page just
# keeps that order.
sort: {field: meta.order, dir: asc}
groupBy: meta.lane
# The top line, in four figures. Each is a count of the WHOLE queue, stamped
# on every row by the derivation, so a capped lane never makes the queue look
# shorter than it is. Tasks written and decision minutes are gone from here:
# one was plumbing, and the other belongs to the lane it describes.
stats:
  - {label: Next, kind: max, field: meta.nextCount}
  - {label: In progress, kind: max, field: meta.progressCount}
  - {label: Waiting on you, kind: max, field: meta.waitingCount}
  - {label: Urgent, kind: max, field: meta.urgentCount}
# Five things about a row: the outcome, why it is here, what is happening to
# it, which product it is for, and what it costs. Urgent, waiting and major
# appear under the title only when they are true. Anything else about this
# outcome is on the outcome's own page, which is where the row goes.
primary:
  field: title
  subtitle: [why, flags]
fields:
  - {key: title, label: Outcome}
  # One human sentence, built from the closed reason list. Never `manual_toil`.
  - {key: why, label: Why, from: meta.whyLine}
  # Conditional facts. An empty list renders as nothing, not as a dash.
  - {key: flags, label: Flags, from: meta.flags}
  # Next is numbered one, two, three. Nothing ranked means no column at all
  # (`hideWhenEmpty`), because a column of blanks is not a ranking.
  - {key: rank, label: '#', from: meta.rank, format: mono, align: right}
  - {key: status, label: What is happening, from: meta.workLine}
  - {key: product, label: Product, from: meta.product, format: link, to: product, hideWhenConstant: true}
  # An estimate while it is queued, spend against the estimate while it runs,
  # what it cost once it is done. One column, because a person choosing what
  # happens next needs to know whether it is four dollars or eighty-five.
  - {key: cost, label: Cost, from: meta.costLine, format: mono, align: right}
# The row IS the drill-down. There was a "Report" affordance on every row; it
# was never a report, it was the outcome, and a row that opens somewhere else
# than the thing it names is a second place to click for no second meaning.
rowLink: /dashboard/p/feature/{id}
