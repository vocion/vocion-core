# Work. The queue a person manages, not a browser over the records behind it.
#
# The outcome is still the object, and that part was right: one row is one
# thing the factory owes or is delivering, and the tasks, runs, checks and
# pull requests underneath it are the detail page's job. What was wrong was
# the reading. The page showed the record: seven states, a decision state
# beside a proposed outcome, sixteen columns, "not recorded" eighty times,
# seventeen finished items, five token probes. That is a database browser for
# a good data model.
#
# So this page is DERIVED (`derive: workQueue`, libs/workspace/workQueue.ts).
# The derivation is where the state machine turns into the lanes a person
# thinks in, the reason codes turn into a sentence, and the money turns into
# the one figure the lane makes sense of. The manifest below declares the
# reading; it no longer declares the schema.
#
# THREE lanes, as three tabs. It was four sections down one page, and two of
# them asked different questions of the same axis: "Next" and "Waiting on
# you" both held work nobody had started, split by whether a person owed a
# decision. That is a STATE, not a lane — so it moved onto the row as a
# badge, and the two sections became one.
#
#  - **In progress**, what a worker is on now, with what has STOPPED at the
#    top. `state: building` is a claim the request makes about itself; a
#    request with tasks written and none of them running is stalled, and a
#    page that draws it as building is lying about what is happening. The
#    derivation reads that off the tasks (`runningTaskCount`), so nothing is
#    stored that could disagree with them.
#  - **Proposed**, everything owed and not started. An outcome whose
#    recommendation nobody has decided leads the lane, because it is the only
#    work here that moves the moment it is read; the ranked queue follows.
#    Only a request whose reason was recorded is ranked — an outcome nobody
#    wrote a reason for cannot be argued to be the second most important
#    thing we do, so it queues unnumbered and the lane's note says how many
#    are in that state.
#  - **Done**, capped, with the rest one link away in Activity.
#
# What each lane could not draw rides on its NOTE (`meta.laneNote`) rather
# than in its name: a tab that grows a clause every time the data changes
# stops being a place to tap.
#
# Probes and end-to-end records are dropped here. They are legitimate history
# and they are not management information; burying them is what the new
# architecture was for.
slug: work
title: Work
description: What is running, what is proposed, and what just landed.
icon: list-checks
nav: {section: Software factory, order: 2}
archetype: list
source: {kind: objects, objectType: request}
# Seven states, three lanes, and every sentence on the row: see
# libs/workspace/workQueue.ts, which is also where the mapping is argued with.
derive: workQueue
# States move as workers claim, finish and get reviewed; the queue re-reads
# itself every 15s while open so what is stuck stays true.
live: {every: 15}
# The derivation ordered the lanes and the rows inside them; the page just
# keeps that order.
sort: {field: meta.order, dir: asc}
groupBy: meta.lane
# Three lanes, three tabs. A lane was a section heading with its rows beneath
# it, which meant the page was as tall as the whole queue and a person on a
# phone scrolled past everything in progress to reach the one decision they
# came to make. As tabs each lane is a place to stand, the counts read at a
# glance without a grid of figures above them, and the page is the height of
# one lane.
groupsAs: tabs
# BLOCKS, not a table. A table compares rows down a column, and that is the
# right shape when the question is which is biggest. It is the wrong shape
# here: sixteen columns on a phone is a horizontal scrollbar over a header
# row the reader keeps looking back up at, and this queue is deliberately
# sparse — a queued outcome nobody wrote a reason for has nothing to put in
# most of them. A block draws the facts this row HAS and is short when it
# has few.
layout: block
# The four-figure top line is gone. Each tab carries its own count, so the
# grid above them was the same three numbers said twice.
# Five things about a row, and every one of them in the subtitle rather than
# as a labelled fact: a fact list draws an uppercase label above each value,
# which on a five-field row is five labels a person reads past to reach five
# values. The state is a badge beside the outcome; everything else is one
# muted line under it. Anything more about this outcome is on its own page.
primary:
  field: title
  # A row answers: what is it and for which product (the title), the user
  # problem in one sentence (`summary`), and what it needs — decide, review,
  # or where it stands, with how long it has waited (`detail`). Internal
  # status that helps nobody decide (`no criteria`, `no mock`, a rank) is on
  # the feature page, not repeated on every row (Chris, 2026-09-25).
  subtitle: [status, blocked, unmet, summary, detail, why, cost, product]
  # THE PICTURE LEADS. What this outcome changes, drawn by the platform from
  # what the record says, at the moment the record says it
  # (`services/factory/proposalVisual.ts`). It is a shape, not a screenshot:
  # a page and the rows this contract changes, or the components the plan
  # touches and the direction between them. A row nobody has classified gets
  # an empty frame, which is the honest drawing of "nobody has said what this
  # changes yet" and is the only card on the board that reports a missing
  # fact by being empty rather than by printing a complaint.
  thumb: visual
  # No fallback mark: a generic icon stretched into the media slot is
  # decoration. A row with no real picture has no slot at all.
fields:
  - {key: title, label: Outcome}
  # An artifact id, resolved to its served url by the page layer. The record
  # names the artifact; a url copied onto the record would be a second copy of
  # a fact that can quietly disagree with the first.
  - {key: visual, label: Preview, from: meta.visual, format: image}
  # The badge, and the reason the lanes could be collapsed from four to
  # three: it says which row set this row belongs to, so one list can hold
  # rows in different states without a heading between every pair of them.
  # Blocked reads bad, an undecided recommendation reads warn, and work that
  # nobody has started is muted because it is not asking for anything yet.
  # Stage, activity and blocker are three facts (review, 2026-09-24). The
  # badge is the state; `detail` is the plain sentence saying what is
  # happening and whether it needs the reader; `blocked` is only ever an
  # obstacle somebody wrote down. Normal waiting — dispatch, QA, merge — has
  # its own name and is never painted as failure.
  - {key: status, label: Status, from: meta.state, format: badge, tones: {Blocked: bad, Building: info, Awaiting dispatch: muted, Awaiting QA: info, Ready to merge: warn, Decide: warn, Staged: muted, Deferred: muted, Returned to PM: warn, Returned to Design: warn, Returned to Eng: warn, Returned to QA: warn, Shipped: ok, Shipped · helped: ok, Shipped · did not help: bad, Answered: muted, Queued: muted, Triaged: muted, In scope: muted, Not triaged: muted}}
  - {key: blocked, label: Blocked on, from: meta.blockerLine, format: badge, tones: {}}
  # What this row cannot show. A `ui` or `flow` outcome owes a mockup before
  # it is decided and an after-shot before it closes; the row says which is
  # missing and the lane counts them, the same way it reports an unranked
  # queue. Work nobody has classified claims nothing, so the gate stays quiet
  # until `surface` says a picture is owed.
  #
  # Since the platform draws the proposal visual, `no mock` fires only where
  # the drawing could not be made — and `no after` still bites on everything
  # that ships, which is the half nothing can draw from a record: what the
  # running product actually looks like has to be captured from the running
  # product.
  # The QA gate, and it is code rather than a prompt: a finished outcome whose
  # criteria nobody checked, or which failed, is a claim and not a release.
  # Stating it structurally means it cannot be argued away by a model having a
  # confident day — which is the whole reason the criteria carry evidence.
  - {key: unmet, label: Unmet, from: meta.contractGap, format: badge, tones: {}}
  # The contract: what has to be true before this is done. A proposal says
  # how many criteria it carries, or that it carries none — "done when it
  # works" is not something a person can agree to. Once a worker is on it the
  # line switches to how much of the contract holds.
  # Conditional facts. An empty list renders as nothing, not as a dash.
  # What is happening, minus whatever the badge already said. A queued row's
  # line is empty on purpose: "Queued" under a badge reading "Queued" is the
  # repetition this page was redrawn to lose.
  - {key: summary, label: Problem, from: meta.problem}
  - {key: detail, label: What is happening, from: meta.workLine}
  # One human sentence, built from the closed reason list. Never `manual_toil`.
  - {key: why, label: Why, from: meta.whyLine}
  # An estimate while it is queued, spend against the estimate while it runs,
  # what it cost once it is done. One figure, because a person choosing what
  # happens next needs to know whether it is four dollars or eighty-five.
  - {key: cost, label: Cost, from: meta.costLine, format: mono}
  # Which product it is for, hoisted out of every row when they all say the same.
  - {key: product, label: Product, from: meta.product, format: link, to: product, hideWhenConstant: true}
  # Next is numbered one, two, three. Nothing ranked means no rank at all.
# The row IS the drill-down. There was a "Report" affordance on every row; it
# was never a report, it was the outcome, and a row that opens somewhere else
# than the thing it names is a second place to click for no second meaning.
rowLink: /dashboard/p/feature/{id}
# A product card opens THIS page as that product's work: `?product=send`
# narrows every lane to Send and the page says so, with a way back.
queryFilters:
  - {param: product, field: meta.product, label: Product}
