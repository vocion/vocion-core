# Changelog — the public-facing read of the releases: newest first, the
# announcement line and the release notes' owner, nothing internal. "Public-
# facing" means written for the public in the house voice, not publicly
# hosted: this page sits behind the dashboard like every workspace page, and
# publishing the same rows outside is the `release.announce` action's job, one
# release at a time. A field cannot render markdown (formats are text, badge,
# date, mono, money, link…), so the row carries the one-line `announcement`
# and the notes are one tap on, on the release record.
slug: changelog
title: Changelog
description: What shipped, newest first, in the words the public reads — the announcement line per release, and whether a person owns its notes yet.
icon: megaphone
nav: {section: AppCurious, order: 2}
archetype: list
source: {kind: objects, objectType: release}
sort: {field: meta.releasedAt, dir: desc}
stats:
  - {label: Releases, kind: count}
  - {label: Announced, kind: countWhere, where: {field: meta.announcedAt, op: exists}}
  - {label: Waiting on an announcement, kind: countWhere, where: {field: meta.notesSource, op: eq, value: human}}
  - {label: Notes still the agent's draft, kind: countWhere, where: {field: meta.notesSource, op: eq, value: agent}}
primary:
  field: announcement
  subtitle: [product, version, size]
fields:
  - {key: released, label: Date, from: meta.releasedAt, format: date}
  - {key: product, label: Product, from: meta.product, format: mono, hideWhenConstant: true}
  - {key: version, label: Version, from: meta.version, format: mono}
  - {key: size, label: Size, from: meta.sizeClass, format: badge, tones: {major: warn, minor: info, patch: muted}}
  - {key: announcement, label: What shipped, from: meta.announcement}
  - {key: notesBy, label: Notes owned by, from: meta.notesSource, format: badge, tones: {agent: info, human: ok}, priority: 3}
  - {key: announced, label: Announced, from: meta.announcedAt, format: date, priority: 2}
rowLink: /dashboard/objects/{id}
