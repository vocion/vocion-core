# Recommendations — the ten things in front of a person, and what they said.
# An ordinary `list` over the `request` noun, cut to the requests the Product
# manager has recommended: the page schema sources objects, worker runs and
# artifacts, not asks, so the batch is read from the fields the manager writes
# on the request when it files each ask (`recommendedAt`, `recommendationBatch`,
# `recommendedOutcome`, `recommendationState`) and when a decision lands
# (`decidedAt`, `decisionReason`). The asks themselves are decided on Needs
# you (/dashboard/inbox?kind=recommendation), one sheet per batch; this page
# is the record of them, grouped by batch, newest first. "Awaiting decision"
# is the honest count of what is waiting on the accountable person.
slug: recommendations
title: Recommendations
description: Every request the Product manager put in front of a person — the proposed outcome, its priority and evidence, and what was decided — by batch, newest first.
icon: compass
nav: {section: Software factory, order: 2}
archetype: list
source: {kind: objects, objectType: request}
sort: {field: meta.recommendedAt, dir: desc}
groupBy: meta.recommendationBatch
stats:
  - {label: Recommended, kind: count}
  - {label: Awaiting decision, kind: countWhere, where: {field: meta.recommendationState, op: eq, value: proposed}}
  - {label: Approved, kind: countWhere, where: {field: meta.recommendationState, op: eq, value: approved}}
  - {label: Rejected, kind: countWhere, where: {field: meta.recommendationState, op: eq, value: rejected}}
  - {label: Builds proposed, kind: countWhere, where: {field: meta.recommendedOutcome, op: eq, value: build}}
  - {label: Ideas of ours, kind: countWhere, where: {field: meta.source, op: eq, value: product-manager}}
fields:
  - {key: title, label: Request}
  - {key: product, label: Product, from: meta.product, format: mono}
  - {key: outcome, label: Proposed, from: meta.recommendedOutcome, format: badge, tones: {build: ok, answer: info, decline: warn, merge: muted}}
  - {key: state, label: Decision, from: meta.recommendationState, format: badge, tones: {proposed: warn, approved: ok, rejected: bad}}
  - {key: priority, label: Priority, from: meta.priority, format: mono}
  - {key: reason, label: Why, from: meta.priorityReason}
  - {key: cost, label: Decision min, from: meta.decisionCost, format: mono}
  - {key: kind, label: Kind, from: meta.kind, format: badge, tones: {bug: bad, incident: bad, gap: warn, idea: info, question: muted}}
  - {key: recommended, label: Recommended, from: meta.recommendedAt, format: date}
  - {key: decided, label: Decided, from: meta.decidedAt, format: date}
  - {key: decision, label: Their reason, from: meta.decisionReason}
filters:
  - {field: meta.recommendedAt, op: exists}
rowLink: /dashboard/objects/{id}
