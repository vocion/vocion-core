slug: crm_activity
label: Activity
code: CACT
description: Native CRM activity in this workspace. Separate from external CRM mirrors.
schema:
  type: object
  properties:
    kind:
      type: string
      enum:
        - note
        - task
        - call
        - meeting
        - email
      x-display:
        label: Kind
    companyId:
      type: integer
      x-display:
        label: Company ID
    contactId:
      type: integer
      x-display:
        label: Contact ID
    dealId:
      type: integer
      x-display:
        label: Deal ID
    ownerId:
      type: string
      x-display:
        label: Owner ID
    occurredAt:
      type: string
      format: date-time
      x-display:
        label: Occurred at
    dueAt:
      type: string
      format: date-time
      x-display:
        label: Due at
    summary:
      type: string
      x-display:
        label: Summary
    completed:
      type: boolean
      x-display:
        label: Completed
