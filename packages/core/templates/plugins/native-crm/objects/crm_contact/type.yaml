slug: crm_contact
label: Contact
code: CON
description: Native CRM contact in this workspace. Separate from external CRM mirrors.
schema:
  type: object
  properties:
    name:
      type: string
      x-display:
        label: Name
    email:
      type: string
      format: email
      x-display:
        label: Email
    companyId:
      type: integer
      x-display:
        label: Company ID
    ownerId:
      type: string
      x-display:
        label: Owner ID
    lifecycle:
      type: string
      enum:
        - lead
        - mql
        - sql
        - customer
      x-display:
        label: Lifecycle
    doNotContact:
      type: boolean
      x-display:
        label: Do not contact
