slug: data_room
label: Data room
description: >-
  The source of record for one client engagement — status, deliverables, cast,
  sources with their weight, and the open items that keep nothing from falling
  through. Documents are written from it and filed back into it.
icon: folder-open
schema:
  type: object
  properties:
    client:
      type: string
      description: The client's name as used in prose ("the Northwind team").
    codename:
      type: string
      description: Codename for an NDA'd deal; used in filenames so a PDF cannot leak an identity.
    status:
      type: string
      description: The status blockquote — one paragraph, dated.
    statusAt:
      type: string
      format: date
    stage:
      type: string
      description: Engagement stage in the CRM's own words (Discovery, Proposal sent, Signed, In delivery).
    deal:
      type: object
      description: The CRM deal this room is linked to, both directions.
      properties:
        system: {type: string}
        id: {type: string}
        url: {type: string}
        amount: {type: number}
    cast:
      type: array
      description: Every person on the engagement, with role and email.
      items:
        type: object
        properties:
          name: {type: string}
          role: {type: string}
          email: {type: string}
          side: {type: string, enum: [client, seller, partner]}
    deliverables:
      type: array
      description: Documents promised or delivered, newest first.
      items:
        type: object
        properties:
          date: {type: string}
          title: {type: string}
          artifactId: {type: integer}
          status: {type: string, enum: [planned, drafted, sent, signed]}
    domains:
      type: array
      description: Email domains that identify this client's people — how a transcript or thread is matched to the room.
      items: {type: string}
    aliases:
      type: array
      description: Other names the engagement goes by in calendar titles and subjects.
      items: {type: string}
sourceRelevance:
  zoom: 2.0
  gmail: 1.5
  drive: 1.0
  hubspot: 1.0
classificationPrompt: >-
  Given a call transcript, email thread or shared document, decide which client
  engagement it belongs to. Match on attendee or sender email domains first,
  then on the client's name or codename in the title or subject. Report a
  confidence from 0 to 1 and the evidence you matched on.
