version: 1
# Placeholder — `workspace:apply --project <id|slug>` resolves this to the live project.
orgId: proj_client_documents
name: Metacto — Client documents
description: >-
  The client-engagement workflow as a workspace: one data room per engagement
  (the source of record), and the branded, paginated documents written from it
  — proposals, scope docs, partnership updates — each render-verified before it
  is called done. Metacto is the seller; every client here is fictional.
lead: proposal-writer
# The whole capability comes from two plugins (packages/core/templates/plugins):
# `proposals` brings the writer, the house sheet framework, the Proposals app
# and its team; it depends on `data-rooms`, which brings the room type, the
# skill, the keeper and the collector. This workspace adds only its brand.
plugins: [proposals]
goal: Every client document is grounded in its data room and render-verified before a person sees it.
defaults:
  temperature: '0.2'
