version: 1
# Placeholder — `workspace:apply --project <id|slug>` resolves this to the
# live project id at apply time.
orgId: proj_engineering_team
name: Cobalt Works — Engineering
description: >-
  Sample engineering workspace for Cobalt Works, a fictional company that
  runs a small platform team. One team of five: a lead who answers "can we
  ship?" and four specialists — pull-request review, incident response,
  releases, and documentation. Everything a person would see or an
  outbound action would touch stops at a human first.
lead: engineering-lead
# The factory pages — Work, Performance, Releases, Products — come from the
# `software-factory` plugin rather than from this workspace, which is the
# point: Cobalt Works is a brand and a cast, not a second copy of the
# mechanism. Its fictional queue lives in `data/factory/` and is written by
# `seed-factory-demo.ts`, so the pages have a history to read.
plugins: [software-factory]
# accountableUser is deliberately omitted so the template names nobody. A
# CLI apply may add `accountableUser: <email>` before applying, and the
# team inherits it.
defaults:
  model: gpt-5.4-mini
  temperature: '0.2'
