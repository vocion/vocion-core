# Go-to-market: engagements, proposals and the growth loop, with the GTM
# surfaces a workspace switches on. Installed in a workspace when any of its
# plugins or surfaces is on there.
id: gtm
name: GTM
icon: target
tint: peach
order: 3
description: Engagements and their proposals, and growth work judged on what it returned.
# Not `data-rooms`: Projects are a core workspace noun, in every app's sidebar
# (2026-10-27), so turning projects on never installs GTM.
plugins: [proposals, meeting-followup, growth-loop]
surfaces: [personalization, discovery, proposals]
entry: /gtm/proposals
nav: [GTM, Growth]
