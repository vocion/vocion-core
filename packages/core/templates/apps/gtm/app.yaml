# Go-to-market: engagements, proposals and the growth loop, with the GTM
# surfaces a workspace switches on. Installed in a workspace when any of its
# plugins or surfaces is on there.
id: gtm
name: GTM
icon: target
tint: peach
order: 3
description: Move a deal forward. Prepare a meeting, draft a proposal, or get a follow-up ready for review.
# Not `data-rooms`: Projects are a core workspace noun, in every app's sidebar
# (2026-10-27), so turning projects on never installs GTM.
plugins: [proposals, meeting-followup, growth-loop]
surfaces: [personalization, discovery, proposals]
entry: /gtm/proposals
nav: [GTM, Growth]
# Guided starting points, what waits on you, upcoming meetings, and each
# engagement's deal. Pipeline totals need normalized closed-stage semantics
# (AppHomeSchema, docs/entities/app-manifest.md).
home:
  launch:
    - title: Draft a proposal
      description: Choose a deal. Turn its available evidence into a proposal you can review.
      icon: file-text
      prompt: 'Draft a proposal for this engagement: '
      first: true
    - title: Prepare for a meeting
      description: A brief with the people, last discussion, open questions and source links.
      icon: calendar
      ask: Prepare a brief for my next upcoming client meeting. Confirm its date and attendees, then use available deal and meeting evidence for the last discussion, open questions and suggested next step. Link the sources and flag missing context.
    - title: Draft call follow-ups
      description: Find recent calls that need a reply and prepare drafts for approval.
      icon: mail
      ask: Find this week's client calls that still need a follow-up, using available evidence. Show the calls and dates first, then prepare follow-up drafts for my review. Do not send anything.
    - title: Find the next proposal
      description: See which deals have enough evidence to start, and what is missing.
      icon: search
      ask: Which engagements are ready for a proposal? Show up to five candidates with source links, the evidence that makes each ready, and any missing decision or input. Do not claim readiness from stage alone.
    - title: Open proposal board
      description: Continue an existing proposal or see where each draft stands.
      icon: folder-open
      href: /gtm/proposals
  measures:
    - key: followups
      label: Follow-up drafts awaiting approval
      source: approvals
      actions: [meeting.draft_followup]
      href: /dashboard/inbox
    - key: meetings
      label: External meetings, next 7 days
      source: state
      query: {sets: [calendar.event], filter: {start: {since: now, until: +7d}, external_attendees: {gt: 0}}}
  projects:
    # An engagement anchored to a CRM deal uses the app, until its deal is
    # closed: a won or lost deal is history, not something to work today.
    include:
      - {field: meta.anchor, op: exists}
      - {field: meta.stage, op: lacks, value: closed}
    measures:
      - key: deal
        label: Deal
        source: project
        field: meta.anchor.amount
        format: money
        href: /dashboard/projects/{projectId}
      - key: stage
        label: Stage
        source: project
        field: meta.stage
        date: meta.statusAt
        href: /dashboard/projects/{projectId}
      - key: followups
        label: Follow-ups to approve
        source: approvals
        actions: [meeting.draft_followup]
        projectKey: roomId
        href: /dashboard/inbox
