# Go-to-market: engagements, proposals and the growth loop, with the GTM
# surfaces a workspace switches on. Installed in a workspace when any of its
# plugins or surfaces is on there.
id: gtm
name: GTM
icon: target
tint: peach
order: 3
description: Engagements and their proposals, and growth work judged on what it returned.
# Not `data-rooms`: Projects are a core workspace noun, in every app's sidebar
# (2026-10-27), so turning projects on never installs GTM.
plugins: [proposals, meeting-followup, growth-loop]
surfaces: [personalization, discovery, proposals]
entry: /gtm/proposals
nav: [GTM, Growth]
# Where the app opens: the ask bar, what to start, what waits on you, the
# pipeline as the CRM last synced it, and each engagement's deal
# (AppHomeSchema, docs/entities/app-manifest.md).
home:
  launch:
    - title: Find proposals to write
      description: The engagements that are ready for a proposal, from the CRM and the calls.
      icon: search
      ask: Which engagements are ready for a proposal?
      first: true
    - title: Write a proposal
      description: A print-ready proposal drafted from every call, email and file on the deal.
      icon: file-text
      ask: Write a proposal for an engagement. First ask me which one, then draft it from every call, email and file on the deal.
    - title: Follow up on calls
      description: This week's client calls that still owe a follow-up, each drafted for your approval.
      icon: mail
      ask: Which of this week's client calls still owe a follow-up?
    - title: Prepare for a meeting
      description: Who is coming, what you last discussed and what is still open.
      icon: calendar
      ask: Prepare me for my next client meeting. Who is coming, what we last discussed, and what is still open.
    - title: Plan the next brief
      description: What to make next for growth, ranked by the evidence.
      icon: lightbulb
      ask: What should we brief next, from the evidence?
    - title: Proposals
      description: Every engagement's proposal and deck, and where each one stands.
      icon: folder-open
      href: /gtm/proposals
  measures:
    - key: pipeline
      label: Open pipeline
      source: state
      query: {sets: [crm.deal], filter: {stage: {not: [closedwon, closedlost]}}}
      sum: amount
      format: money
    - key: followups
      label: Follow-ups to approve
      source: approvals
      actions: [meeting.draft_followup]
      href: /dashboard/inbox
    - key: meetings
      label: Client meetings, next 7 days
      source: state
      query: {sets: [calendar.event], filter: {start: {since: now, until: +7d}, external_attendees: {gt: 0}}}
    - key: quiet
      label: Deals gone quiet
      source: state
      view: stale-deals
  projects:
    # An engagement anchored to a CRM deal uses the app.
    include: {field: meta.anchor, op: exists}
    measures:
      - key: deal
        label: Deal
        source: project
        field: meta.anchor.amount
        format: money
        href: /dashboard/projects/{projectId}
      - key: stage
        label: Stage
        source: project
        field: meta.stage
        date: meta.statusAt
        href: /dashboard/projects/{projectId}
      - key: followups
        label: Follow-ups to approve
        source: approvals
        actions: [meeting.draft_followup]
        projectKey: roomId
        href: /dashboard/inbox
