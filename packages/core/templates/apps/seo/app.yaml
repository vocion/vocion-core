# The second marketing app, beside Paid Marketing: SEO pages researched
# against what ranks, planned and written on the strongest model, signed off
# early, and shipped to each client's site. Runs many clients from one
# workspace: every batch and page belongs to a client's project.
id: seo
name: Search Engine Optimization
# The header and rail have no room for the full name.
shortName: SEO
# Rankings climbing; a magnifier reads as site search.
icon: trending-up
tint: mint
order: 8
description: Turn search opportunities into reviewed pages. Choose a client, approve the plan, then move drafts through feedback and publishing.
plugins: [seo]
entry: /dashboard/p/seo
nav: [SEO]
# Where the app opens: a greeting, the ask bar to the strategist, what to
# start, what waits on you, and how each client stands (AppHomeSchema,
# docs/entities/app-manifest.md).
home:
  launch:
    - title: Plan the next pages
      description: Choose a client and goal. Get a researched page plan to review before writing begins.
      icon: layers
      ask: Plan the next SEO pages. First ask which client and business goal. Read their existing profile, keywords and batches before proposing new research. Ask only for missing context, then propose a prioritized page plan for review before writing begins.
    - title: Audit a site
      description: Choose a client and find the issues worth fixing first, with evidence and next steps.
      icon: list-checks
      ask: Audit a client's site. First ask me which client, or offer to onboard a new client from their website. Read their latest audit before proposing a new one, then give me the findings and recommended next steps.
    - title: Onboard a client
      description: Start with a website. Confirm the client's goals, audience and voice before planning pages.
      icon: user-plus
      prompt: 'Onboard a new SEO client. Start with their website, check for an existing project, and help me confirm their goals, audience and voice: '
      first: true
      firstTitle: Onboard your first client
    - title: Review drafts
      description: Read pages waiting for your sign-off. Approve or give specific feedback before the batch moves on.
      icon: file-text
      href: /dashboard/p/seo-pages?status=in_review
    - title: Resolve revisions
      description: Reopen pages with requested changes and check the feedback before another draft is written.
      icon: list-checks
      href: /dashboard/p/seo-pages?status=changes_requested
    - title: Check publishing
      description: Follow approved pages through pull requests or site drafts. A draft or open PR is not a live page.
      icon: send
      href: /dashboard/p/seo-pages?status=publishing
  measures:
    - key: review
      label: Pages awaiting review
      source: records
      objectType: seo_page
      where: {field: meta.status, op: eq, value: in_review}
      href: /dashboard/p/seo-pages?status=in_review
    - key: revisions
      label: Pages needing changes
      source: records
      objectType: seo_page
      where: {field: meta.status, op: eq, value: changes_requested}
      href: /dashboard/p/seo-pages?status=changes_requested
    - key: approved
      label: Approved, not yet publishing
      source: records
      objectType: seo_page
      where: {field: meta.status, op: eq, value: approved}
      href: /dashboard/p/seo-pages?status=approved
    - key: published
      label: Published pages
      source: records
      objectType: seo_page
      where: {field: meta.status, op: eq, value: published}
      date: meta.publishedAt
      href: /dashboard/p/seo-pages?status=published
  projects:
    # A client whose SEO profile is set uses the app before it has any records.
    include: {field: meta.seoProfile, op: exists}
    measures:
      - key: goal
        label: Strategy goal
        source: records
        objectType: seo_strategy
        stat: latest
        field: meta.progressLine
        date: meta.updatedAt
        href: /dashboard/objects/{id}
      - key: live
        label: Pages live this month
        source: records
        objectType: seo_page
        where: [{field: meta.status, op: eq, value: published}, {field: meta.publishedAt, op: since, value: month}]
        date: meta.publishedAt
        target: meta.seoCadence.pagesPerMonth
        href: /dashboard/p/seo-pages?project={projectId}&status=published
      - key: findings
        label: Open audit findings
        source: records
        objectType: seo_audit
        stat: latest
        field: meta.openCount
        date: meta.checkedAt
        breakdown:
          - {label: High, field: meta.counts.bySeverity.high}
          - {label: Medium, field: meta.counts.bySeverity.medium}
          - {label: Low, field: meta.counts.bySeverity.low}
        href: /dashboard/objects/{id}
      - key: ranking
        label: Keywords ranking
        source: records
        objectType: seo_keyword
        where: {field: meta.status, op: eq, value: ranking}
        date: meta.checkedAt
        of: {field: meta.status, op: neq, value: dropped}
        href: /dashboard/p/seo-keywords?project={projectId}&status=ranking
      - key: prompts
        label: Prompts naming the client
        source: records
        objectType: seo_prompt
        where: {field: meta.visibility, op: in, value: [mentioned, cited]}
        date: meta.checkedAt
        of: {field: meta.status, op: neq, value: dropped}
        href: /dashboard/p/seo-prompts?project={projectId}
