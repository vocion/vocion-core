# Where the agency's own actions start on the autonomy ladder. Every rule ships
# off. The growth loop's actions (publishing, writing on a brief, asking, a
# hire) keep the bars the growth-loop plugin sets — a rule here would replace
# them, so none is written.
rules:
  # A report or an update to a client. Held for a person by the platform
  # whatever this says; 0.99 is here so the bar reads as meant.
  - action: gmail.send
    autoApproveAbove: 0.99
    enabled: false
    rung: execute-with-approval
    risk: medium
  # A note on the client's account, when a CRM is connected. Reversible, so it
  # may earn its way up once people approve it unchanged.
  - action: hubspot.update
    autoApproveAbove: 0.95
    enabled: false
    rung: recommend
    risk: low
