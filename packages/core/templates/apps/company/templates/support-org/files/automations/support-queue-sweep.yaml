slug: support-queue-sweep
name: Weekday queue sweep
description: >-
  Wakes the Support lead every weekday morning to keep the first-reply mission.
status: active
agent: support-lead
when:
  schedule: '0 13 * * 1-5'
do:
  checkMission: first-reply-inside-a-day
  prompt: >-
    Check the queue. Report what has no first reply, what will miss a business
    day today, and everything waiting on a person with how long it has waited.
    Hand new tickets to the triager, drafts to the reply drafter and anything
    about money, an outage or a defect to the escalation specialist. Send
    nothing.
