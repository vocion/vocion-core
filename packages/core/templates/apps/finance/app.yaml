# Finance: the books kept, the month closed and the board told. Installed in a
# workspace when the finance plugin is on there.
id: finance
name: Finance
icon: calculator
tint: sky
order: 5
description: Prepare financial reports, review the close and decide what happens next in the books.
plugins: [finance]
entry: /dashboard/p/account-rules
nav: [Finance]
# Launch a concrete task; every financial claim still needs its source and date.
home:
  launch:
    - title: Prepare month-end packet
      description: Draft the financials, explain material changes and flag missing close evidence.
      icon: file-text
      prompt: 'Prepare a draft month-end packet for our board and executive team. Use ledger reports, flag missing inputs or unverified close sign-off, and do not send it. Reporting month and year: '
      first: true
      firstTitle: Prepare your first month-end packet
    - title: Review the close
      description: Check completed tasks, blockers and the close date against the calendar.
      icon: calendar-check
      ask: Review the latest close against our close calendar. State the exact period, what is verified complete, what is blocked and who owns each missing item. Do not infer sign-off from a completed run.
    - title: Review expense coding
      description: Check recent expenses against account rules and propose corrections for approval.
      icon: tags
      ask: Review this week's card and bank expenses against our account rules. State the dates and propose any corrections for approval. Ask about vendors or rules that cannot be resolved from our records.
    - title: Draft collection follow-ups
      description: Review overdue balances and draft follow-ups without sending them.
      icon: receipt
      ask: Read our overdue invoices, state the as-of date and group them by age. Draft appropriate collection follow-ups for review; do not send them.
    - title: Check project margins
      description: Compare available delivery costs and revenue with each project's recorded target.
      icon: percent
      ask: Compare project margins with the targets on file. State each period, cite the revenue and cost sources, and name missing cost data or targets instead of estimating them.
    - title: Set up Finance
      description: Check connections, entities and account rules before starting new work.
      icon: settings
      ask: Check Finance setup for this workspace. Show what is already connected and on file, and guide me through missing entities, account rules or reporting prerequisites without replacing existing setup.
  measures:
    - key: close
      label: Latest close run
      source: mission
      mission: close-the-month
    - key: approvals
      label: Finance action approvals
      source: approvals
      actions: [finance.*]
      href: /dashboard/inbox
    - key: cash
      label: Synced bank balances
      source: state
      query: {sets: [finance.account], filter: {account_type: Bank}}
      sum: balance
      format: money
    - key: overdue
      label: Synced overdue balance
      source: state
      view: overdue-invoices
      sum: balance
      format: money
